<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحاضرة | مستر عبدالله خليل</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #0f0f28;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.07);
            --text-primary: #f0f0f5;
            --text-secondary: #b0b0c8;
            --text-muted: #70708a;
            --accent-gradient: linear-gradient(135deg, #4da8da 0%, #7c5ce7 50%, #22d3bb 100%);
            --shadow-glow: 0 0 40px rgba(124, 92, 231, 0.3);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --font-ar: 'Cairo', 'Tajawal', sans-serif;
            --transition-smooth: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; font-size: 16px; }
        body {
            font-family: var(--font-ar);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 70px;
        }
        .aurora-bg {
            position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:hidden;
        }
        .aurora-bg .orb {
            position: absolute; border-radius:50%; filter:blur(120px); opacity:0.22; animation:auroraFloat 20s infinite ease-in-out;
        }
        .aurora-bg .orb:nth-child(1) { width:600px; height:600px; background:radial-gradient(circle, #4da8da 0%, transparent 70%); top:-200px; left:-150px; }
        .aurora-bg .orb:nth-child(2) { width:500px; height:500px; background:radial-gradient(circle, #7c5ce7 0%, transparent 70%); bottom:-150px; right:-150px; animation-delay:-7s; }
        @keyframes auroraFloat {
            0%,100% { transform:translate(0,0) scale(1); }
            25% { transform:translate(60px,-40px) scale(1.1); }
            50% { transform:translate(-30px,50px) scale(0.9); }
            75% { transform:translate(-50px,-30px) scale(1.05); }
        }
        .floating-shapes { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
        .floating-shapes .shape { position:absolute; opacity:0.05; animation:floatShape 15s infinite ease-in-out; }
        .floating-shapes .hex { width:80px; height:46px; border:2px solid rgba(255,255,255,0.3); clip-path:polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); }
        @keyframes floatShape { 0%,100%{transform:translateY(0) rotate(0deg);} 33%{transform:translateY(-40px) rotate(5deg);} 66%{transform:translateY(20px) rotate(-3deg);} }
        .main-content { position:relative; z-index:1; }
        .navbar {
            position:sticky; top:0; z-index:1000; background:rgba(10,10,26,0.8); backdrop-filter:blur(30px);
            border-bottom:1px solid var(--glass-border); padding:0 24px;
        }
        .navbar-inner { max-width:1200px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; height:64px; gap:16px; }
        .navbar-logo { display:flex; align-items:center; gap:10px; text-decoration:none; }
        .navbar-logo .logo-icon { width:40px; height:40px; border-radius:var(--radius-sm); background:var(--accent-gradient); display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; }
        .btn { padding:8px 18px; border-radius:30px; font-family:var(--font-ar); font-weight:600; font-size:0.85rem; border:none; cursor:pointer; transition:var(--transition-smooth); background:transparent; color:var(--text-primary); border:1.5px solid var(--glass-border); text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
        .btn-primary { background:var(--accent-gradient); border:none; color:#fff; }
        .lesson-content { padding:24px; max-width:1000px; margin:0 auto; }
        .video-container { position:relative; width:100%; background:#000; border-radius:var(--radius-lg); overflow:hidden; margin-bottom:24px; }
        .video-container video { width:100%; display:block; max-height:500px; }
        .lesson-header h2 { font-size:1.8rem; font-weight:700; }
        .lesson-meta { display:flex; gap:16px; flex-wrap:wrap; color:var(--text-secondary); margin:8px 0 16px; }
        .progress-section { margin-bottom:24px; }
        .progress-bar { height:8px; background:rgba(255,255,255,0.1); border-radius:10px; overflow:hidden; }
        .progress-fill { height:100%; background:var(--accent-gradient); border-radius:10px; width:0%; transition: width 0.5s; }
        .action-buttons { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:24px; }
        .resources-section { background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--radius-lg); padding:20px; backdrop-filter:blur(10px); margin-bottom:24px; }
        .resources-section h4 { margin-bottom:12px; }
        .resource-item { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
        .empty-state { text-align:center; padding:40px; color:var(--text-muted); }
        .bottom-nav { display:none; position:fixed; bottom:0; left:0; width:100%; background:rgba(15,15,40,0.9); backdrop-filter:blur(25px); border-top:1px solid var(--glass-border); z-index:1000; padding:8px 16px 12px; justify-content:space-around; align-items:center; }
        .bottom-nav a { display:flex; flex-direction:column; align-items:center; gap:4px; text-decoration:none; color:var(--text-muted); font-size:0.7rem; }
        .bottom-nav a.active, .bottom-nav a:hover { color:var(--accent-1); }
        @media (max-width:768px) { .bottom-nav { display:flex; } .video-container video { max-height:300px; } }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="aurora-bg"><div class="orb"></div><div class="orb"></div></div>
<div class="floating-shapes"><div class="shape hex" style="top:10%;left:8%;"></div></div>
<div class="main-content">
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="index.html" class="navbar-logo"><div class="logo-icon">ع</div><span>مستر عبدالله خليل</span></a>
            <div style="display:flex; gap:12px;">
                <a href="courses.html" class="btn btn-sm">الكورسات</a>
                <a href="dashboard.html" class="btn btn-sm">لوحة التحكم</a>
            </div>
        </div>
    </nav>
    <div class="lesson-content" id="lessonContent">
        <div style="text-align:center; padding:60px;">⏳ جاري تحميل المحاضرة...</div>
    </div>
</div>
<nav class="bottom-nav">
    <a href="dashboard.html"><span>🏠</span><span>الرئيسية</span></a>
    <a href="courses.html" class="active"><span>📚</span><span>كورساتي</span></a>
    <a href="exams.html"><span>📝</span><span>الامتحانات</span></a>
    <a href="profile.html"><span>👤</span><span>حسابي</span></a>
</nav>

<script>
    (function() {
        const firebaseConfig = {
            apiKey: "AIzaSyDT0xGqGHzyyeB4qcz5AGMKxESCGZNNEWE",
            authDomain: "abdullah-khalil.firebaseapp.com",
            projectId: "abdullah-khalil",
            storageBucket: "abdullah-khalil.firebasestorage.app",
            messagingSenderId: "530661483867",
            appId: "1:530661483867:web:e2f165e9f808bcfcb8267e"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const lessonId = urlParams.get('id');

        if (!lessonId) {
            document.getElementById('lessonContent').innerHTML = '<div class="empty-state">⚠️ لم يتم تحديد محاضرة</div>';
        } else {
            loadLesson(lessonId);
        }

        async function loadLesson(id) {
            try {
                const lessonDoc = await db.collection('lessons').doc(id).get();
                if (!lessonDoc.exists) {
                    document.getElementById('lessonContent').innerHTML = '<div class="empty-state">❌ المحاضرة غير موجودة</div>';
                    return;
                }
                const lesson = lessonDoc.data();
                // جلب معرف الكورس (قد يكون مخزناً مع المحاضرة)
                const courseId = lesson.courseId || '';
                let courseName = '';
                if (courseId) {
                    const courseDoc = await db.collection('courses').doc(courseId).get();
                    if (courseDoc.exists) courseName = courseDoc.data().name;
                }
                renderLesson(lesson, courseName);
            } catch (e) {
                console.error(e);
                document.getElementById('lessonContent').innerHTML = '<div class="empty-state">❌ حدث خطأ</div>';
            }
        }

        function renderLesson(lesson, courseName) {
            const progress = Math.floor(Math.random() * 80) + 10; // محاكاة
            const html = `
                <div class="video-container">
                    ${lesson.video ? 
                        `<video controls src="${lesson.video}" poster="${lesson.thumbnail || ''}" style="width:100%; max-height:500px;"></video>` : 
                        '<div class="empty-state">🎬 لا يوجد فيديو حالياً</div>'}
                </div>
                <div class="lesson-header">
                    <h2>${lesson.title}</h2>
                    <div class="lesson-meta">
                        <span>📚 ${courseName || 'كورس'}</span>
                        ${lesson.live ? '<span>🔴 بث مباشر متاح</span>' : ''}
                        <span>🕒 آخر مشاهدة: ${new Date().toLocaleDateString('ar-EG')}</span>
                    </div>
                </div>
                <div class="progress-section">
                    <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
                        <span>نسبة التقدم</span><span>${progress}%</span>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
                </div>
                <div class="action-buttons">
                    ${lesson.live ? '<button class="btn btn-primary" onclick="joinLive()">🔴 انضم للبث المباشر</button>' : ''}
                    ${lesson.video ? '<button class="btn" onclick="toggleFullscreen()">⛶ ملء الشاشة</button>' : ''}
                </div>
                <div class="resources-section">
                    <h4>📂 ملفات وموارد</h4>
                    ${lesson.pdf ? `<div class="resource-item"><span>📎</span><a href="${lesson.pdf}" target="_blank" style="color:var(--accent-1);">تحميل PDF</a></div>` : '<div class="empty-state">لا توجد ملفات مرفقة</div>'}
                    ${lesson.extraFiles && lesson.extraFiles.length > 0 ? lesson.extraFiles.map(f => `<div class="resource-item"><span>📁</span><a href="${f}" target="_blank" style="color:var(--accent-1);">ملف إضافي</a></div>`).join('') : ''}
                </div>
                <div class="action-buttons">
                    <a href="assignment.html?lessonId=${lessonId}" class="btn">📝 الواجب</a>
                    <a href="exam.html?lessonId=${lessonId}" class="btn">📋 الامتحان</a>
                </div>
            `;
            document.getElementById('lessonContent').innerHTML = html;
        }

        window.toggleFullscreen = function() {
            const video = document.querySelector('video');
            if (video) {
                if (video.requestFullscreen) video.requestFullscreen();
            }
        };

        window.joinLive = function() {
            alert('سيتم توجيهك إلى رابط البث المباشر قريباً');
        };
    })();
</script>
</body>
</html>
