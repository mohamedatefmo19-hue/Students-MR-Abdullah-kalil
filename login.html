<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | مستر عبدالله خليل</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        :root { --bg-primary: #0a0a1a; --glass-bg: rgba(255,255,255,0.04); --glass-border: rgba(255,255,255,0.08); --text-primary: #f0f0f5; --text-secondary: #b0b0c8; --accent-gradient: linear-gradient(135deg, #4da8da 0%, #7c5ce7 50%, #22d3bb 100%); --radius-xl: 32px; --font-ar: 'Cairo', sans-serif; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:var(--font-ar); background:var(--bg-primary); color:var(--text-primary); display:flex; align-items:center; justify-content:center; min-height:100vh; }
        .aurora { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
        .aurora .orb { position:absolute; border-radius:50%; filter:blur(120px); opacity:0.2; animation:float 20s infinite ease-in-out; }
        .aurora .orb:nth-child(1){ width:600px; height:600px; background:#4da8da; top:-200px; left:-150px; }
        .aurora .orb:nth-child(2){ width:500px; height:500px; background:#7c5ce7; bottom:-150px; right:-150px; animation-delay:-7s; }
        @keyframes float { 0%,100%{transform:translate(0,0) scale(1);} 25%{transform:translate(60px,-40px) scale(1.1);} 50%{transform:translate(-30px,50px) scale(0.9);} 75%{transform:translate(-50px,-30px) scale(1.05);} }
        .login-card { position:relative; z-index:10; width:90%; max-width:420px; background:var(--glass-bg); backdrop-filter:blur(25px); border:1px solid var(--glass-border); border-radius:var(--radius-xl); padding:40px 30px; box-shadow:0 20px 60px rgba(0,0,0,0.5); text-align:center; }
        .logo-icon { width:56px; height:56px; border-radius:16px; background:var(--accent-gradient); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:1.6rem; color:#fff; margin:0 auto 20px; }
        h1 { font-size:1.6rem; margin-bottom:8px; }
        .form-group { margin-bottom:18px; text-align:right; }
        .form-group label { display:block; font-size:0.85rem; margin-bottom:6px; }
        .form-group input { width:100%; padding:14px 18px; border-radius:30px; border:1.5px solid var(--glass-border); background:rgba(255,255,255,0.04); color:#fff; font-family:var(--font-ar); font-size:0.95rem; outline:none; }
        .btn-login { width:100%; padding:14px; border-radius:30px; font-weight:700; font-size:1rem; background:var(--accent-gradient); color:#fff; border:none; cursor:pointer; }
        .error-msg { background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.4); color:#f87171; padding:12px; border-radius:30px; font-size:0.85rem; margin-bottom:16px; display:none; }
        .links { margin-top:20px; font-size:0.85rem; }
        .links a { color:#4da8da; text-decoration:none; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="aurora"><div class="orb"></div><div class="orb"></div></div>
<div class="login-card">
    <div class="logo-icon">ع</div>
    <h1>تسجيل الدخول</h1>
    <p>مرحباً بك في منصة مستر عبدالله خليل</p>
    <div class="error-msg" id="errorMsg"></div>
    <form id="loginForm">
        <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="email" required></div>
        <div class="form-group"><label>كلمة المرور</label><input type="password" id="password" required></div>
        <button type="submit" class="btn-login">دخول</button>
    </form>
    <div class="links">
        <a href="forgot-password.html">نسيت كلمة المرور؟</a><br>
        ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a><br>
        <a href="index.html">العودة للرئيسية</a>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDT0xGqGHzyyeB4qcz5AGMKxESCGZNNEWE",
        authDomain: "abdullah-khalil.firebaseapp.com",
        projectId: "abdullah-khalil",
        storageBucket: "abdullah-khalil.firebasestorage.app",
        messagingSenderId: "530661483867",
        appId: "1:530661483867:web:e2f165e9f808bcfcb8267e"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const errorEl = document.getElementById('errorMsg');
        errorEl.style.display = 'none';

        try {
            const userCredential = await auth.signInWithEmailAndPassword(email, password);
            const user = userCredential.user;
            const userDoc = await db.collection('students').doc(user.uid).get();
            if (!userDoc.exists) {
                await auth.signOut();
                errorEl.textContent = 'بيانات الطالب غير موجودة';
                errorEl.style.display = 'block';
                return;
            }
            const userData = userDoc.data();
            if (userData.status !== 'مفعل') {
                await auth.signOut();
                errorEl.textContent = 'حسابك غير مفعل بعد. راجع الإدارة.';
                errorEl.style.display = 'block';
                return;
            }
            // تخزين معرف الطالب محلياً
            localStorage.setItem('studentId', user.uid);
            localStorage.setItem('studentName', userData.name || 'طالب');
            localStorage.setItem('studentGrade', userData.grade || '');
            // إعادة التوجيه للوحة التحكم
            window.location.href = 'dashboard.html';
        } catch (error) {
            let msg = 'حدث خطأ';
            if (error.code === 'auth/user-not-found') msg = 'البريد غير مسجل';
            else if (error.code === 'auth/wrong-password') msg = 'كلمة المرور خاطئة';
            else if (error.code === 'auth/invalid-credential') msg = 'بيانات الدخول غير صحيحة';
            errorEl.textContent = msg;
            errorEl.style.display = 'block';
        }
    });
</script>
</body>
</html>
