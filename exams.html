<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الامتحانات | مستر عبدالله خليل</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-deep: #020012; --glass-bg: rgba(255,255,255,0.03); --glass-border: rgba(255,255,255,0.06);
            --glass-hover: rgba(255,255,255,0.05); --text-primary: #f0f0f7; --text-secondary: #b8b8d4;
            --text-muted: #6e6e90; --accent-gradient: linear-gradient(135deg, #4da8da, #7c5ce7, #22d3bb);
            --accent-1: #4da8da; --accent-2: #7c5ce7; --accent-3: #22d3bb; --accent-5: #fbbf24;
            --shadow-glow: 0 0 80px rgba(124,92,231,0.25); --radius-sm: 10px; --radius-md: 16px;
            --radius-lg: 24px; --font: 'Cairo', sans-serif; --transition: 0.3s ease;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:var(--font); background:var(--bg-deep); color:var(--text-primary); display:flex; min-height:100vh; }
        .sidebar { width:260px; background:rgba(8,8,28,0.75); backdrop-filter:blur(35px); border-left:1px solid var(--glass-border); padding:24px 14px; flex-shrink:0; z-index:50; overflow-y:auto; }
        .sidebar .logo-icon { width:42px; height:42px; border-radius:14px; background:var(--accent-gradient); display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; margin-bottom:20px; overflow:hidden; }
        .sidebar .logo-icon img { width:100%; height:100%; object-fit:cover; border-radius:inherit; }
        .sidebar nav a { display:block; padding:10px 14px; border-radius:24px; color:var(--text-muted); text-decoration:none; font-size:0.88rem; margin-bottom:4px; }
        .sidebar nav a.active, .sidebar nav a:hover { background:rgba(255,255,255,0.05); color:#fff; }
        .main { flex:1; overflow-y:auto; max-height:100vh; }
        .topbar { padding:14px 24px; display:flex; justify-content:space-between; align-items:center; background:rgba(6,6,26,0.7); backdrop-filter:blur(25px); border-bottom:1px solid var(--glass-border); position:sticky; top:0; }
        .topbar h2 { background:var(--accent-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .btn { padding:8px 16px; border-radius:24px; font-weight:600; font-size:0.8rem; border:1.5px solid var(--glass-border); background:transparent; color:var(--text-primary); cursor:pointer; text-decoration:none; transition:var(--transition); }
        .btn-primary { background:var(--accent-gradient); border:none; color:#fff; }
        .content { padding:24px; max-width:900px; margin:0 auto; }
        .card { background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--radius-lg); padding:20px; backdrop-filter:blur(15px); margin-bottom:16px; }
        .exam-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:16px; }
        .exam-card { text-decoration:none; color:inherit; }
        .exam-card:hover { background:var(--glass-hover); transform:translateY(-3px); box-shadow:0 15px 30px rgba(0,0,0,0.3); }
        .badge { padding:4px 10px; border-radius:14px; font-size:0.7rem; font-weight:600; display:inline-block; }
        .badge-success { background:rgba(34,211,187,0.2); color:#22d3bb; }
        .badge-warning { background:rgba(251,191,36,0.2); color:#fbbf24; }
        .badge-danger { background:rgba(239,68,68,0.2); color:#f87171; }
        .empty-state { text-align:center; padding:40px; color:var(--text-muted); }
        @media (max-width:768px) { .sidebar { position:fixed; right:-280px; top:0; bottom:0; z-index:55; } .sidebar.open { right:0; } }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="sidebar" id="sidebar">
    <div class="logo-icon" id="sidebarLogo">ع</div>
    <nav>
        <a href="dashboard.html">🏠 الرئيسية</a>
        <a href="assignments.html">📄 الواجبات</a>
        <a href="exams.html" class="active">📝 الامتحانات</a>
        <a href="schedule.html">📅 جداول الحصص</a>
        <a href="questions.html">💬 الأسئلة</a>
        <a href="profile.html">👤 حسابي</a>
        <a href="settings.html">⚙️ الإعدادات</a>
    </nav>
</div>
<div class="main">
    <div class="topbar">
        <h2>📝 الامتحانات</h2>
        <div>
            <a href="dashboard.html" class="btn">رجوع</a>
            <button class="btn btn-sm" onclick="logout()">تسجيل الخروج</button>
        </div>
    </div>
    <div class="content" id="examsContent">⏳ جاري تحميل الامتحانات...</div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDT0xGqGHzyyeB4qcz5AGMKxESCGZNNEWE",
        authDomain: "abdullah-khalil.firebaseapp.com",
        projectId: "abdullah-khalil",
        storageBucket: "abdullah-khalil.firebasestorage.app",
        messagingSenderId: "530661483867",
        appId: "1:530661483867:web:e2f165e9f808bcfcb8267e"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const MAX_ATTEMPTS = 3;
    const studentId = localStorage.getItem('studentId');
    if (!studentId) window.location.href = 'login.html';

    // تحميل إعدادات المنصة
    (async function loadSettings() {
        const doc = await db.collection('settings').doc('platform').get();
        if (doc.exists) {
            const data = doc.data();
            if (data.logo) document.getElementById('sidebarLogo').innerHTML = `<img src="${data.logo}" alt="لوجو">`;
            if (data.name) document.title = `الامتحانات | ${data.name}`;
        }
    })();

    async function loadExams() {
        const container = document.getElementById('examsContent');
        try {
            const userDoc = await db.collection('students').doc(studentId).get();
            if (!userDoc.exists || userDoc.data().status !== 'مفعل') { window.location.href='login.html'; return; }
            const grade = userDoc.data().grade || '';
            const examsSnap = await db.collection('exams').where('grade','==',grade).get();
            const exams = [];
            examsSnap.forEach(doc => exams.push({id: doc.id, ...doc.data()}));
            const resultsSnap = await db.collection('examResults').where('studentId','==',studentId).get();
            const results = {};
            resultsSnap.forEach(doc => {
                const r = doc.data();
                if (!results[r.examId]) results[r.examId] = [];
                results[r.examId].push(r);
            });
            container.innerHTML = exams.length ? `
                <div class="exam-grid">
                    ${exams.map(e => {
                        const attempts = results[e.id] || [];
                        const attemptsCount = attempts.length;
                        const remaining = MAX_ATTEMPTS - attemptsCount;
                        const bestScore = attempts.length ? Math.max(...attempts.map(a => a.percentage || 0)) : null;
                        const canAttempt = remaining > 0;
                        return `
                        <div class="card exam-card">
                            <h3>${e.name || 'امتحان'}</h3>
                            <p style="color:var(--text-secondary);">⏱️ ${e.time || 60} دقيقة | 📝 ${e.questions?.length || 0} سؤال</p>
                            <div style="margin:10px 0;">
                                <span class="badge ${canAttempt ? 'badge-success' : 'badge-danger'}">
                                    ${canAttempt ? `متاح - ${remaining} محاولات` : 'لا توجد محاولات'}
                                </span>
                                ${bestScore !== null ? `<span class="badge badge-warning" style="margin-right:6px;">أفضل نتيجة: ${bestScore}%</span>` : ''}
                            </div>
                            ${canAttempt ? `
                                <a href="exam.html?id=${e.id}" class="btn btn-primary" style="display:inline-block; width:100%; text-align:center;">بدء الامتحان</a>
                            ` : `
                                <button class="btn" disabled style="width:100%;">انتهت المحاولات</button>
                            `}
                        </div>
                        `;
                    }).join('')}
                </div>
            ` : '<div class="empty-state">لا توجد امتحانات لصفك حالياً</div>';
        } catch(e) {
            container.innerHTML = '<div class="empty-state">❌ حدث خطأ في تحميل الامتحانات</div>';
        }
    }
    loadExams();
    window.logout = () => { localStorage.clear(); window.location.href = 'login.html'; };
</script>
</body>
</html>
