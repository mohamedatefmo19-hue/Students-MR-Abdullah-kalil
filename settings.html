<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادات الحساب | مستر عبدالله خليل</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <!-- Cloudinary Widget -->
    <script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>
    <style>
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #0f0f28;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.07);
            --text-primary: #f0f0f5;
            --text-secondary: #b0b0c8;
            --text-muted: #70708a;
            --accent-gradient: linear-gradient(135deg, #4da8da 0%, #7c5ce7 50%, #22d3bb 100%);
            --shadow-glow: 0 0 40px rgba(124, 92, 231, 0.3);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --font-ar: 'Cairo', 'Tajawal', sans-serif;
            --transition-smooth: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; font-size: 16px; }
        body {
            font-family: var(--font-ar);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 70px;
        }
        .aurora-bg { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:hidden; }
        .aurora-bg .orb { position: absolute; border-radius:50%; filter:blur(120px); opacity:0.22; animation:auroraFloat 20s infinite ease-in-out; }
        .aurora-bg .orb:nth-child(1) { width:600px; height:600px; background:radial-gradient(circle, #4da8da 0%, transparent 70%); top:-200px; left:-150px; }
        .aurora-bg .orb:nth-child(2) { width:500px; height:500px; background:radial-gradient(circle, #7c5ce7 0%, transparent 70%); bottom:-150px; right:-150px; animation-delay:-7s; }
        @keyframes auroraFloat { 0%,100%{transform:translate(0,0) scale(1);} 25%{transform:translate(60px,-40px) scale(1.1);} 50%{transform:translate(-30px,50px) scale(0.9);} 75%{transform:translate(-50px,-30px) scale(1.05);} }
        .floating-shapes { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
        .floating-shapes .shape { position:absolute; opacity:0.05; animation:floatShape 15s infinite ease-in-out; }
        .floating-shapes .hex { width:80px; height:46px; border:2px solid rgba(255,255,255,0.3); clip-path:polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); }
        @keyframes floatShape { 0%,100%{transform:translateY(0) rotate(0deg);} 33%{transform:translateY(-40px) rotate(5deg);} 66%{transform:translateY(20px) rotate(-3deg);} }
        .main-content { position:relative; z-index:1; }
        .navbar { position:sticky; top:0; z-index:1000; background:rgba(10,10,26,0.8); backdrop-filter:blur(30px); border-bottom:1px solid var(--glass-border); padding:0 24px; }
        .navbar-inner { max-width:1200px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; height:64px; gap:16px; }
        .navbar-logo { display:flex; align-items:center; gap:10px; text-decoration:none; }
        .navbar-logo .logo-icon { width:40px; height:40px; border-radius:var(--radius-sm); background:var(--accent-gradient); display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; }
        .btn { padding:8px 18px; border-radius:30px; font-family:var(--font-ar); font-weight:600; font-size:0.85rem; border:none; cursor:pointer; transition:var(--transition-smooth); background:transparent; color:var(--text-primary); border:1.5px solid var(--glass-border); text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
        .btn-primary { background:var(--accent-gradient); border:none; color:#fff; }
        .btn-danger { background:rgba(239,68,68,0.2); border-color:rgba(239,68,68,0.4); color:#f87171; }
        .settings-content { padding:24px; max-width:700px; margin:0 auto; }
        .page-header { margin-bottom:24px; }
        .page-header h2 { font-size:1.8rem; font-weight:700; }
        .settings-card { background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--radius-lg); padding:24px; backdrop-filter:blur(10px); margin-bottom:24px; }
        .settings-card h3 { margin-bottom:16px; font-size:1.2rem; }
        .form-group { margin-bottom:16px; }
        .form-group label { display:block; font-size:0.85rem; margin-bottom:6px; color:var(--text-secondary); }
        .form-group input { width:100%; padding:12px 16px; border-radius:30px; border:1.5px solid var(--glass-border); background:rgba(255,255,255,0.04); color:#fff; font-family:var(--font-ar); font-size:0.9rem; outline:none; }
        .form-group input:focus { border-color:var(--accent-2); }
        .toggle-row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; }
        .toggle-switch { position:relative; width:48px; height:26px; background:rgba(255,255,255,0.2); border-radius:13px; cursor:pointer; transition:0.3s; }
        .toggle-switch.active { background:var(--accent-gradient); }
        .toggle-switch::after { content:''; position:absolute; width:22px; height:22px; background:#fff; border-radius:50%; top:2px; right:2px; transition:0.3s; }
        .toggle-switch.active::after { right:24px; }
        .empty-state { text-align:center; padding:60px; color:var(--text-muted); }
        .bottom-nav { display:none; position:fixed; bottom:0; left:0; width:100%; background:rgba(15,15,40,0.9); backdrop-filter:blur(25px); border-top:1px solid var(--glass-border); z-index:1000; padding:8px 16px 12px; justify-content:space-around; align-items:center; }
        .bottom-nav a { display:flex; flex-direction:column; align-items:center; gap:4px; text-decoration:none; color:var(--text-muted); font-size:0.7rem; }
        .bottom-nav a.active, .bottom-nav a:hover { color:var(--accent-1); }
        @media (max-width:768px) { .bottom-nav { display:flex; } }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="aurora-bg"><div class="orb"></div><div class="orb"></div></div>
<div class="floating-shapes"><div class="shape hex" style="top:10%;left:8%;"></div></div>
<div class="main-content">
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="index.html" class="navbar-logo"><div class="logo-icon">ع</div><span>مستر عبدالله خليل</span></a>
            <div style="display:flex; gap:12px;">
                <a href="dashboard.html" class="btn btn-sm">لوحة التحكم</a>
                <button class="btn btn-sm" onclick="logout()">تسجيل الخروج</button>
            </div>
        </div>
    </nav>
    <div class="settings-content">
        <div class="page-header"><h2>⚙️ إعدادات الحساب</h2></div>
        <!-- تغيير كلمة المرور -->
        <div class="settings-card">
            <h3>🔒 تغيير كلمة المرور</h3>
            <div class="form-group"><label>كلمة المرور الحالية</label><input type="password" id="currentPassword" placeholder="••••••••"></div>
            <div class="form-group"><label>كلمة المرور الجديدة</label><input type="password" id="newPassword" placeholder="••••••••"></div>
            <div class="form-group"><label>تأكيد كلمة المرور الجديدة</label><input type="password" id="confirmPassword" placeholder="••••••••"></div>
            <button class="btn btn-primary" onclick="changePassword()">💾 تحديث كلمة المرور</button>
            <div id="passwordMsg" style="margin-top:8px; font-size:0.85rem;"></div>
        </div>
        <!-- تفضيلات الإشعارات -->
        <div class="settings-card">
            <h3>🔔 تفضيلات الإشعارات</h3>
            <div class="toggle-row">
                <span>تفعيل الإشعارات</span>
                <div class="toggle-switch active" id="toggleAll" onclick="toggleSwitch('toggleAll')"></div>
            </div>
            <div class="toggle-row">
                <span>إشعارات المحاضرات الجديدة</span>
                <div class="toggle-switch active" id="toggleLessons" onclick="toggleSwitch('toggleLessons')"></div>
            </div>
            <div class="toggle-row">
                <span>إشعارات الامتحانات</span>
                <div class="toggle-switch active" id="toggleExams" onclick="toggleSwitch('toggleExams')"></div>
            </div>
            <button class="btn btn-primary" onclick="saveNotificationSettings()">💾 حفظ التفضيلات</button>
        </div>
        <!-- حذف الحساب -->
        <div class="settings-card">
            <h3>⚠️ حذف الحساب</h3>
            <p style="color:var(--text-muted); margin-bottom:16px;">سيتم حذف جميع بياناتك بشكل نهائي. هذا الإجراء لا يمكن التراجع عنه.</p>
            <button class="btn btn-danger" onclick="deleteAccount()">🗑️ حذف الحساب</button>
        </div>
    </div>
</div>
<nav class="bottom-nav">
    <a href="dashboard.html"><span>🏠</span><span>الرئيسية</span></a>
    <a href="courses.html"><span>📚</span><span>كورساتي</span></a>
    <a href="exams.html"><span>📝</span><span>الامتحانات</span></a>
    <a href="profile.html"><span>👤</span><span>حسابي</span></a>
</nav>

<script>
    (function() {
        const firebaseConfig = {
            apiKey: "AIzaSyDT0xGqGHzyyeB4qcz5AGMKxESCGZNNEWE",
            authDomain: "abdullah-khalil.firebaseapp.com",
            projectId: "abdullah-khalil",
            storageBucket: "abdullah-khalil.firebasestorage.app",
            messagingSenderId: "530661483867",
            appId: "1:530661483867:web:e2f165e9f808bcfcb8267e"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;

        auth.onAuthStateChanged(async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            const userDoc = await db.collection('students').doc(user.uid).get();
            if (!userDoc.exists || userDoc.data().status !== 'مفعل') {
                await auth.signOut();
                window.location.href = 'login.html';
                return;
            }
            currentUser = user;
            loadNotificationSettings();
        });

        // تغيير كلمة المرور
        window.changePassword = async () => {
            const current = document.getElementById('currentPassword').value;
            const newPass = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            const msgEl = document.getElementById('passwordMsg');
            msgEl.style.color = '#f87171';

            if (!current || !newPass || !confirm) {
                msgEl.textContent = 'يرجى ملء جميع الحقول';
                return;
            }
            if (newPass !== confirm) {
                msgEl.textContent = 'كلمة المرور الجديدة غير متطابقة';
                return;
            }
            if (newPass.length < 6) {
                msgEl.textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل';
                return;
            }

            try {
                const credential = firebase.auth.EmailAuthProvider.credential(currentUser.email, current);
                await currentUser.reauthenticateWithCredential(credential);
                await currentUser.updatePassword(newPass);
                msgEl.style.color = '#22d3bb';
                msgEl.textContent = '✅ تم تغيير كلمة المرور بنجاح';
                document.getElementById('currentPassword').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmPassword').value = '';
            } catch (e) {
                if (e.code === 'auth/wrong-password') msgEl.textContent = 'كلمة المرور الحالية غير صحيحة';
                else msgEl.textContent = '❌ حدث خطأ أثناء تغيير كلمة المرور';
            }
        };

        // تبديل الإشعارات
        window.toggleSwitch = function(id) {
            const el = document.getElementById(id);
            el.classList.toggle('active');
        };

        function loadNotificationSettings() {
            db.collection('studentSettings').doc(currentUser.uid).get().then(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    if (data.notifications === false) document.getElementById('toggleAll').classList.remove('active');
                    if (data.lessonNotifications === false) document.getElementById('toggleLessons').classList.remove('active');
                    if (data.examNotifications === false) document.getElementById('toggleExams').classList.remove('active');
                }
            }).catch(() => {});
        }

        window.saveNotificationSettings = async () => {
            const settings = {
                notifications: document.getElementById('toggleAll').classList.contains('active'),
                lessonNotifications: document.getElementById('toggleLessons').classList.contains('active'),
                examNotifications: document.getElementById('toggleExams').classList.contains('active')
            };
            try {
                await db.collection('studentSettings').doc(currentUser.uid).set(settings, { merge: true });
                alert('✅ تم حفظ تفضيلات الإشعارات');
            } catch (e) {
                alert('❌ حدث خطأ');
            }
        };

        window.deleteAccount = async () => {
            if (confirm('هل أنت متأكد تماماً من حذف حسابك؟ لا يمكن التراجع عن هذا الإجراء.')) {
                if (confirm('تأكيد أخير: سيتم حذف جميع بياناتك بشكل نهائي.')) {
                    try {
                        await db.collection('students').doc(currentUser.uid).delete();
                        await currentUser.delete();
                        alert('تم حذف الحساب بنجاح');
                        window.location.href = 'index.html';
                    } catch (e) {
                        alert('❌ حدث خطأ أثناء حذف الحساب');
                    }
                }
            }
        };

        window.logout = async () => { await auth.signOut(); window.location.href = 'login.html'; };
    })();
</script>
</body>
</html>
