<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأسئلة | مستر عبدالله خليل</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>
    <style>
        :root {
            --bg-deep: #020012;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-hover: rgba(255, 255, 255, 0.05);
            --text-primary: #f0f0f7;
            --text-secondary: #b8b8d4;
            --text-muted: #6e6e90;
            --accent-gradient: linear-gradient(135deg, #4da8da, #7c5ce7, #22d3bb);
            --accent-1: #4da8da;
            --accent-2: #7c5ce7;
            --accent-3: #22d3bb;
            --radius-lg: 24px;
            --radius-md: 16px;
            --font: 'Cairo', sans-serif;
            --transition: 0.3s ease;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:var(--font); background:var(--bg-deep); color:var(--text-primary); display:flex; min-height:100vh; }
        .sidebar { width:260px; background:rgba(8,8,28,0.75); backdrop-filter:blur(35px); border-left:1px solid var(--glass-border); padding:24px 14px; flex-shrink:0; z-index:50; overflow-y:auto; }
        .sidebar .logo-icon { width:42px; height:42px; border-radius:14px; background:var(--accent-gradient); display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; margin-bottom:20px; overflow:hidden; }
        .sidebar .logo-icon img { width:100%; height:100%; object-fit:cover; border-radius:inherit; }
        .sidebar nav a { display:block; padding:10px 14px; border-radius:24px; color:var(--text-muted); text-decoration:none; font-size:0.88rem; margin-bottom:4px; }
        .sidebar nav a.active, .sidebar nav a:hover { background:rgba(255,255,255,0.05); color:#fff; }
        .main { flex:1; overflow-y:auto; max-height:100vh; }
        .topbar { padding:14px 24px; display:flex; justify-content:space-between; align-items:center; background:rgba(6,6,26,0.7); backdrop-filter:blur(25px); border-bottom:1px solid var(--glass-border); position:sticky; top:0; }
        .topbar h2 { background:var(--accent-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .btn { padding:8px 16px; border-radius:24px; font-weight:600; font-size:0.8rem; border:1.5px solid var(--glass-border); background:transparent; color:var(--text-primary); cursor:pointer; text-decoration:none; transition:var(--transition); }
        .btn-primary { background:var(--accent-gradient); border:none; color:#fff; }
        .content { padding:24px; max-width:900px; margin:0 auto; }
        .card { background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--radius-lg); padding:20px; backdrop-filter:blur(15px); margin-bottom:16px; }
        .question-card img { max-width:100%; max-height:300px; border-radius:var(--radius-md); margin:8px 0; }
        .replies { margin-top:12px; border-top:1px solid var(--glass-border); padding-top:12px; }
        .reply-item { background:rgba(255,255,255,0.02); border-radius:var(--radius-md); padding:10px; margin-bottom:8px; }
        .reply-item img { max-width:80px; max-height:80px; border-radius:8px; margin:4px 0; }
        .textarea-field { width:100%; padding:10px; border-radius:var(--radius-md); border:1.5px solid var(--glass-border); background:rgba(255,255,255,0.04); color:#fff; font-family:var(--font); resize:vertical; min-height:60px; }
        .upload-btn { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:24px; font-weight:600; font-size:0.8rem; border:1.5px solid var(--glass-border); background:transparent; color:var(--text-primary); cursor:pointer; margin:8px 0; }
        .message { padding:8px 12px; border-radius:14px; font-size:0.8rem; margin:6px 0; display:none; }
        .message.success { background:rgba(34,211,187,0.15); color:#22d3bb; border:1px solid rgba(34,211,187,0.3); }
        .message.error { background:rgba(239,68,68,0.15); color:#f87171; border:1px solid rgba(239,68,68,0.3); }
        @media (max-width:768px) { .sidebar { position:fixed; right:-280px; top:0; bottom:0; z-index:55; } .sidebar.open { right:0; } }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="sidebar" id="sidebar">
    <div class="logo-icon" id="sidebarLogo">ع</div>
    <nav>
        <a href="dashboard.html">🏠 الرئيسية</a>
        <a href="assignments.html">📄 الواجبات</a>
        <a href="exams.html">📝 الامتحانات</a>
        <a href="schedule.html">📅 جداول الحصص</a>
        <a href="questions.html" class="active">💬 الأسئلة</a>
        <a href="profile.html">👤 حسابي</a>
        <a href="settings.html">⚙️ الإعدادات</a>
    </nav>
</div>
<div class="main">
    <div class="topbar">
        <h2>💬 الأسئلة والمناقشات</h2>
        <a href="dashboard.html" class="btn">رجوع</a>
    </div>
    <div class="content" id="questionsContent">⏳ جاري التحميل...</div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDT0xGqGHzyyeB4qcz5AGMKxESCGZNNEWE",
        authDomain: "abdullah-khalil.firebaseapp.com",
        projectId: "abdullah-khalil",
        storageBucket: "abdullah-khalil.firebasestorage.app",
        messagingSenderId: "530661483867",
        appId: "1:530661483867:web:e2f165e9f808bcfcb8267e"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const CLOUDINARY_CLOUD = "deaevfmvm", CLOUDINARY_PRESET = "ml_default", CLOUDINARY_KEY = "864215656447737";
    const studentId = localStorage.getItem('studentId');
    if (!studentId) window.location.href = 'login.html';

    let currentUser = null;

    async function init() {
        const docSnap = await db.collection('settings').doc('platform').get().catch(() => null);
        if (docSnap && docSnap.exists) {
            const data = docSnap.data();
            if (data.logo) document.getElementById('sidebarLogo').innerHTML = `<img src="${data.logo}" alt="لوجو">`;
            if (data.name) document.title = `الأسئلة | ${data.name}`;
        }
        const userDoc = await db.collection('students').doc(studentId).get();
        if (!userDoc.exists || userDoc.data().status !== 'مفعل') { window.location.href='login.html'; return; }
        currentUser = { id: studentId, name: userDoc.data().name, grade: userDoc.data().grade };
        loadQuestions();
    }

    function loadQuestions() {
        const container = document.getElementById('questionsContent');
        container.innerHTML = '<div style="text-align:center;padding:40px;">⏳ جاري التحميل...</div>';

        db.collection('questions')
            .where('grade', '==', currentUser.grade)
            .onSnapshot(snap => {
                const questions = [];
                snap.forEach(doc => questions.push({ id: doc.id, ...doc.data() }));

                questions.sort((a, b) => {
                    const timeA = a.createdAt?.seconds || 0;
                    const timeB = b.createdAt?.seconds || 0;
                    return timeB - timeA;
                });

                if (questions.length === 0) {
                    container.innerHTML = `
                    <div style="text-align:center;padding:40px;color:var(--text-muted);">لا توجد أسئلة بعد في صفك</div>
                    <div class="card">
                        <h3>اطرح سؤالاً</h3>
                        <textarea id="newQuestionText" class="textarea-field" placeholder="اكتب سؤالك..."></textarea>
                        <input type="hidden" id="newQuestionImage">
                        <button class="upload-btn" onclick="uploadQuestionImage()">📷 رفع صورة</button>
                        <div class="message" id="newQuestionMsg"></div>
                        <button class="btn btn-primary" onclick="submitQuestion()">إرسال السؤال</button>
                    </div>`;
                    return;
                }

                let html = '';
                questions.forEach(q => {
                    const replies = q.replies || [];
                    html += `
                    <div class="card question-card">
                        <div style="display:flex; justify-content:space-between;">
                            <strong>${q.studentName || 'طالب'}</strong>
                            <span style="color:var(--text-muted); font-size:0.8rem;">${q.createdAt?.toDate?.().toLocaleString('ar-EG') || '—'}</span>
                        </div>
                        <p style="margin:8px 0;">${q.text || ''}</p>
                        ${q.image ? `<img src="${q.image}" alt="صورة السؤال">` : ''}
                        <div class="replies">
                            ${replies.map(r => `
                                <div class="reply-item">
                                    <strong>${r.userName || 'طالب'}</strong>: ${r.text || ''}
                                    ${r.image ? `<br><img src="${r.image}" alt="صورة الرد">` : ''}
                                </div>
                            `).join('')}
                        </div>
                        <button class="btn btn-sm" onclick="showReplyForm('${q.id}')">💬 رد</button>
                        <div id="replyForm-${q.id}" style="display:none; margin-top:8px;">
                            <textarea id="replyText-${q.id}" class="textarea-field" placeholder="اكتب ردك..."></textarea>
                            <input type="hidden" id="replyImage-${q.id}">
                            <button class="upload-btn" onclick="uploadReplyImage('${q.id}')">📷 صورة</button>
                            <button class="btn btn-primary btn-sm" onclick="submitReply('${q.id}')">إرسال الرد</button>
                        </div>
                    </div>`;
                });

                html += `
                <div class="card">
                    <h3>اطرح سؤالاً</h3>
                    <textarea id="newQuestionText" class="textarea-field" placeholder="اكتب سؤالك..."></textarea>
                    <input type="hidden" id="newQuestionImage">
                    <button class="upload-btn" onclick="uploadQuestionImage()">📷 رفع صورة</button>
                    <div class="message" id="newQuestionMsg"></div>
                    <button class="btn btn-primary" onclick="submitQuestion()">إرسال السؤال</button>
                </div>`;

                container.innerHTML = html;
            }, error => {
                console.error('خطأ في تحميل الأسئلة:', error);
                container.innerHTML = `
                <div style="text-align:center;padding:40px;color:var(--text-muted);">❌ حدث خطأ في تحميل الأسئلة. تأكد من قواعد Firestore.</div>
                <div class="card">
                    <h3>اطرح سؤالاً</h3>
                    <textarea id="newQuestionText" class="textarea-field" placeholder="اكتب سؤالك..."></textarea>
                    <button class="btn btn-primary" onclick="submitQuestion()">إرسال السؤال</button>
                </div>`;
            });
    }

    window.uploadQuestionImage = function() {
        window.cloudinary.openUploadWidget({
            cloudName: CLOUDINARY_CLOUD, uploadPreset: CLOUDINARY_PRESET, apiKey: CLOUDINARY_KEY,
            sources: ['local','camera'], multiple: false, resourceType: 'image',
            clientAllowedFormats: ['png','jpg','jpeg'], maxFileSize: 5000000, language: 'ar'
        }, (error, result) => {
            if (!error && result?.event === 'success') {
                document.getElementById('newQuestionImage').value = result.info.secure_url;
                const msg = document.getElementById('newQuestionMsg');
                msg.className = 'message success'; msg.style.display = 'block'; msg.textContent = '✅ تم رفع الصورة';
            }
        });
    };

    window.submitQuestion = async function() {
        const text = document.getElementById('newQuestionText').value.trim();
        const image = document.getElementById('newQuestionImage').value;
        if (!text && !image) { alert('اكتب سؤالاً أو ارفع صورة'); return; }
        await db.collection('questions').add({
            studentId: currentUser.id,
            studentName: currentUser.name,
            grade: currentUser.grade,
            text, image,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            replies: []
        });
        document.getElementById('newQuestionText').value = '';
        document.getElementById('newQuestionImage').value = '';
        document.getElementById('newQuestionMsg').style.display = 'none';
    };

    window.showReplyForm = function(qId) {
        const el = document.getElementById('replyForm-'+qId);
        el.style.display = el.style.display === 'none' ? 'block' : 'none';
    };

    window.uploadReplyImage = function(qId) {
        window.cloudinary.openUploadWidget({
            cloudName: CLOUDINARY_CLOUD, uploadPreset: CLOUDINARY_PRESET, apiKey: CLOUDINARY_KEY,
            sources: ['local','camera'], multiple: false, resourceType: 'image',
            clientAllowedFormats: ['png','jpg','jpeg'], maxFileSize: 5000000, language: 'ar'
        }, (error, result) => {
            if (!error && result?.event === 'success') {
                document.getElementById('replyImage-'+qId).value = result.info.secure_url;
            }
        });
    };

    window.submitReply = async function(qId) {
        const text = document.getElementById('replyText-'+qId).value.trim();
        const image = document.getElementById('replyImage-'+qId).value;
        if (!text && !image) return;
        await db.collection('questions').doc(qId).update({
            replies: firebase.firestore.FieldValue.arrayUnion({
                userId: currentUser.id,
                userName: currentUser.name,
                text, image,
                createdAt: new Date()
            })
        });
        document.getElementById('replyText-'+qId).value = '';
        document.getElementById('replyImage-'+qId).value = '';
        document.getElementById('replyForm-'+qId).style.display = 'none';
    };

    init();
</script>
</body>
</html>
