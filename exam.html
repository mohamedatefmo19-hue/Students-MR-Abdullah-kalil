<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الامتحان | مستر عبدالله خليل</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-deep: #020012; --glass-bg: rgba(255,255,255,0.03); --glass-border: rgba(255,255,255,0.06);
            --text-primary: #f0f0f7; --text-secondary: #b8b8d4; --text-muted: #6e6e90;
            --accent-gradient: linear-gradient(135deg, #4da8da, #7c5ce7, #22d3bb);
            --accent-1: #4da8da; --accent-2: #7c5ce7; --accent-3: #22d3bb; --danger: #ef4444;
            --radius-lg: 24px; --radius-md: 16px; --font: 'Cairo', sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:var(--font); background:var(--bg-deep); color:var(--text-primary); display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:20px; }
        .timer-bar {
            position:sticky; top:10px; z-index:100; background:rgba(10,10,30,0.9); backdrop-filter:blur(20px);
            border:1px solid var(--glass-border); border-radius:var(--radius-lg); padding:12px 24px;
            display:flex; justify-content:space-between; align-items:center; width:90%; max-width:800px; margin-bottom:20px;
        }
        .timer { font-size:2rem; font-weight:800; background:var(--accent-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .exam-container { width:90%; max-width:800px; display:flex; flex-direction:column; gap:16px; }
        .card { background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--radius-lg); padding:20px; backdrop-filter:blur(15px); }
        .question-card img { max-width:100%; max-height:300px; border-radius:var(--radius-md); margin-bottom:12px; object-fit:contain; }
        .options { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
        .option {
            padding:12px 16px; border-radius:var(--radius-md); border:2px solid var(--glass-border);
            cursor:pointer; transition:0.2s; display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.02);
        }
        .option:hover, .option.selected { border-color:var(--accent-2); background:rgba(124,92,231,0.1); }
        .option.selected { border-color:var(--accent-3); }
        .btn { padding:10px 20px; border-radius:24px; font-weight:600; font-size:0.9rem; border:1.5px solid var(--glass-border); background:transparent; color:var(--text-primary); cursor:pointer; transition:0.3s; text-decoration:none; }
        .btn-primary { background:var(--accent-gradient); border:none; color:#fff; }
        .btn-danger { background:rgba(239,68,68,0.2); border-color:rgba(239,68,68,0.4); color:#f87171; }
        .empty-state { text-align:center; padding:60px; color:var(--text-muted); }
        .result-score { font-size:3rem; font-weight:800; background:var(--accent-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        @media (max-width:600px) { .options { grid-template-columns:1fr; } }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="timer-bar">
    <span>⏱️ الوقت المتبقي</span>
    <span class="timer" id="timerDisplay">60:00</span>
    <span id="attemptInfo" style="color:var(--text-muted);"></span>
</div>
<div class="exam-container" id="examContainer">⏳ جاري تحميل الامتحان...</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDT0xGqGHzyyeB4qcz5AGMKxESCGZNNEWE",
        authDomain: "abdullah-khalil.firebaseapp.com",
        projectId: "abdullah-khalil",
        storageBucket: "abdullah-khalil.firebasestorage.app",
        messagingSenderId: "530661483867",
        appId: "1:530661483867:web:e2f165e9f808bcfcb8267e"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const studentId = localStorage.getItem('studentId');
    const urlParams = new URLSearchParams(window.location.search);
    const examId = urlParams.get('id');
    if (!studentId || !examId) { window.location.href = 'login.html'; }

    let examData = null, questions = [], currentIndex = 0, userAnswers = {};
    let timerInterval = null, timeLeft = 3600, examSubmitted = false;
    let attemptCount = 0;
    const MAX_ATTEMPTS = 3;

    async function init() {
        const container = document.getElementById('examContainer');
        try {
            const doc = await db.collection('exams').doc(examId).get();
            if (!doc.exists) { container.innerHTML = '<div class="empty-state">❌ الامتحان غير موجود</div>'; return; }
            examData = doc.data();

            const attemptsSnap = await db.collection('examResults')
                .where('studentId', '==', studentId)
                .where('examId', '==', examId)
                .get();
            attemptCount = attemptsSnap.size;
            if (attemptCount >= MAX_ATTEMPTS) {
                container.innerHTML = '<div class="empty-state">❌ استنفدت جميع المحاولات (3 كحد أقصى)</div>';
                return;
            }
            document.getElementById('attemptInfo').textContent = `المحاولة ${attemptCount + 1} من ${MAX_ATTEMPTS}`;
            questions = examData.questions ? [...examData.questions].sort(() => Math.random() - 0.5) : [];
            if (!questions.length) { container.innerHTML = '<div class="empty-state">❌ لا توجد أسئلة</div>'; return; }
            startExam();
        } catch (e) {
            container.innerHTML = '<div class="empty-state">❌ خطأ في تحميل الامتحان</div>';
        }
    }

    function startExam() {
        timeLeft = (parseInt(examData.time) || 60) * 60;
        examSubmitted = false;
        userAnswers = {};
        currentIndex = 0;
        renderQuestion();
        startTimer();
        window.addEventListener('beforeunload', warnBeforeLeave);
        document.addEventListener('visibilitychange', handleVisibilityChange);
    }

    function startTimer() {
        updateTimer();
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimer();
            if (timeLeft <= 0) submitExam('انتهى الوقت');
        }, 1000);
    }

    function updateTimer() {
        const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
        document.getElementById('timerDisplay').textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function warnBeforeLeave(e) { if (!examSubmitted) { e.preventDefault(); e.returnValue = ''; } }

    function handleVisibilityChange() {
        if (document.hidden && !examSubmitted) submitExam('تم الخروج من الامتحان');
    }

    function renderQuestion() {
        if (examSubmitted || currentIndex >= questions.length) return;
        const q = questions[currentIndex];
        const selected = userAnswers[q.id];
        const container = document.getElementById('examContainer');
        container.innerHTML = `
        <div class="card question-card">
            <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
                <span>سؤال ${currentIndex + 1} من ${questions.length}</span>
                <div>
                    <button class="btn btn-sm" onclick="prevQ()" ${currentIndex === 0 ? 'disabled' : ''}>السابق</button>
                    <button class="btn btn-sm btn-primary" onclick="nextQ()">${currentIndex === questions.length - 1 ? 'إنهاء' : 'التالي'}</button>
                </div>
            </div>
            ${q.image ? `<img src="${q.image}" alt="صورة السؤال">` : ''}
            <h3 style="margin-bottom:12px;">${q.text || 'السؤال بدون نص'}</h3>
            <div class="options">
                ${q.options.map((opt, idx) => {
                    const letter = ['أ', 'ب', 'ج', 'د'][idx];
                    return `<div class="option ${selected === idx ? 'selected' : ''}" onclick="selectAnswer('${q.id}', ${idx})"><span style="font-weight:bold; width:24px;">${letter}.</span> ${opt}</div>`;
                }).join('')}
            </div>
        </div>
        <div style="display:flex; gap:10px; justify-content:center;">
            ${questions.map((_, i) => `<span style="width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.8rem; cursor:pointer; background:${userAnswers[questions[i].id] !== undefined ? 'var(--accent-2)' : 'var(--glass-bg)'}; border:1px solid var(--glass-border);" onclick="goTo(${i})">${i + 1}</span>`).join('')}
        </div>
        <button class="btn btn-danger" style="margin-top:16px; width:100%;" onclick="submitExam('تسليم يدوي')">تسليم الامتحان</button>`;
    }

    window.selectAnswer = (qId, idx) => { userAnswers[qId] = idx; renderQuestion(); };
    window.nextQ = () => { if (currentIndex < questions.length - 1) { currentIndex++; renderQuestion(); } else { if (confirm('هل أنت متأكد من إنهاء الامتحان؟')) submitExam('تسليم يدوي'); } };
    window.prevQ = () => { if (currentIndex > 0) { currentIndex--; renderQuestion(); } };
    window.goTo = (i) => { currentIndex = i; renderQuestion(); };

    async function submitExam(reason) {
        if (examSubmitted) return;
        examSubmitted = true;
        clearInterval(timerInterval);
        window.removeEventListener('beforeunload', warnBeforeLeave);
        document.removeEventListener('visibilitychange', handleVisibilityChange);

        let correct = 0, total = questions.length;
        questions.forEach(q => { if (userAnswers[q.id] !== undefined && userAnswers[q.id] === q.correct) correct++; });
        const percentage = Math.round((correct / total) * 100);

        // ✅ حفظ النتيجة في Firestore بشكل موثوق
        try {
            await db.collection('examResults').add({
                studentId: studentId,
                examId: examId,
                examName: examData.name || 'امتحان',
                score: correct,
                total: total,
                percentage: percentage,
                answers: userAnswers,
                reason: reason,
                attempt: attemptCount + 1,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            console.log('✅ تم حفظ نتيجة الامتحان بنجاح');
        } catch (e) {
            console.error('❌ فشل حفظ نتيجة الامتحان:', e);
        }

        renderResult(correct, total, percentage, reason);
    }
    window.submitExam = submitExam;

    function renderResult(correct, total, percentage, reason) {
        document.getElementById('examContainer').innerHTML = `
        <div class="card" style="text-align:center;">
            <h2>🎉 انتهى الامتحان</h2>
            <p style="color:var(--text-muted);">${reason}</p>
            <div class="result-score">${correct}/${total}</div>
            <p>النسبة: ${percentage}%</p>
            ${attemptCount + 1 < MAX_ATTEMPTS ? `<button class="btn btn-primary" onclick="retryExam()">إعادة المحاولة (${attemptCount + 2}/${MAX_ATTEMPTS})</button>` : '<p>لا توجد محاولات متبقية</p>'}
            <a href="exams.html" class="btn" style="display:inline-block; margin-top:12px;">العودة للامتحانات</a>
        </div>`;
    }

    window.retryExam = () => {
        clearInterval(timerInterval);
        window.removeEventListener('beforeunload', warnBeforeLeave);
        document.removeEventListener('visibilitychange', handleVisibilityChange);
        examSubmitted = false;
        questions = examData.questions ? [...examData.questions].sort(() => Math.random() - 0.5) : [];
        startExam();
    };

    init();
</script>
</body>
</html>
