<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي | مستر عبدالله خليل</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>
    <style>
        :root {
            --bg-deep: #020012; --glass-bg: rgba(255,255,255,0.03); --glass-border: rgba(255,255,255,0.06);
            --glass-hover: rgba(255,255,255,0.05); --text-primary: #f0f0f7; --text-secondary: #b8b8d4;
            --text-muted: #6e6e90; --accent-gradient: linear-gradient(135deg, #4da8da, #7c5ce7, #22d3bb);
            --accent-3: #22d3bb; --radius-lg: 24px; --radius-md: 16px; --font: 'Cairo', sans-serif;
            --transition: 0.3s ease;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:var(--font); background:var(--bg-deep); color:var(--text-primary); display:flex; min-height:100vh; }
        .sidebar { width:260px; background:rgba(8,8,28,0.75); backdrop-filter:blur(35px); border-left:1px solid var(--glass-border); padding:24px 14px; flex-shrink:0; z-index:50; overflow-y:auto; }
        .sidebar .logo-icon { width:42px; height:42px; border-radius:14px; background:var(--accent-gradient); display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; margin-bottom:20px; overflow:hidden; }
        .sidebar .logo-icon img { width:100%; height:100%; object-fit:cover; border-radius:inherit; }
        .sidebar nav a { display:block; padding:10px 14px; border-radius:24px; color:var(--text-muted); text-decoration:none; font-size:0.88rem; margin-bottom:4px; }
        .sidebar nav a.active, .sidebar nav a:hover { background:rgba(255,255,255,0.05); color:#fff; }
        .main { flex:1; overflow-y:auto; max-height:100vh; }
        .topbar { padding:14px 24px; display:flex; justify-content:space-between; align-items:center; background:rgba(6,6,26,0.7); backdrop-filter:blur(25px); border-bottom:1px solid var(--glass-border); position:sticky; top:0; }
        .topbar h2 { background:var(--accent-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .btn { padding:8px 16px; border-radius:24px; font-weight:600; font-size:0.8rem; border:1.5px solid var(--glass-border); background:transparent; color:var(--text-primary); cursor:pointer; text-decoration:none; transition:var(--transition); }
        .btn-primary { background:var(--accent-gradient); border:none; color:#fff; }
        .content { padding:24px; max-width:800px; margin:0 auto; }
        .card { background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--radius-lg); padding:20px; backdrop-filter:blur(15px); margin-bottom:16px; }
        .profile-header { display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
        .avatar-wrapper { position:relative; }
        .avatar-ring { width:90px; height:90px; border-radius:50%; padding:3px; background:var(--accent-gradient); display:flex; align-items:center; justify-content:center; }
        .avatar-ring img { width:100%; height:100%; border-radius:50%; object-fit:cover; }
        .avatar-upload { position:absolute; bottom:0; left:0; background:var(--accent-gradient); border:none; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#fff; font-size:0.9rem; }
        .badge { padding:3px 10px; border-radius:12px; font-size:0.7rem; font-weight:600; }
        .badge-success { background:rgba(34,211,187,0.2); color:#22d3bb; }
        .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .info-row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.04); }
        .stats-inline { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; }
        .stat-circle { text-align:center; }
        .stat-circle svg { transform:rotate(-90deg); }
        .stat-circle .value { font-size:1.5rem; font-weight:800; }
        .table-wrapper { overflow-x:auto; }
        table { width:100%; border-collapse:collapse; font-size:0.82rem; }
        th, td { padding:10px 12px; text-align:right; border-bottom:1px solid rgba(255,255,255,0.04); }
        th { color:var(--text-muted); font-weight:600; font-size:0.7rem; }
        .message { padding:8px 12px; border-radius:14px; font-size:0.8rem; margin-top:8px; display:none; }
        .message.success { background:rgba(34,211,187,0.15); color:#22d3bb; border:1px solid rgba(34,211,187,0.3); }
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:center; z-index:100; }
        .modal { background:var(--bg-deep); border:1px solid var(--glass-border); border-radius:var(--radius-lg); padding:20px; max-width:700px; width:90%; max-height:80vh; overflow-y:auto; }
        @media (max-width:768px) { .sidebar { position:fixed; right:-280px; top:0; bottom:0; z-index:55; } .sidebar.open { right:0; } .info-grid { grid-template-columns:1fr; } }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="sidebar" id="sidebar">
    <div class="logo-icon" id="sidebarLogo">ع</div>
    <nav>
        <a href="dashboard.html">🏠 الرئيسية</a>
        <a href="assignments.html">📄 الواجبات</a>
        <a href="exams.html">📝 الامتحانات</a>
        <a href="schedule.html">📅 جداول الحصص</a>
        <a href="questions.html">💬 الأسئلة</a>
        <a href="profile.html" class="active">👤 حسابي</a>
        <a href="settings.html">⚙️ الإعدادات</a>
    </nav>
</div>
<div class="main">
    <div class="topbar">
        <h2>👤 الملف الشخصي</h2>
        <div><a href="dashboard.html" class="btn">رجوع</a> <button class="btn btn-sm" onclick="logout()">تسجيل الخروج</button></div>
    </div>
    <div class="content" id="profileContent">⏳ جاري التحميل...</div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDT0xGqGHzyyeB4qcz5AGMKxESCGZNNEWE",
        authDomain: "abdullah-khalil.firebaseapp.com",
        projectId: "abdullah-khalil",
        storageBucket: "abdullah-khalil.firebasestorage.app",
        messagingSenderId: "530661483867",
        appId: "1:530661483867:web:e2f165e9f808bcfcb8267e"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const CLOUDINARY_CLOUD = "deaevfmvm", CLOUDINARY_PRESET = "ml_default", CLOUDINARY_KEY = "864215656447737";
    const studentId = localStorage.getItem('studentId');
    if (!studentId) window.location.href = 'login.html';

    (async function loadSettings() {
        const doc = await db.collection('settings').doc('platform').get().catch(() => null);
        if (doc && doc.exists) {
            const data = doc.data();
            if (data.logo) document.getElementById('sidebarLogo').innerHTML = `<img src="${data.logo}" alt="لوجو">`;
            if (data.name) document.title = `الملف الشخصي | ${data.name}`;
        }
    })();

    async function loadProfile() {
        const container = document.getElementById('profileContent');
        try {
            const doc = await db.collection('students').doc(studentId).get();
            if (!doc.exists || doc.data().status !== 'مفعل') { window.location.href='login.html'; return; }
            const user = doc.data();
            const grade = user.grade || '';
            const avatarUrl = localStorage.getItem('studentAvatar') || user.avatar || '';

            // 1. إحصائيات
            let assignCount = 0, examResults = [], totalExamsInGrade = 0;
            try { assignCount = (await db.collection('assignmentSubmissions').where('studentId','==',studentId).get()).size; } catch(e){}
            try {
                const snap = await db.collection('examResults').where('studentId','==',studentId).orderBy('createdAt','desc').get();
                snap.forEach(d => examResults.push({id: d.id, ...d.data()}));
            } catch(e){}
            try {
                totalExamsInGrade = (await db.collection('exams').where('grade','==',grade).get()).size;
            } catch(e){}
            const solvedExamCount = examResults.length;
            const examCompletionPercent = totalExamsInGrade > 0 ? Math.round((solvedExamCount / totalExamsInGrade) * 100) : 0;
            const avgScore = examResults.length ? Math.round(examResults.reduce((a,b)=>a+(b.percentage||0),0)/examResults.length) : 0;

            // 2. آخر الواجبات
            let recentAssignments = [];
            try {
                const assignSnap = await db.collection('assignmentSubmissions')
                    .where('studentId','==',studentId)
                    .orderBy('submittedAt','desc')
                    .limit(5).get();
                assignSnap.forEach(d => recentAssignments.push({id: d.id, ...d.data()}));
            } catch(e){}

            // عرض الصفحة
            container.innerHTML = `
            <div class="card profile-header">
                <div class="avatar-wrapper">
                    <div class="avatar-ring">${avatarUrl ? `<img src="${avatarUrl}" alt="صورة">` : '👤'}</div>
                    <button class="avatar-upload" onclick="uploadAvatar()">📷</button>
                </div>
                <div><h2>${user.name||'طالب'}</h2><p style="color:var(--text-muted);">الصف: ${grade} | <span class="badge badge-success">مفعل</span></p><div id="uploadMsg" class="message"></div></div>
            </div>
            <div class="card info-grid">
                <div class="info-row"><span>البريد</span><span>${user.email||'—'}</span></div>
                <div class="info-row"><span>الهاتف</span><span>${user.phone||'—'}</span></div>
                <div class="info-row"><span>ولي الأمر</span><span>${user.parentPhone||'—'}</span></div>
                <div class="info-row"><span>تاريخ التسجيل</span><span>${user.createdAt?.toDate?.().toLocaleDateString('ar-EG')||'—'}</span></div>
            </div>

            <div class="card">
                <h3 style="margin-bottom:16px;">📊 ملخص التقدم</h3>
                <div class="stats-inline">
                    <div class="stat-circle">
                        <svg width="100" height="100" viewBox="0 0 36 36">
                            <circle cx="18" cy="18" r="15.5" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2.5"/>
                            <circle cx="18" cy="18" r="15.5" fill="none" stroke="url(#grad1)" stroke-width="2.5"
                                stroke-dasharray="${avgScore},100" stroke-linecap="round"/>
                            <defs><linearGradient id="grad1"><stop offset="0%" stop-color="#4da8da"/><stop offset="100%" stop-color="#22d3bb"/></linearGradient></defs>
                        </svg>
                        <div class="value">${avgScore}%</div>
                        <div style="color:var(--text-muted); font-size:0.8rem;">متوسط الدرجات</div>
                    </div>
                    <div class="stat-circle">
                        <svg width="100" height="100" viewBox="0 0 36 36">
                            <circle cx="18" cy="18" r="15.5" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2.5"/>
                            <circle cx="18" cy="18" r="15.5" fill="none" stroke="#7c5ce7" stroke-width="2.5"
                                stroke-dasharray="${Math.min((assignCount/15)*100,100)},100" stroke-linecap="round"/>
                        </svg>
                        <div class="value">${assignCount}</div>
                        <div style="color:var(--text-muted); font-size:0.8rem;">الواجبات المسلّمة</div>
                    </div>
                    <div class="stat-circle">
                        <svg width="100" height="100" viewBox="0 0 36 36">
                            <circle cx="18" cy="18" r="15.5" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2.5"/>
                            <circle cx="18" cy="18" r="15.5" fill="none" stroke="#f472b6" stroke-width="2.5"
                                stroke-dasharray="${examCompletionPercent},100" stroke-linecap="round"/>
                        </svg>
                        <div class="value">${examCompletionPercent}%</div>
                        <div style="color:var(--text-muted); font-size:0.8rem;">الامتحانات المحلولة</div>
                    </div>
                </div>
            </div>

            <h3>📝 نتائج الامتحانات الأخيرة</h3>
            <div class="card table-wrapper">
                <table><thead><tr><th>الامتحان</th><th>الدرجة</th><th>النسبة</th><th>التاريخ</th><th>تفاصيل</th></tr></thead>
                <tbody>${examResults.length ? examResults.map(r => `<tr><td>${r.examName||''}</td><td>${r.score||0}/${r.total||0}</td><td>${r.percentage||0}%</td><td>${r.createdAt?.toDate?.().toLocaleDateString('ar-EG')||''}</td><td><button class="btn btn-sm" onclick="viewExamDetails('${r.id}','${r.examId}')">🔍</button></td></tr>`).join('') : '<tr><td colspan="5" style="text-align:center;">لا توجد نتائج بعد</td></tr>'}</tbody></table>
            </div>
            <h3>📄 آخر الواجبات المسلّمة</h3>
            <div class="card table-wrapper">
                <table><thead><tr><th>الواجب</th><th>الحالة</th><th>الدرجة</th><th>تعليق</th></tr></thead>
                <tbody>${recentAssignments.length ? recentAssignments.map(a => `<tr><td>${a.assignmentId?.substring(0,8)||'—'}</td><td>${a.score!==undefined ? '✅ مصحح' : '⏳ مسلّم'}</td><td>${a.score??'—'}</td><td>${a.feedback||'—'}</td></tr>`).join('') : '<tr><td colspan="4" style="text-align:center;">لا توجد واجبات بعد</td></tr>'}</tbody></table>
            </div>
            `;
        } catch(e) { container.innerHTML = '<div style="text-align:center;padding:40px;">❌ خطأ في تحميل البيانات</div>'; }
    }
    loadProfile();

    // رفع الصورة
    window.uploadAvatar = function() {
        const msgEl = document.getElementById('uploadMsg');
        window.cloudinary.openUploadWidget({
            cloudName: CLOUDINARY_CLOUD, uploadPreset: CLOUDINARY_PRESET, apiKey: CLOUDINARY_KEY,
            sources: ['local','camera'], multiple: false, resourceType: 'image',
            clientAllowedFormats: ['png','jpg','jpeg'], maxFileSize: 5000000, language: 'ar'
        }, async (error, result) => {
            if (!error && result?.event === 'success') {
                const url = result.info.secure_url;
                await db.collection('students').doc(studentId).update({ avatar: url });
                localStorage.setItem('studentAvatar', url);
                msgEl.className = 'message success'; msgEl.style.display = 'block'; msgEl.textContent = '✅ تم تحديث الصورة';
                loadProfile();
            }
        });
    };

    // تفاصيل الامتحان
    window.viewExamDetails = async function(resultId, examId) {
        // جلب نتيجة الامتحان
        const resultDoc = await db.collection('examResults').doc(resultId).get();
        if (!resultDoc.exists) return;
        const result = resultDoc.data();
        const answers = result.answers || {};
        // جلب الامتحان الأصلي
        const examDoc = await db.collection('exams').doc(examId).get();
        if (!examDoc.exists) return;
        const exam = examDoc.data();
        const questions = exam.questions || [];
        // بناء نافذة منبثقة
        let modalHtml = `<div class="modal-overlay" id="examModal" onclick="if(event.target===this) this.remove()"><div class="modal"><h3>تفاصيل امتحان ${exam.name}</h3>`;
        questions.forEach((q, i) => {
            const userAnswer = answers[q.id] !== undefined ? answers[q.id] : -1;
            const isCorrect = userAnswer === q.correct;
            modalHtml += `<div style="margin:12px 0; padding:8px; background:rgba(255,255,255,0.02); border-radius:12px;">
                <strong>سؤال ${i+1}:</strong> ${q.text||''}
                ${q.image ? `<br><img src="${q.image}" style="max-width:200px; border-radius:8px; margin:4px 0;">` : ''}
                <div style="margin-top:6px;">
                    ${q.options.map((opt, idx) => {
                        let style = '';
                        if (idx === q.correct) style = 'background:rgba(34,211,187,0.2); border:1px solid #22d3bb;';
                        if (idx === userAnswer && idx !== q.correct) style = 'background:rgba(239,68,68,0.2); border:1px solid #f87171;';
                        if (idx === userAnswer && idx === q.correct) style = 'background:rgba(34,211,187,0.3); border:1px solid #22d3bb;';
                        return `<div style="padding:4px 8px; border-radius:8px; margin:2px 0; ${style}">${['أ','ب','ج','د'][idx]}. ${opt}</div>`;
                    }).join('')}
                </div>
                <span style="font-size:0.8rem; color:${isCorrect ? 'var(--accent-3)' : 'var(--danger)'};">${isCorrect ? '✅ صحيحة' : '❌ خطأ'}</span>
            </div>`;
        });
        modalHtml += `<button class="btn" onclick="document.getElementById('examModal').remove()">إغلاق</button></div></div>`;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
    };

    window.logout = () => { localStorage.clear(); window.location.href = 'login.html'; };
</script>
</body>
</html>
