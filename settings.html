<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإعدادات | مستر عبدالله خليل</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-deep: #020012; --glass-bg: rgba(255,255,255,0.03); --glass-border: rgba(255,255,255,0.06);
            --glass-hover: rgba(255,255,255,0.05); --text-primary: #f0f0f7; --text-secondary: #b8b8d4;
            --text-muted: #6e6e90; --accent-gradient: linear-gradient(135deg, #4da8da, #7c5ce7, #22d3bb);
            --accent-2: #7c5ce7; --radius-lg: 24px; --radius-md: 16px; --font: 'Cairo', sans-serif;
            --transition: 0.3s ease;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:var(--font); background:var(--bg-deep); color:var(--text-primary); display:flex; min-height:100vh; }
        .sidebar { width:260px; background:rgba(8,8,28,0.75); backdrop-filter:blur(35px); border-left:1px solid var(--glass-border); padding:24px 14px; flex-shrink:0; z-index:50; overflow-y:auto; }
        .sidebar .logo-icon { width:42px; height:42px; border-radius:14px; background:var(--accent-gradient); display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; margin-bottom:20px; overflow:hidden; }
        .sidebar .logo-icon img { width:100%; height:100%; object-fit:cover; border-radius:inherit; }
        .sidebar nav a { display:block; padding:10px 14px; border-radius:24px; color:var(--text-muted); text-decoration:none; font-size:0.88rem; margin-bottom:4px; }
        .sidebar nav a.active, .sidebar nav a:hover { background:rgba(255,255,255,0.05); color:#fff; }
        .main { flex:1; overflow-y:auto; max-height:100vh; }
        .topbar { padding:14px 24px; display:flex; justify-content:space-between; align-items:center; background:rgba(6,6,26,0.7); backdrop-filter:blur(25px); border-bottom:1px solid var(--glass-border); position:sticky; top:0; }
        .topbar h2 { background:var(--accent-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .btn { padding:8px 16px; border-radius:24px; font-weight:600; font-size:0.8rem; border:1.5px solid var(--glass-border); background:transparent; color:var(--text-primary); cursor:pointer; text-decoration:none; transition:var(--transition); }
        .btn-primary { background:var(--accent-gradient); border:none; color:#fff; }
        .content { padding:24px; max-width:700px; margin:0 auto; }
        .card { background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--radius-lg); padding:20px; backdrop-filter:blur(15px); margin-bottom:20px; }
        .form-group { margin-bottom:16px; }
        .form-group label { display:block; font-size:0.85rem; margin-bottom:6px; color:var(--text-secondary); }
        .form-group input { width:100%; padding:12px 16px; border-radius:30px; border:1.5px solid var(--glass-border); background:rgba(255,255,255,0.04); color:#fff; font-family:var(--font); font-size:0.9rem; outline:none; }
        .form-group input:focus { border-color:var(--accent-2); }
        .message { padding:10px 14px; border-radius:20px; margin:10px 0; font-size:0.85rem; display:none; }
        .message.success { background:rgba(34,211,187,0.15); color:#22d3bb; border:1px solid rgba(34,211,187,0.3); }
        .message.error { background:rgba(239,68,68,0.15); color:#f87171; border:1px solid rgba(239,68,68,0.3); }
        .toggle-row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; }
        .toggle { width:44px; height:24px; background:rgba(255,255,255,0.2); border-radius:12px; position:relative; cursor:pointer; transition:0.3s; }
        .toggle.active { background:var(--accent-gradient); }
        .toggle::after { content:''; position:absolute; width:20px; height:20px; background:#fff; border-radius:50%; top:2px; right:2px; transition:0.3s; }
        .toggle.active::after { right:22px; }
        @media (max-width:768px) { .sidebar { position:fixed; right:-280px; top:0; bottom:0; z-index:55; } .sidebar.open { right:0; } }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="sidebar" id="sidebar">
    <div class="logo-icon" id="sidebarLogo">ع</div>
    <nav>
        <a href="dashboard.html">🏠 الرئيسية</a>
        <a href="assignments.html">📄 الواجبات</a>
        <a href="exams.html">📝 الامتحانات</a>
        <a href="schedule.html">📅 جداول الحصص</a>
        <a href="questions.html">💬 الأسئلة</a>
        <a href="profile.html">👤 حسابي</a>
        <a href="settings.html" class="active">⚙️ الإعدادات</a>
    </nav>
</div>
<div class="main">
    <div class="topbar">
        <h2>⚙️ الإعدادات</h2>
        <a href="dashboard.html" class="btn">رجوع</a>
    </div>
    <div class="content">
        <div class="card">
            <h3>🔒 تغيير كلمة المرور</h3>
            <div class="form-group"><label>كلمة المرور الحالية</label><input type="password" id="currentPassword"></div>
            <div class="form-group"><label>كلمة المرور الجديدة</label><input type="password" id="newPassword"></div>
            <button class="btn btn-primary" onclick="changePassword()">تحديث كلمة المرور</button>
            <div class="message" id="passwordMsg"></div>
        </div>
        <div class="card">
            <h3>📱 تحديث رقم الهاتف</h3>
            <div class="form-group"><label>رقم الهاتف الجديد</label><input type="tel" id="newPhone" placeholder="01000000000"></div>
            <button class="btn btn-primary" onclick="updatePhone()">حفظ الرقم</button>
            <div class="message" id="phoneMsg"></div>
        </div>
        <div class="card">
            <h3>🔔 تفضيلات الإشعارات</h3>
            <div class="toggle-row"><span>استلام إشعارات الواجبات</span><div class="toggle active" id="toggleAssign" onclick="togglePref('assignNotif')"></div></div>
            <div class="toggle-row"><span>استلام إشعارات الامتحانات</span><div class="toggle active" id="toggleExam" onclick="togglePref('examNotif')"></div></div>
            <button class="btn btn-primary" onclick="savePreferences()">حفظ التفضيلات</button>
            <div class="message" id="prefMsg"></div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDT0xGqGHzyyeB4qcz5AGMKxESCGZNNEWE",
        authDomain: "abdullah-khalil.firebaseapp.com",
        projectId: "abdullah-khalil",
        storageBucket: "abdullah-khalil.firebasestorage.app",
        messagingSenderId: "530661483867",
        appId: "1:530661483867:web:e2f165e9f808bcfcb8267e"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const studentId = localStorage.getItem('studentId');
    if (!studentId) window.location.href = 'login.html';

    // تحميل إعدادات المنصة
    (async function loadSettings() {
        const doc = await db.collection('settings').doc('platform').get();
        if (doc.exists) {
            const data = doc.data();
            if (data.logo) document.getElementById('sidebarLogo').innerHTML = `<img src="${data.logo}" alt="لوجو">`;
            if (data.name) document.title = `الإعدادات | ${data.name}`;
        }
        // تحميل تفضيلات الطالب
        const prefDoc = await db.collection('studentSettings').doc(studentId).get();
        if (prefDoc.exists) {
            const prefs = prefDoc.data();
            if (prefs.assignNotif === false) document.getElementById('toggleAssign').classList.remove('active');
            if (prefs.examNotif === false) document.getElementById('toggleExam').classList.remove('active');
        }
    })();

    window.togglePref = function(pref) {
        const el = pref === 'assignNotif' ? document.getElementById('toggleAssign') : document.getElementById('toggleExam');
        el.classList.toggle('active');
    };

    window.savePreferences = async function() {
        const assignNotif = document.getElementById('toggleAssign').classList.contains('active');
        const examNotif = document.getElementById('toggleExam').classList.contains('active');
        await db.collection('studentSettings').doc(studentId).set({ assignNotif, examNotif }, { merge: true });
        const msg = document.getElementById('prefMsg');
        msg.className = 'message success'; msg.style.display = 'block'; msg.textContent = '✅ تم حفظ التفضيلات';
        setTimeout(() => msg.style.display = 'none', 2500);
    };

    window.changePassword = async function() {
        const current = document.getElementById('currentPassword').value;
        const newPass = document.getElementById('newPassword').value;
        const msg = document.getElementById('passwordMsg');
        if (!current || !newPass) { msg.className='message error'; msg.style.display='block'; msg.textContent='يرجى إدخال كلمتي المرور'; return; }
        const user = auth.currentUser;
        if (!user) { msg.className='message error'; msg.style.display='block'; msg.textContent='يجب تسجيل الدخول أولاً'; return; }
        try {
            const credential = firebase.auth.EmailAuthProvider.credential(user.email, current);
            await user.reauthenticateWithCredential(credential);
            await user.updatePassword(newPass);
            msg.className='message success'; msg.style.display='block'; msg.textContent='✅ تم تغيير كلمة المرور بنجاح';
            document.getElementById('currentPassword').value = '';
            document.getElementById('newPassword').value = '';
        } catch(e) {
            msg.className='message error'; msg.style.display='block';
            msg.textContent = e.code === 'auth/wrong-password' ? 'كلمة المرور الحالية غير صحيحة' : 'حدث خطأ';
        }
    };

    window.updatePhone = async function() {
        const phone = document.getElementById('newPhone').value.trim();
        const msg = document.getElementById('phoneMsg');
        if (!phone) { msg.className='message error'; msg.style.display='block'; msg.textContent='أدخل رقم الهاتف'; return; }
        await db.collection('students').doc(studentId).update({ phone });
        msg.className='message success'; msg.style.display='block'; msg.textContent='✅ تم تحديث رقم الهاتف';
        setTimeout(() => msg.style.display = 'none', 2500);
    };
</script>
</body>
</html>
