<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الامتحانات | مستر عبدالله خليل</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #0f0f28;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.07);
            --text-primary: #f0f0f5;
            --text-secondary: #b0b0c8;
            --text-muted: #70708a;
            --accent-gradient: linear-gradient(135deg, #4da8da 0%, #7c5ce7 50%, #22d3bb 100%);
            --shadow-glow: 0 0 40px rgba(124, 92, 231, 0.3);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --font-ar: 'Cairo', 'Tajawal', sans-serif;
            --transition-smooth: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; font-size: 16px; }
        body {
            font-family: var(--font-ar);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 70px;
        }
        .aurora-bg {
            position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:hidden;
        }
        .aurora-bg .orb {
            position: absolute; border-radius:50%; filter:blur(120px); opacity:0.22; animation:auroraFloat 20s infinite ease-in-out;
        }
        .aurora-bg .orb:nth-child(1) { width:600px; height:600px; background:radial-gradient(circle, #4da8da 0%, transparent 70%); top:-200px; left:-150px; }
        .aurora-bg .orb:nth-child(2) { width:500px; height:500px; background:radial-gradient(circle, #7c5ce7 0%, transparent 70%); bottom:-150px; right:-150px; animation-delay:-7s; }
        @keyframes auroraFloat {
            0%,100% { transform:translate(0,0) scale(1); }
            25% { transform:translate(60px,-40px) scale(1.1); }
            50% { transform:translate(-30px,50px) scale(0.9); }
            75% { transform:translate(-50px,-30px) scale(1.05); }
        }
        .floating-shapes { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
        .floating-shapes .shape { position:absolute; opacity:0.05; animation:floatShape 15s infinite ease-in-out; }
        .floating-shapes .hex { width:80px; height:46px; border:2px solid rgba(255,255,255,0.3); clip-path:polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); }
        @keyframes floatShape { 0%,100%{transform:translateY(0) rotate(0deg);} 33%{transform:translateY(-40px) rotate(5deg);} 66%{transform:translateY(20px) rotate(-3deg);} }
        .main-content { position:relative; z-index:1; }
        .navbar {
            position:sticky; top:0; z-index:1000; background:rgba(10,10,26,0.8); backdrop-filter:blur(30px);
            border-bottom:1px solid var(--glass-border); padding:0 24px;
        }
        .navbar-inner { max-width:1200px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; height:64px; gap:16px; }
        .navbar-logo { display:flex; align-items:center; gap:10px; text-decoration:none; }
        .navbar-logo .logo-icon { width:40px; height:40px; border-radius:var(--radius-sm); background:var(--accent-gradient); display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; }
        .btn { padding:8px 18px; border-radius:30px; font-family:var(--font-ar); font-weight:600; font-size:0.85rem; border:none; cursor:pointer; transition:var(--transition-smooth); background:transparent; color:var(--text-primary); border:1.5px solid var(--glass-border); text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
        .btn-primary { background:var(--accent-gradient); border:none; color:#fff; }
        .exams-content { padding:24px; max-width:1200px; margin:0 auto; }
        .page-header { margin-bottom:24px; }
        .page-header h2 { font-size:1.8rem; font-weight:700; }
        .filter-bar { display:flex; gap:12px; margin-bottom:24px; flex-wrap:wrap; align-items:center; }
        .filter-bar select, .filter-bar input { padding:10px 18px; border-radius:30px; border:1.5px solid var(--glass-border); background:rgba(255,255,255,0.04); color:#fff; font-family:var(--font-ar); font-size:0.9rem; outline:none; }
        .filter-bar input { width:250px; }
        .exams-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap:20px; }
        .exam-card {
            background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--radius-lg);
            padding:24px; backdrop-filter:blur(10px); transition:var(--transition-smooth); cursor:pointer;
            text-decoration:none; color:inherit; display:block;
        }
        .exam-card:hover { background:var(--glass-hover); transform:translateY(-4px); box-shadow:0 15px 40px rgba(0,0,0,0.5); }
        .exam-icon { font-size:2.5rem; margin-bottom:12px; }
        .exam-card h3 { font-size:1.2rem; font-weight:700; margin-bottom:8px; }
        .exam-meta { display:flex; gap:16px; flex-wrap:wrap; font-size:0.85rem; color:var(--text-secondary); }
        .badge { padding:4px 12px; border-radius:20px; font-size:0.75rem; font-weight:600; }
        .badge-success { background:rgba(34,211,187,0.2); color:#22d3bb; }
        .empty-state { text-align:center; padding:60px 20px; color:var(--text-muted); }
        .bottom-nav { display:none; position:fixed; bottom:0; left:0; width:100%; background:rgba(15,15,40,0.9); backdrop-filter:blur(25px); border-top:1px solid var(--glass-border); z-index:1000; padding:8px 16px 12px; justify-content:space-around; align-items:center; }
        .bottom-nav a { display:flex; flex-direction:column; align-items:center; gap:4px; text-decoration:none; color:var(--text-muted); font-size:0.7rem; }
        .bottom-nav a.active, .bottom-nav a:hover { color:var(--accent-1); }
        @media (max-width:768px) { .bottom-nav { display:flex; } }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="aurora-bg"><div class="orb"></div><div class="orb"></div></div>
<div class="floating-shapes"><div class="shape hex" style="top:10%;left:8%;"></div></div>
<div class="main-content">
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="index.html" class="navbar-logo"><div class="logo-icon">ع</div><span>مستر عبدالله خليل</span></a>
            <div style="display:flex; gap:12px;">
                <a href="dashboard.html" class="btn btn-sm">لوحة التحكم</a>
                <button class="btn btn-sm" onclick="logout()">تسجيل الخروج</button>
            </div>
        </div>
    </nav>
    <div class="exams-content">
        <div class="page-header">
            <h2>📝 الامتحانات</h2>
            <p style="color:var(--text-muted);">اختبر معلوماتك مع مجموعة من الامتحانات المحاكية</p>
        </div>
        <div class="filter-bar">
            <select id="gradeFilter" onchange="filterExams()">
                <option value="">كل الصفوف</option>
                <option>الأول الثانوي</option>
                <option>الثاني الثانوي</option>
                <option>الثالث الثانوي</option>
            </select>
            <input type="text" id="searchInput" placeholder="🔍 بحث عن امتحان..." oninput="filterExams()">
        </div>
        <div class="exams-grid" id="examsGrid"></div>
    </div>
</div>
<nav class="bottom-nav">
    <a href="dashboard.html"><span>🏠</span><span>الرئيسية</span></a>
    <a href="courses.html"><span>📚</span><span>كورساتي</span></a>
    <a href="exams.html" class="active"><span>📝</span><span>الامتحانات</span></a>
    <a href="profile.html"><span>👤</span><span>حسابي</span></a>
</nav>

<script>
    (function() {
        const firebaseConfig = {
            apiKey: "AIzaSyDT0xGqGHzyyeB4qcz5AGMKxESCGZNNEWE",
            authDomain: "abdullah-khalil.firebaseapp.com",
            projectId: "abdullah-khalil",
            storageBucket: "abdullah-khalil.firebasestorage.app",
            messagingSenderId: "530661483867",
            appId: "1:530661483867:web:e2f165e9f808bcfcb8267e"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let allExams = [];

        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                document.querySelector('.navbar-inner div').innerHTML = '<a href="login.html" class="btn btn-sm">تسجيل الدخول</a>';
            } else {
                const userDoc = await db.collection('students').doc(user.uid).get();
                if (userDoc.exists && userDoc.data().status === 'مفعل') {
                    document.querySelector('.navbar-inner div').innerHTML = `
                        <a href="dashboard.html" class="btn btn-sm">لوحة التحكم</a>
                        <button class="btn btn-sm" onclick="logout()">تسجيل الخروج</button>
                    `;
                }
            }
            loadAllExams();
        });

        async function loadAllExams() {
            try {
                const snap = await db.collection('exams').orderBy('createdAt', 'desc').get();
                allExams = [];
                snap.forEach(doc => { allExams.push({ id: doc.id, ...doc.data() }); });
                renderExams(allExams);
            } catch (e) {
                console.error(e);
                document.getElementById('examsGrid').innerHTML = '<div class="empty-state">❌ تعذر تحميل الامتحانات</div>';
            }
        }

        function renderExams(exams) {
            const grid = document.getElementById('examsGrid');
            if (exams.length === 0) {
                grid.innerHTML = '<div class="empty-state">لا توجد امتحانات متاحة حالياً</div>';
                return;
            }
            grid.innerHTML = exams.map(exam => `
                <a href="exam.html?id=${exam.id}" class="exam-card">
                    <div class="exam-icon">📋</div>
                    <h3>${exam.name}</h3>
                    <div class="exam-meta">
                        <span>⏱️ ${exam.time || 30} دقيقة</span>
                        <span>📝 ${exam.questions?.length || 0} سؤال</span>
                        <span>📚 ${exam.grade || 'عام'}</span>
                    </div>
                </a>
            `).join('');
        }

        window.filterExams = function() {
            const grade = document.getElementById('gradeFilter').value;
            const search = document.getElementById('searchInput').value.toLowerCase();
            let filtered = allExams;
            if (grade) filtered = filtered.filter(e => e.grade === grade);
            if (search) filtered = filtered.filter(e => e.name.toLowerCase().includes(search));
            renderExams(filtered);
        };

        window.logout = async () => { await auth.signOut(); window.location.href = 'login.html'; };
    })();
</script>
</body>
</html>
