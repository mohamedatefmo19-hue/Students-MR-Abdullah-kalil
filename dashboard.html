<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | مستر عبدالله خليل</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-deep: #020012;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-hover: rgba(255, 255, 255, 0.05);
            --text-primary: #f0f0f7;
            --text-secondary: #b8b8d4;
            --text-muted: #6e6e90;
            --accent-gradient: linear-gradient(135deg, #4da8da, #7c5ce7, #22d3bb);
            --accent-1: #4da8da;
            --accent-2: #7c5ce7;
            --accent-3: #22d3bb;
            --danger: #ef4444;
            --shadow-glow: 0 0 80px rgba(124, 92, 231, 0.25);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --font: 'Cairo', sans-serif;
            --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { font-size:16px; }
        body {
            font-family:var(--font);
            background:var(--bg-deep);
            color:var(--text-primary);
            display:flex;
            min-height:100vh;
            overflow-x:hidden;
        }
        .aurora { position:fixed; inset:0; pointer-events:none; z-index:0; }
        .aurora .orb { position:absolute; border-radius:50%; filter:blur(140px); opacity:0.13; animation:float 22s infinite ease-in-out; }
        .aurora .orb:nth-child(1){ width:700px; height:700px; background:#4da8da; top:-250px; left:-200px; }
        .aurora .orb:nth-child(2){ width:550px; height:550px; background:#7c5ce7; bottom:-200px; right:-180px; animation-delay:-10s; }
        @keyframes float { 0%,100%{transform:translate(0,0) scale(1);} 33%{transform:translate(50px,-40px) scale(1.1);} 66%{transform:translate(-40px,50px) scale(0.9);} }
        .sidebar {
            width:260px; background:rgba(8,8,28,0.75); backdrop-filter:blur(35px);
            border-left:1px solid var(--glass-border); padding:24px 14px; display:flex; flex-direction:column;
            gap:4px; flex-shrink:0; z-index:50; transition:transform 0.4s; overflow-y:auto;
        }
        .sidebar .logo { display:flex; align-items:center; gap:10px; padding:8px 12px; margin-bottom:20px; text-decoration:none; }
        .sidebar .logo-icon { width:42px; height:42px; border-radius:var(--radius-md); background:var(--accent-gradient); display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; box-shadow:var(--shadow-glow); overflow:hidden; }
        .sidebar .logo-icon img { width:100%; height:100%; object-fit:cover; border-radius:inherit; }
        .sidebar nav { display:flex; flex-direction:column; gap:2px; flex:1; }
        .sidebar nav a {
            display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:24px;
            color:var(--text-secondary); text-decoration:none; font-weight:500; font-size:0.88rem; transition:var(--transition); cursor:pointer;
        }
        .sidebar nav a:hover, .sidebar nav a.active { background:rgba(255,255,255,0.05); color:#fff; }
        .sidebar nav a.active { background:rgba(124,92,231,0.12); }
        .main { flex:1; display:flex; flex-direction:column; overflow-y:auto; max-height:100vh; position:relative; z-index:5; }
        .topbar {
            padding:14px 24px; display:flex; justify-content:space-between; align-items:center;
            background:rgba(6,6,26,0.7); backdrop-filter:blur(25px); border-bottom:1px solid var(--glass-border);
            position:sticky; top:0; z-index:20;
        }
        .topbar h2 { font-size:1.2rem; font-weight:700; background:var(--accent-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .btn { padding:8px 16px; border-radius:24px; font-weight:600; font-size:0.8rem; border:1.5px solid var(--glass-border); background:transparent; color:var(--text-primary); cursor:pointer; text-decoration:none; transition:var(--transition); }
        .btn-primary { background:var(--accent-gradient); border:none; color:#fff; }
        .content { padding:24px; flex:1; display:flex; flex-direction:column; gap:20px; }
        .card { background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--radius-lg); padding:20px; backdrop-filter:blur(15px); }
        .welcome-card { display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
        .avatar-ring { width:64px; height:64px; border-radius:50%; padding:3px; background:var(--accent-gradient); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:2rem; color:#fff; overflow:hidden; }
        .avatar-ring img { width:100%; height:100%; border-radius:50%; object-fit:cover; }
        .notifications-list { display:flex; flex-direction:column; gap:10px; }
        .notif-item {
            background:rgba(255,255,255,0.04); border:1px solid var(--glass-border); border-radius:var(--radius-md);
            padding:12px 16px; display:flex; align-items:center; gap:12px;
        }
        .notif-item .dot { width:10px; height:10px; border-radius:50%; background:var(--accent-2); flex-shrink:0; }
        .quick-links { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:14px; }
        .quick-link {
            background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--radius-md);
            padding:18px 12px; text-align:center; text-decoration:none; color:var(--text-primary); transition:var(--transition);
        }
        .quick-link:hover { background:var(--glass-hover); transform:translateY(-3px); }
        .quick-link .icon { font-size:1.8rem; margin-bottom:6px; }
        .empty-state { text-align:center; padding:30px; color:var(--text-muted); }
        .menu-toggle { display:none; background:none; border:none; color:#fff; font-size:1.6rem; cursor:pointer; }
        .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:40; }
        @media (max-width:768px) {
            .sidebar { position:fixed; right:-280px; top:0; bottom:0; z-index:55; }
            .sidebar.open { right:0; }
            .overlay.show { display:block; }
            .menu-toggle { display:block; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="aurora"><div class="orb"></div><div class="orb"></div></div>
<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">
    <a href="index.html" class="logo">
        <div class="logo-icon" id="sidebarLogo">ع</div>
        <span style="font-weight:700;color:#fff;" id="sidebarPlatformName">لوحة التحكم</span>
    </a>
    <nav>
        <a class="active" href="dashboard.html">🏠 الرئيسية</a>
        <a href="assignments.html">📄 الواجبات</a>
        <a href="exams.html">📝 الامتحانات</a>
        <a href="schedule.html">📅 جداول الحصص</a>
        <a href="questions.html">💬 الأسئلة</a>
        <a href="profile.html">👤 حسابي</a>
        <a href="settings.html">⚙️ الإعدادات</a>
    </nav>
</aside>

<div class="main">
    <div class="topbar">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <h2>📊 لوحة التحكم</h2>
        <div>
            <a href="index.html" class="btn btn-sm">الموقع</a>
            <button class="btn btn-sm" onclick="logout()">تسجيل الخروج</button>
        </div>
    </div>
    <div class="content" id="dashboardContent">
        <div class="empty-state">⏳ جاري تحميل بياناتك...</div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDT0xGqGHzyyeB4qcz5AGMKxESCGZNNEWE",
        authDomain: "abdullah-khalil.firebaseapp.com",
        projectId: "abdullah-khalil",
        storageBucket: "abdullah-khalil.firebasestorage.app",
        messagingSenderId: "530661483867",
        appId: "1:530661483867:web:e2f165e9f808bcfcb8267e"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const studentId = localStorage.getItem('studentId');
    if (!studentId) { window.location.href = 'login.html'; }

    // تحميل إعدادات المنصة (اللوجو والاسم)
    (async function loadPlatformSettings() {
        try {
            const doc = await db.collection('settings').doc('platform').get().catch(() => null);
            if (doc && doc.exists) {
                const data = doc.data();
                if (data.logo) {
                    document.getElementById('sidebarLogo').innerHTML = `<img src="${data.logo}" alt="لوجو">`;
                }
                if (data.name) {
                    document.getElementById('sidebarPlatformName').textContent = data.name;
                    document.title = `لوحة التحكم | ${data.name}`;
                }
            }
        } catch(e) { console.warn('تعذر تحميل الإعدادات'); }
    })();

    (async function loadDashboard() {
        const container = document.getElementById('dashboardContent');
        try {
            const userDoc = await db.collection('students').doc(studentId).get();
            if (!userDoc.exists || userDoc.data().status !== 'مفعل') {
                localStorage.clear(); window.location.href='login.html'; return;
            }
            const user = userDoc.data();
            const grade = user.grade || '';
            const avatarUrl = localStorage.getItem('studentAvatar') || user.avatar || '';

            // البحث عن مجموعة الطالب
            let groupId = null;
            try {
                const gSnap = await db.collection('groups').where('grade', '==', grade).get();
                if (!gSnap.empty) {
                    for (const gDoc of gSnap.docs) {
                        const gData = gDoc.data();
                        if (gData.students && gData.students.includes(studentId)) {
                            groupId = gDoc.id;
                            break;
                        }
                    }
                }
            } catch(e) {}

            // جلب الإشعارات النشطة (بدون فلاتر معقدة، ثم تصفية محلياً)
            const now = new Date();
            let notifications = [];
            try {
                const allSnap = await db.collection('notifications')
                    .where('expiresAt', '>', now)
                    .orderBy('expiresAt', 'asc')
                    .get()
                    .catch(() => ({ empty: true, docs: [] }));

                const notifMap = new Map();
                if (!allSnap.empty) {
                    allSnap.forEach(doc => {
                        const n = doc.data();
                        // مطابقة الشروط
                        const gradeMatch = n.targetGrade === 'all' || n.targetGrade === grade || !n.targetGrade;
                        const groupMatch = n.targetGroupId === groupId || !n.targetGroupId;
                        const studentMatch = n.targetStudentId === studentId || !n.targetStudentId;

                        if ((gradeMatch && groupMatch) || studentMatch) {
                            if (!notifMap.has(doc.id)) {
                                notifMap.set(doc.id, { id: doc.id, ...n });
                            }
                        }
                    });
                }
                notifications = Array.from(notifMap.values());
            } catch(e) { console.warn('تعذر جلب الإشعارات', e); }

            container.innerHTML = `
                <div class="card welcome-card">
                    <div class="avatar-ring">${avatarUrl ? `<img src="${avatarUrl}" alt="صورة الطالب">` : '👤'}</div>
                    <div>
                        <h3>مرحباً، ${user.name || 'طالب'} 👋</h3>
                        <p style="color:var(--text-muted);">الصف: ${grade} | الحالة: <span style="color:var(--accent-3);">مفعل</span></p>
                    </div>
                </div>
                <div class="card">
                    <h3>🔔 الإشعارات</h3>
                    <div class="notifications-list">
                        ${notifications.length ? notifications.map(n => `
                            <div class="notif-item">
                                <span class="dot"></span>
                                <div style="flex:1;">
                                    <strong>${n.title || 'إشعار'}</strong>
                                    <p style="color:var(--text-secondary); font-size:0.85rem;">${n.body || ''}</p>
                                </div>
                                <span style="color:var(--text-muted); font-size:0.75rem;">${n.expiresAt?.toDate?.().toLocaleString('ar-EG') || ''}</span>
                            </div>
                        `).join('') : '<div class="empty-state">لا توجد إشعارات حالياً</div>'}
                    </div>
                </div>
                <h3>⚡ روابط سريعة</h3>
                <div class="quick-links">
                    <a href="assignments.html" class="quick-link"><div class="icon">📄</div>الواجبات</a>
                    <a href="exams.html" class="quick-link"><div class="icon">📝</div>الامتحانات</a>
                    <a href="schedule.html" class="quick-link"><div class="icon">📅</div>جداول الحصص</a>
                    <a href="questions.html" class="quick-link"><div class="icon">💬</div>الأسئلة</a>
                </div>
            `;
        } catch(e) {
            console.error(e);
            container.innerHTML = '<div class="empty-state">❌ حدث خطأ في تحميل البيانات</div>';
        }
    })();

    window.logout = () => { localStorage.clear(); window.location.href = 'login.html'; };

    // Mobile sidebar toggle
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    document.getElementById('menuToggle').addEventListener('click', () => {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
    });
    overlay.addEventListener('click', () => {
        sidebar.classList.remove('open');
        overlay.classList.remove('show');
    });
    document.querySelectorAll('.sidebar nav a').forEach(link => {
        link.addEventListener('click', () => {
            if (window.innerWidth <= 768) {
                sidebar.classList.remove('open');
                overlay.classList.remove('show');
            }
        });
    });
</script>
</body>
</html>
