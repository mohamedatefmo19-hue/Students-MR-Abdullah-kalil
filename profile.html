<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي | مستر عبدالله خليل</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>
    <style>
        :root {
            --bg-deep: #020012;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.06);
            --text-primary: #f0f0f7;
            --text-muted: #6e6e90;
            --accent-gradient: linear-gradient(135deg, #4da8da, #7c5ce7, #22d3bb);
            --radius-lg: 20px;
            --font: 'Cairo', sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:var(--font); background:var(--bg-deep); color:var(--text-primary); display:flex; min-height:100vh; }
        .sidebar { width:260px; background:rgba(8,8,28,0.75); backdrop-filter:blur(35px); border-left:1px solid var(--glass-border); padding:24px 14px; flex-shrink:0; z-index:50; overflow-y:auto; }
        .sidebar .logo-icon { width:42px; height:42px; border-radius:14px; background:var(--accent-gradient); display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; margin-bottom:20px; }
        .sidebar nav a { display:block; padding:10px 14px; border-radius:24px; color:var(--text-muted); text-decoration:none; margin-bottom:4px; }
        .sidebar nav a.active, .sidebar nav a:hover { background:rgba(255,255,255,0.05); color:#fff; }
        .main { flex:1; overflow-y:auto; max-height:100vh; }
        .topbar { padding:14px 24px; display:flex; justify-content:space-between; align-items:center; background:rgba(6,6,26,0.7); backdrop-filter:blur(25px); border-bottom:1px solid var(--glass-border); position:sticky; top:0; }
        .content { padding:24px; max-width:700px; margin:0 auto; }
        .card { background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--radius-lg); padding:20px; backdrop-filter:blur(15px); margin-bottom:16px; }
        .avatar-section { display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
        .avatar-preview { width:90px; height:90px; border-radius:50%; background:var(--accent-gradient); display:flex; align-items:center; justify-content:center; font-size:2.5rem; color:#fff; object-fit:cover; }
        .upload-btn { background:var(--accent-gradient); border:none; padding:8px 18px; border-radius:24px; color:#fff; font-weight:600; cursor:pointer; font-size:0.9rem; margin-top:10px; }
        .message { padding:10px; border-radius:14px; margin:10px 0; font-size:0.85rem; display:none; }
        .success { background:rgba(34,211,187,0.15); color:#22d3bb; border:1px solid rgba(34,211,187,0.3); }
        .error { background:rgba(239,68,68,0.15); color:#f87171; border:1px solid rgba(239,68,68,0.3); }
        .btn { padding:8px 16px; border-radius:24px; border:1.5px solid var(--glass-border); background:transparent; color:var(--text-primary); cursor:pointer; text-decoration:none; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="sidebar">
    <div class="logo-icon">ع</div>
    <nav>
        <a href="dashboard.html">🏠 الرئيسية</a>
        <a href="profile.html" class="active">👤 حسابي</a>
        <a href="settings.html">⚙️ الإعدادات</a>
    </nav>
</div>
<div class="main">
    <div class="topbar"><h2>👤 الملف الشخصي</h2><a href="dashboard.html" class="btn">رجوع</a></div>
    <div class="content" id="profileContent">⏳ جاري التحميل...</div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDT0xGqGHzyyeB4qcz5AGMKxESCGZNNEWE",
        authDomain: "abdullah-khalil.firebaseapp.com",
        projectId: "abdullah-khalil",
        storageBucket: "abdullah-khalil.firebasestorage.app",
        messagingSenderId: "530661483867",
        appId: "1:530661483867:web:e2f165e9f808bcfcb8267e"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const studentId = localStorage.getItem('studentId');
    if (!studentId) window.location.href = 'login.html';

    async function loadProfile() {
        const container = document.getElementById('profileContent');
        try {
            const doc = await db.collection('students').doc(studentId).get();
            if (!doc.exists || doc.data().status !== 'مفعل') { window.location.href='login.html'; return; }
            const user = doc.data();
            const avatarUrl = localStorage.getItem('studentAvatar') || user.avatar || '';

            container.innerHTML = `
                <div class="card avatar-section">
                    <img class="avatar-preview" src="${avatarUrl || ''}" alt="الصورة" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="avatar-preview" style="display:${avatarUrl ? 'none' : 'flex'};">👤</div>
                    <div>
                        <h3>${user.name || 'طالب'}</h3>
                        <p style="color:var(--text-muted);">${user.grade || ''}</p>
                        <button class="upload-btn" onclick="uploadAvatar()">📷 تغيير الصورة</button>
                        <div class="message" id="uploadMsg"></div>
                    </div>
                </div>
            `;
        } catch(e) {
            container.innerHTML = '<p>❌ خطأ في تحميل البيانات</p>';
        }
    }
    loadProfile();

    window.uploadAvatar = function() {
        const msgEl = document.getElementById('uploadMsg');
        msgEl.className = 'message';
        msgEl.style.display = 'block';
        msgEl.textContent = '⏳ جاري فتح نافذة الرفع...';
        msgEl.classList.add('success');

        window.cloudinary.openUploadWidget({
            cloudName: "deaevfmvm",
            uploadPreset: "ml_default",
            apiKey: "864215656447737",
            sources: ['local', 'camera'],
            multiple: false,
            resourceType: 'image',
            clientAllowedFormats: ['png', 'jpg', 'jpeg'],
            maxFileSize: 5000000,
            language: 'ar'
        }, async (error, result) => {
            if (error) {
                msgEl.className = 'message error';
                msgEl.textContent = '❌ فشل الرفع: ' + (error.message || 'خطأ غير معروف');
                return;
            }
            if (result && result.event === 'success') {
                const url = result.info.secure_url;
                msgEl.className = 'message success';
                msgEl.textContent = '✅ تم رفع الصورة بنجاح! جاري الحفظ...';

                try {
                    // تحديث Firestore
                    await db.collection('students').doc(studentId).update({ avatar: url });
                    // تحديث localStorage
                    localStorage.setItem('studentAvatar', url);
                    msgEl.textContent = '✅ تم حفظ الصورة بنجاح! سيتم التحديث الآن.';
                    setTimeout(() => loadProfile(), 800);
                } catch (e) {
                    msgEl.className = 'message error';
                    msgEl.textContent = '❌ تم الرفع ولكن فشل الحفظ في قاعدة البيانات: ' + e.message;
                }
            }
        });
    };
</script>
</body>
</html>
