<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | مستر عبدالله خليل</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-deep: #020012;
            --glass-bg: rgba(255,255,255,0.03);
            --glass-border: rgba(255,255,255,0.06);
            --text-primary: #f0f0f7;
            --text-muted: #6e6e90;
            --accent-gradient: linear-gradient(135deg, #4da8da, #7c5ce7, #22d3bb);
            --radius-lg: 20px;
            --font: 'Cairo', sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:var(--font); background:var(--bg-deep); color:var(--text-primary); display:flex; min-height:100vh; }
        .sidebar { width:260px; background:rgba(8,8,28,0.75); backdrop-filter:blur(35px); border-left:1px solid var(--glass-border); padding:24px 14px; flex-shrink:0; z-index:50; overflow-y:auto; }
        .sidebar .logo { display:flex; align-items:center; gap:10px; padding:8px 12px; margin-bottom:20px; text-decoration:none; }
        .sidebar .logo-icon { width:42px; height:42px; border-radius:14px; background:var(--accent-gradient); display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; }
        .sidebar nav a { display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:24px; color:var(--text-muted); text-decoration:none; font-weight:500; font-size:0.88rem; }
        .sidebar nav a:hover, .sidebar nav a.active { background:rgba(255,255,255,0.05); color:#fff; }
        .main { flex:1; overflow-y:auto; max-height:100vh; }
        .topbar { padding:14px 24px; display:flex; justify-content:space-between; align-items:center; background:rgba(6,6,26,0.7); backdrop-filter:blur(25px); border-bottom:1px solid var(--glass-border); position:sticky; top:0; z-index:20; }
        .btn { padding:8px 16px; border-radius:24px; font-weight:600; font-size:0.8rem; border:1.5px solid var(--glass-border); background:transparent; color:var(--text-primary); cursor:pointer; text-decoration:none; }
        .content { padding:24px; display:grid; gap:20px; }
        .card { background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--radius-lg); padding:20px; backdrop-filter:blur(15px); }
        .stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
        @media (max-width:768px) { .sidebar { position:fixed; right:-280px; top:0; bottom:0; z-index:55; } .sidebar.open { right:0; } .stats-grid { grid-template-columns:repeat(2,1fr); } }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="sidebar" id="sidebar">
    <a href="index.html" class="logo"><div class="logo-icon">ع</div><span>لوحة التحكم</span></a>
    <nav>
        <a class="active" href="dashboard.html">🏠 الرئيسية</a>
        <a href="courses.html">📚 كورساتي</a>
        <a href="exams.html">📝 الامتحانات</a>
        <a href="results.html">📊 نتائجي</a>
        <a href="profile.html">👤 حسابي</a>
        <a href="settings.html">⚙️ الإعدادات</a>
    </nav>
</div>
<div class="main">
    <div class="topbar">
        <h2 style="background:var(--accent-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">📊 لوحة التحكم</h2>
        <div><a href="index.html" class="btn btn-sm">الموقع</a> <button class="btn btn-sm" onclick="logout()">تسجيل الخروج</button></div>
    </div>
    <div class="content" id="dashboardContent">⏳ جاري تحميل بياناتك...</div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDT0xGqGHzyyeB4qcz5AGMKxESCGZNNEWE",
        authDomain: "abdullah-khalil.firebaseapp.com",
        projectId: "abdullah-khalil",
        storageBucket: "abdullah-khalil.firebasestorage.app",
        messagingSenderId: "530661483867",
        appId: "1:530661483867:web:e2f165e9f808bcfcb8267e"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const studentId = localStorage.getItem('studentId');
    if (!studentId) window.location.href = 'login.html';

    (async function load() {
        const container = document.getElementById('dashboardContent');
        try {
            const userDoc = await db.collection('students').doc(studentId).get();
            if (!userDoc.exists || userDoc.data().status !== 'مفعل') {
                localStorage.clear(); window.location.href='login.html'; return;
            }
            const user = userDoc.data();
            const grade = user.grade || '';

            // جلب البيانات
            const [coursesSnap, lessonsSnap, examSnap, assignSnap] = await Promise.all([
                db.collection('courses').where('grade','==',grade).get().catch(() => ({ size: 0 })),
                db.collection('lessons').get().catch(() => ({ size: 0 })),
                db.collection('examResults').where('studentId','==',studentId).get().catch(() => ({ size: 0 })),
                db.collection('assignmentSubmissions').where('studentId','==',studentId).get().catch(() => ({ size: 0 }))
            ]);

            const courses = []; coursesSnap.forEach?.(d => courses.push({id:d.id, ...d.data()}));

            container.innerHTML = `
                <div class="card" style="display:flex; align-items:center; gap:18px;">
                    <div style="width:64px;height:64px;border-radius:50%;background:var(--accent-gradient);display:flex;align-items:center;justify-content:center;font-size:2rem;color:#fff;">👤</div>
                    <div><h3>مرحباً، ${user.name || 'طالب'} 👋</h3><p style="color:var(--text-muted);">الصف: ${grade} | مفعل</p></div>
                </div>
                <div class="stats-grid">
                    <div class="card stat-card"><div class="icon">📚</div><div class="value">${courses.length}</div><div class="label">كورس</div></div>
                    <div class="card stat-card"><div class="icon">🎬</div><div class="value">${lessonsSnap.size}</div><div class="label">محاضرة</div></div>
                    <div class="card stat-card"><div class="icon">📝</div><div class="value">${examSnap.size}</div><div class="label">امتحان</div></div>
                    <div class="card stat-card"><div class="icon">📋</div><div class="value">${assignSnap.size}</div><div class="label">واجب</div></div>
                </div>
                <h3>📖 كورساتي</h3>
                <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px;">
                    ${courses.length ? courses.map(c => `<a href="course.html?id=${c.id}" class="card" style="text-decoration:none;color:inherit;"><h4>${c.name}</h4><p style="color:var(--text-muted);">${c.grade||''} | ${c.type||'مجاني'}</p></a>`).join('') : '<div style="text-align:center;padding:40px;">لا كورسات بعد</div>'}
                </div>
            `;
        } catch (e) {
            console.error(e);
            container.innerHTML = '<div style="text-align:center;padding:60px;">❌ خطأ: تأكد من نشر قواعد Firestore الجديدة (السماح بالقراءة للجميع).</div>';
        }
    })();

    window.logout = () => { localStorage.clear(); window.location.href = 'login.html'; };
</script>
</body>
</html>
