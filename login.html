<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | مستر عبدالله خليل</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-deep: #03030f; --glass-bg: rgba(255,255,255,0.035); --glass-border: rgba(255,255,255,0.07);
            --text-primary: #f0f0f7; --text-secondary: #b8b8d4; --text-muted: #6e6e90;
            --accent-1: #4da8da; --accent-2: #7c5ce7; --accent-3: #22d3bb;
            --gradient-1: linear-gradient(135deg, #4da8da, #7c5ce7, #22d3bb);
            --gradient-2: linear-gradient(135deg, #7c5ce7, #f472b6, #fbbf24);
            --shadow-glow: 0 0 80px rgba(124,92,231,0.25); --radius-xl: 32px; --radius-lg: 24px;
            --font-ar: 'Cairo', sans-serif; --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:var(--font-ar); background:var(--bg-deep); color:var(--text-primary); display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
        .aurora-bg { position:fixed; inset:0; pointer-events:none; z-index:0; }
        .aurora-bg .orb { position:absolute; border-radius:50%; filter:blur(140px); opacity:0.2; animation:auroraFloat 22s infinite; }
        .aurora-bg .orb:nth-child(1){ width:700px; height:700px; background:radial-gradient(circle,#4da8da,transparent 70%); top:-250px; left:-200px; }
        .aurora-bg .orb:nth-child(2){ width:550px; height:550px; background:radial-gradient(circle,#7c5ce7,transparent 70%); bottom:-200px; right:-200px; animation-delay:-10s; }
        @keyframes auroraFloat { 0%,100%{transform:translate(0,0) scale(1);} 25%{transform:translate(70px,-50px) scale(1.12);} 50%{transform:translate(-40px,60px) scale(0.88);} 75%{transform:translate(-60px,-35px) scale(1.06);} }
        .container { position:relative; z-index:10; width:100%; max-width:500px; animation:cardEnter 0.7s cubic-bezier(0.34,1.56,0.64,1); }
        @keyframes cardEnter { from{opacity:0;transform:translateY(40px) scale(0.92);} to{opacity:1;transform:translateY(0) scale(1);} }
        .card { background:var(--glass-bg); backdrop-filter:blur(35px); border:1px solid var(--glass-border); border-radius:var(--radius-xl); padding:36px 28px; box-shadow:0 25px 70px rgba(0,0,0,0.6),var(--shadow-glow); }
        .logo-icon {
            width:60px; height:60px; border-radius:16px; background:var(--gradient-1);
            display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.6rem;
            color:#fff; margin:0 auto 16px; box-shadow:0 0 35px rgba(124,92,231,0.5);
            animation:logoPulse 3s infinite; overflow:hidden;
        }
        /* ✅ تعديل حجم صورة اللوجو */
        .logo-icon img {
            width:100%; height:100%; object-fit:cover; border-radius:inherit;
        }
        @keyframes logoPulse { 0%,100%{box-shadow:0 0 35px rgba(124,92,231,0.5);} 50%{box-shadow:0 0 55px rgba(124,92,231,0.8),0 0 80px rgba(77,168,218,0.3);} }
        .platform-name { text-align:center; font-size:1.4rem; font-weight:700; margin-bottom:4px; }
        .tabs { display:flex; gap:8px; margin-bottom:28px; }
        .tab-btn { flex:1; padding:10px; border-radius:30px; font-weight:600; font-size:0.9rem; border:1.5px solid var(--glass-border); background:transparent; color:var(--text-secondary); cursor:pointer; transition:var(--transition); text-align:center; }
        .tab-btn.active { background:var(--gradient-1); border-color:transparent; color:#fff; }
        .form-panel { display:none; animation:fadeSlide 0.4s ease; }
        .form-panel.active { display:block; }
        @keyframes fadeSlide { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
        .form-group { margin-bottom:18px; }
        .form-group label { display:block; font-size:0.85rem; margin-bottom:6px; color:var(--text-secondary); }
        .form-group input, .form-group select { width:100%; padding:13px 16px; border-radius:30px; border:1.5px solid var(--glass-border); background:rgba(255,255,255,0.04); color:#fff; font-family:var(--font-ar); font-size:0.9rem; outline:none; transition:0.25s; }
        .phone-wrapper { display:flex; gap:8px; }
        .phone-wrapper select { width:90px; padding:13px 8px; border-radius:30px; border:1.5px solid var(--glass-border); background:rgba(255,255,255,0.04); color:#fff; font-family:var(--font-ar); font-size:0.9rem; outline:none; text-align:center; }
        .phone-wrapper input { flex:1; }
        .form-group input:focus, .form-group select:focus { border-color:var(--accent-2); box-shadow:0 0 0 4px rgba(124,92,231,0.15); }
        .btn-submit { width:100%; padding:15px; border-radius:30px; font-weight:700; font-size:1rem; border:none; cursor:pointer; background:var(--gradient-1); color:#fff; transition:var(--transition); box-shadow:0 8px 28px rgba(124,92,231,0.4); margin-top:8px; }
        .btn-submit:hover { transform:translateY(-2px); box-shadow:0 14px 40px rgba(124,92,231,0.6); }
        .btn-submit:disabled { opacity:0.6; cursor:not-allowed; }
        .message { padding:12px 16px; border-radius:30px; font-size:0.85rem; text-align:center; margin-bottom:16px; display:none; }
        .error-message { background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.35); color:#fca5a5; }
        .success-message { background:rgba(34,211,187,0.12); border:1px solid rgba(34,211,187,0.35); color:#5eeadb; }
        .links { text-align:center; margin-top:16px; font-size:0.85rem; }
        .links a { color:var(--accent-1); text-decoration:none; font-weight:500; }
        .links a:hover { color:#fff; }
        .spinner { display:inline-block; width:20px; height:20px; border:3px solid rgba(255,255,255,0.25); border-top-color:#fff; border-radius:50%; animation:spin 0.7s infinite linear; vertical-align:middle; margin-left:6px; }
        @keyframes spin { to{transform:rotate(360deg);} }
        @media (max-width:480px) { .card { padding:30px 20px; border-radius:var(--radius-lg); } }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="aurora-bg"><div class="orb"></div><div class="orb"></div></div>

<div class="container">
    <div class="card">
        <div class="logo-icon" id="loginLogo">ع</div>
        <div class="platform-name" id="platformNameDisplay">مستر عبدالله خليل</div>
        <div class="tabs">
            <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">تسجيل الدخول</button>
            <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">إنشاء حساب</button>
        </div>

        <div class="error-message message" id="errorMsg"></div>
        <div class="success-message message" id="successMsg"></div>

        <!-- نموذج تسجيل الدخول -->
        <div class="form-panel active" id="loginPanel">
            <form id="loginForm" autocomplete="off">
                <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="loginEmail" placeholder="example@email.com" required></div>
                <div class="form-group"><label>كلمة المرور</label><input type="password" id="loginPassword" placeholder="••••••••" required></div>
                <button type="submit" class="btn-submit" id="loginBtn">تسجيل الدخول</button>
            </form>
            <div class="links" style="margin-top:12px;"><a href="#" onclick="showForgotPassword()">نسيت كلمة المرور؟</a></div>
        </div>

        <!-- استعادة كلمة المرور -->
        <div class="form-panel" id="forgotPanel">
            <h3 style="text-align:center;margin-bottom:16px;">استعادة كلمة المرور</h3>
            <form id="forgotForm"><div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="forgotEmail" required></div><button type="submit" class="btn-submit">إرسال رابط الاستعادة</button></form>
            <div class="links"><a href="#" onclick="switchTab('login')">العودة لتسجيل الدخول</a></div>
        </div>

        <!-- نموذج إنشاء حساب -->
        <div class="form-panel" id="registerPanel">
            <form id="registerForm" autocomplete="off">
                <div class="form-group"><label>الاسم بالكامل</label><input type="text" id="regName" placeholder="أدخل اسمك الكامل" required></div>
                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <div class="phone-wrapper">
                        <select id="regPhoneCode"><option value="+20" selected>+20</option></select>
                        <input type="tel" id="regPhone" placeholder="01234567890" required maxlength="11" inputmode="numeric" pattern="01[0-9]{9}">
                    </div>
                </div>
                <div class="form-group">
                    <label>رقم ولي الأمر</label>
                    <div class="phone-wrapper">
                        <select id="regParentPhoneCode"><option value="+20" selected>+20</option></select>
                        <input type="tel" id="regParentPhone" placeholder="01234567890" required maxlength="11" inputmode="numeric" pattern="01[0-9]{9}">
                    </div>
                </div>
                <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="regEmail" placeholder="example@email.com" required></div>
                <div class="form-group"><label>كلمة المرور</label><input type="password" id="regPassword" placeholder="••••••••" required minlength="6"></div>
                <div class="form-group"><label>الصف الدراسي</label>
                    <select id="regGrade" required>
                        <option value="">اختر الصف</option>
                        <option>الأول الإعدادي</option><option>الثاني الإعدادي</option><option>الثالث الإعدادي</option>
                        <option>الأول الثانوي</option><option>الثاني الثانوي</option><option>الثالث الثانوي</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit" id="registerBtn">إنشاء الحساب</button>
            </form>
        </div>
    </div>
</div>

<script>
    (function() {
        const firebaseConfig = {
            apiKey: "AIzaSyDT0xGqGHzyyeB4qcz5AGMKxESCGZNNEWE",
            authDomain: "abdullah-khalil.firebaseapp.com",
            projectId: "abdullah-khalil",
            storageBucket: "abdullah-khalil.firebasestorage.app",
            messagingSenderId: "530661483867",
            appId: "1:530661483867:web:e2f165e9f808bcfcb8267e"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        (async function loadPlatformSettings() {
            const doc = await db.collection('settings').doc('platform').get().catch(() => null);
            if (doc && doc.exists) {
                const data = doc.data();
                if (data.logo) {
                    const logoEl = document.getElementById('loginLogo');
                    logoEl.innerHTML = `<img src="${data.logo}" alt="لوجو" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">`;
                    logoEl.style.background = 'none';
                }
                if (data.name) { document.getElementById('platformNameDisplay').textContent = data.name; document.title = `تسجيل الدخول | ${data.name}`; }
            }
        })();

        window.switchTab = function(tab) {
            document.getElementById('loginPanel').classList.remove('active');
            document.getElementById('registerPanel').classList.remove('active');
            document.getElementById('forgotPanel').classList.remove('active');
            document.getElementById('tabLogin').classList.remove('active');
            document.getElementById('tabRegister').classList.remove('active');
            document.getElementById('errorMsg').style.display='none';
            document.getElementById('successMsg').style.display='none';
            if(tab==='login') { document.getElementById('loginPanel').classList.add('active'); document.getElementById('tabLogin').classList.add('active'); }
            else { document.getElementById('registerPanel').classList.add('active'); document.getElementById('tabRegister').classList.add('active'); }
        };
        window.showForgotPassword = function() {
            document.getElementById('loginPanel').classList.remove('active');
            document.getElementById('registerPanel').classList.remove('active');
            document.getElementById('forgotPanel').classList.add('active');
            document.getElementById('tabLogin').classList.add('active');
            document.getElementById('tabRegister').classList.remove('active');
        };

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim(), password = document.getElementById('loginPassword').value;
            const errorMsg = document.getElementById('errorMsg'), successMsg = document.getElementById('successMsg');
            errorMsg.style.display='none'; successMsg.style.display='none';
            if(!email||!password){errorMsg.textContent='يرجى إدخال البريد وكلمة المرور';errorMsg.style.display='block';return;}
            const btn = document.getElementById('loginBtn'); btn.disabled=true; btn.innerHTML='<span class="spinner"></span> جاري الدخول...';
            try {
                const userCred = await auth.signInWithEmailAndPassword(email, password);
                const doc = await db.collection('students').doc(userCred.user.uid).get();
                if(!doc.exists || doc.data().status !== 'مفعل') { await auth.signOut(); errorMsg.textContent='الحساب غير مفعل';errorMsg.style.display='block';btn.disabled=false;btn.textContent='تسجيل الدخول';return; }
                localStorage.setItem('studentId', userCred.user.uid);
                localStorage.setItem('studentName', doc.data().name||'طالب');
                localStorage.setItem('studentGrade', doc.data().grade||'');
                successMsg.textContent='تم الدخول!'; successMsg.style.display='block';
                setTimeout(() => window.location.href = 'dashboard.html', 1000);
            } catch(err) {
                errorMsg.textContent = err.code==='auth/user-not-found'?'البريد غير مسجل':err.code==='auth/wrong-password'?'كلمة مرور خاطئة':'خطأ';
                errorMsg.style.display='block'; btn.disabled=false; btn.textContent='تسجيل الدخول';
            }
        });

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('forgotEmail').value.trim();
            const errorMsg = document.getElementById('errorMsg'), successMsg = document.getElementById('successMsg');
            errorMsg.style.display='none'; successMsg.style.display='none';
            if(!email){errorMsg.textContent='أدخل البريد';errorMsg.style.display='block';return;}
            const btn = document.querySelector('#forgotForm .btn-submit'); btn.disabled=true; btn.innerHTML='<span class="spinner"></span>...';
            try { await auth.sendPasswordResetEmail(email); successMsg.textContent='تم الإرسال'; successMsg.style.display='block'; btn.textContent='تم الإرسال'; }
            catch(err) { errorMsg.textContent = err.code==='auth/user-not-found'?'البريد غير مسجل':'خطأ'; errorMsg.style.display='block'; btn.disabled=false; btn.textContent='إرسال'; }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const phoneCode = document.getElementById('regPhoneCode').value;
            const phone = document.getElementById('regPhone').value.trim();
            const parentPhoneCode = document.getElementById('regParentPhoneCode').value;
            const parentPhone = document.getElementById('regParentPhone').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const grade = document.getElementById('regGrade').value;
            const errorMsg = document.getElementById('errorMsg'), successMsg = document.getElementById('successMsg');
            errorMsg.style.display='none'; successMsg.style.display='none';

            const phoneRegex = /^01[0-9]{9}$/;
            if(!phoneRegex.test(phone)) { errorMsg.textContent='رقم الهاتف غير صحيح (يجب أن يبدأ بـ 01 ويتكون من 11 رقم)'; errorMsg.style.display='block'; return; }
            if(!phoneRegex.test(parentPhone)) { errorMsg.textContent='رقم ولي الأمر غير صحيح'; errorMsg.style.display='block'; return; }
            if(!name || !email || !password || !grade) { errorMsg.textContent='يرجى ملء جميع الحقول'; errorMsg.style.display='block'; return; }

            const fullPhone = phoneCode + phone;
            const fullParentPhone = parentPhoneCode + parentPhone;
            const btn = document.getElementById('registerBtn'); btn.disabled=true; btn.innerHTML='<span class="spinner"></span> جاري إنشاء الحساب...';
            try {
                const userCred = await auth.createUserWithEmailAndPassword(email, password);
                await db.collection('students').doc(userCred.user.uid).set({
                    name, phone: fullPhone, parentPhone: fullParentPhone, email, grade,
                    status: 'قيد المراجعة', createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                await auth.signOut();
                successMsg.textContent = 'تم إنشاء الحساب! انتظر التفعيل.';
                successMsg.style.display='block';
                btn.textContent = 'تم التسجيل';
                setTimeout(() => switchTab('login'), 2500);
            } catch(err) {
                errorMsg.textContent = err.code==='auth/email-already-in-use'?'البريد مستخدم بالفعل':err.code==='auth/weak-password'?'كلمة مرور ضعيفة':'خطأ';
                errorMsg.style.display='block'; btn.disabled=false; btn.textContent='إنشاء الحساب';
            }
        });
    })();
</script>
</body>
</html>
