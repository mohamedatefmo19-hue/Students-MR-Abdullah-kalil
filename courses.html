<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الكورسات | مستر عبدالله خليل</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-deep: #020012;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-hover: rgba(255, 255, 255, 0.05);
            --text-primary: #f0f0f7;
            --text-secondary: #b8b8d4;
            --text-muted: #6e6e90;
            --accent-gradient: linear-gradient(135deg, #4da8da, #7c5ce7, #22d3bb);
            --accent-1: #4da8da;
            --accent-2: #7c5ce7;
            --accent-3: #22d3bb;
            --shadow-glow: 0 0 80px rgba(124, 92, 231, 0.25);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --font: 'Cairo', sans-serif;
            --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { font-size:16px; }
        body {
            font-family:var(--font);
            background:var(--bg-deep);
            color:var(--text-primary);
            display:flex;
            min-height:100vh;
            overflow-x:hidden;
        }
        .aurora { position:fixed; inset:0; pointer-events:none; z-index:0; }
        .aurora .orb { position:absolute; border-radius:50%; filter:blur(140px); opacity:0.13; animation:float 22s infinite ease-in-out; }
        .aurora .orb:nth-child(1){ width:700px; height:700px; background:#4da8da; top:-250px; left:-200px; }
        .aurora .orb:nth-child(2){ width:550px; height:550px; background:#7c5ce7; bottom:-200px; right:-180px; animation-delay:-10s; }
        @keyframes float { 0%,100%{transform:translate(0,0) scale(1);} 33%{transform:translate(50px,-40px) scale(1.1);} 66%{transform:translate(-40px,50px) scale(0.9);} }
        .sidebar {
            width:260px; background:rgba(8,8,28,0.75); backdrop-filter:blur(35px);
            border-left:1px solid var(--glass-border); padding:24px 14px; display:flex; flex-direction:column;
            gap:4px; flex-shrink:0; z-index:50; transition:transform 0.4s; overflow-y:auto;
        }
        .sidebar .logo { display:flex; align-items:center; gap:10px; padding:8px 12px; margin-bottom:20px; text-decoration:none; }
        .sidebar .logo-icon { width:42px; height:42px; border-radius:var(--radius-md); background:var(--accent-gradient); display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; box-shadow:var(--shadow-glow); }
        .sidebar nav { display:flex; flex-direction:column; gap:2px; flex:1; }
        .sidebar nav a {
            display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:24px;
            color:var(--text-secondary); text-decoration:none; font-weight:500; font-size:0.88rem; transition:var(--transition); cursor:pointer;
        }
        .sidebar nav a:hover, .sidebar nav a.active { background:rgba(255,255,255,0.05); color:#fff; }
        .sidebar nav a.active { background:rgba(124,92,231,0.12); }
        .main { flex:1; display:flex; flex-direction:column; overflow-y:auto; max-height:100vh; position:relative; z-index:5; }
        .topbar {
            padding:14px 24px; display:flex; justify-content:space-between; align-items:center;
            background:rgba(6,6,26,0.7); backdrop-filter:blur(25px); border-bottom:1px solid var(--glass-border);
            position:sticky; top:0; z-index:20;
        }
        .topbar h2 { font-size:1.2rem; font-weight:700; background:var(--accent-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .btn { padding:8px 16px; border-radius:24px; font-weight:600; font-size:0.8rem; border:1.5px solid var(--glass-border); background:transparent; color:var(--text-primary); cursor:pointer; text-decoration:none; transition:var(--transition); }
        .btn-primary { background:var(--accent-gradient); border:none; color:#fff; }
        .content { padding:24px; flex:1; display:flex; flex-direction:column; gap:20px; }
        .card { background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--radius-lg); padding:20px; backdrop-filter:blur(15px); }
        .filter-bar { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
        .filter-bar select { padding:10px 16px; border-radius:24px; border:1.5px solid var(--glass-border); background:rgba(255,255,255,0.04); color:#fff; font-family:var(--font); font-size:0.9rem; outline:none; }
        .courses-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:16px; }
        .course-card { text-decoration:none; color:inherit; }
        .course-card:hover { background:var(--glass-hover); transform:translateY(-3px); box-shadow:0 15px 30px rgba(0,0,0,0.3); }
        .course-card .banner { height:120px; border-radius:var(--radius-md); background:var(--accent-gradient); display:flex; align-items:center; justify-content:center; font-size:2.5rem; position:relative; overflow:hidden; margin-bottom:12px; }
        .course-card .banner img { width:100%; height:100%; object-fit:cover; position:absolute; }
        .course-card .info h4 { font-size:1.1rem; font-weight:700; }
        .course-card .info p { font-size:0.85rem; color:var(--text-secondary); }
        .course-meta { display:flex; gap:14px; margin-top:8px; font-size:0.78rem; color:var(--text-muted); }
        .badge { padding:4px 10px; border-radius:14px; font-size:0.7rem; font-weight:600; background:rgba(0,0,0,0.5); color:#fff; }
        .empty-state { text-align:center; padding:40px; color:var(--text-muted); }
        .menu-toggle { display:none; background:none; border:none; color:#fff; font-size:1.6rem; cursor:pointer; }
        .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:40; }
        @media (max-width:768px) {
            .sidebar { position:fixed; right:-280px; top:0; bottom:0; z-index:55; }
            .sidebar.open { right:0; }
            .overlay.show { display:block; }
            .menu-toggle { display:block; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="aurora"><div class="orb"></div><div class="orb"></div></div>
<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">
    <a href="index.html" class="logo">
        <div class="logo-icon">ع</div>
        <span style="font-weight:700;color:#fff;">لوحة التحكم<small style="display:block;font-size:0.65rem;color:var(--text-muted);">مستر عبدالله خليل</small></span>
    </a>
    <nav>
        <a href="dashboard.html">🏠 الرئيسية</a>
        <a href="courses.html" class="active">📚 كورساتي</a>
        <a href="books.html">📖 الكتب</a>
        <a href="exams.html">📝 الامتحانات</a>
        <a href="results.html">📊 نتائجي</a>
        <a href="notifications.html">🔔 الإشعارات</a>
        <a href="subscriptions.html">💎 الاشتراك</a>
        <a href="payment.html">💳 الدفع</a>
        <a href="profile.html">👤 حسابي</a>
        <a href="settings.html">⚙️ الإعدادات</a>
    </nav>
</aside>

<div class="main">
    <div class="topbar">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <h2>📚 الكورسات</h2>
        <div>
            <a href="index.html" class="btn btn-sm">الموقع</a>
            <button class="btn btn-sm" onclick="logout()">تسجيل الخروج</button>
        </div>
    </div>
    <div class="content" id="coursesContent">
        <div class="empty-state">⏳ جاري تحميل الكورسات...</div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDT0xGqGHzyyeB4qcz5AGMKxESCGZNNEWE",
        authDomain: "abdullah-khalil.firebaseapp.com",
        projectId: "abdullah-khalil",
        storageBucket: "abdullah-khalil.firebasestorage.app",
        messagingSenderId: "530661483867",
        appId: "1:530661483867:web:e2f165e9f808bcfcb8267e"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const studentId = localStorage.getItem('studentId');
    if (!studentId) { window.location.href = 'login.html'; }

    let allCourses = [];
    let currentGrade = '';

    async function init() {
        const container = document.getElementById('coursesContent');
        try {
            const userDoc = await db.collection('students').doc(studentId).get();
            if (!userDoc.exists || userDoc.data().status !== 'مفعل') {
                localStorage.clear(); window.location.href='login.html'; return;
            }
            const user = userDoc.data();
            currentGrade = user.grade || '';

            // جلب جميع الكورسات
            const snap = await db.collection('courses').get();
            allCourses = [];
            snap.forEach(doc => allCourses.push({ id: doc.id, ...doc.data() }));

            renderPage();
        } catch(e) {
            console.error(e);
            container.innerHTML = '<div class="empty-state">❌ حدث خطأ في تحميل البيانات. تأكد من قواعد Firestore.</div>';
        }
    }

    function renderPage(filterGrade = currentGrade) {
        const container = document.getElementById('coursesContent');
        const filtered = filterGrade ? allCourses.filter(c => c.grade === filterGrade) : allCourses;

        container.innerHTML = `
            <div class="filter-bar">
                <label style="color:var(--text-secondary);">الصف الدراسي:</label>
                <select id="gradeFilter" onchange="filterCourses()">
                    <option value="">جميع الصفوف</option>
                    <option value="الأول الثانوي" ${filterGrade === 'الأول الثانوي' ? 'selected' : ''}>الأول الثانوي</option>
                    <option value="الثاني الثانوي" ${filterGrade === 'الثاني الثانوي' ? 'selected' : ''}>الثاني الثانوي</option>
                    <option value="الثالث الثانوي" ${filterGrade === 'الثالث الثانوي' ? 'selected' : ''}>الثالث الثانوي</option>
                </select>
            </div>
            <div class="courses-grid">
                ${filtered.length ? filtered.map(c => `
                    <a href="course.html?id=${c.id}" class="card course-card">
                        <div class="banner">
                            ${c.banner ? `<img src="${c.banner}" alt="${c.name}">` : '📚'}
                            <span class="badge" style="position:absolute; top:8px; left:8px;">${c.type || 'مجاني'}</span>
                        </div>
                        <div class="info">
                            <h4>${c.name}</h4>
                            <p>${c.grade || ''}</p>
                            <div class="course-meta">
                                <span>🎬 ${c.lessonsCount || 0} محاضرة</span>
                                <span>📝 ${c.examsCount || 0} امتحان</span>
                                <span>📄 ${c.pdfsCount || 0} PDF</span>
                            </div>
                        </div>
                    </a>
                `).join('') : '<div class="empty-state">لا توجد كورسات متاحة لهذا الصف</div>'}
            </div>
        `;
    }

    window.filterCourses = function() {
        const grade = document.getElementById('gradeFilter').value;
        renderPage(grade);
    };

    window.logout = () => { localStorage.clear(); window.location.href = 'login.html'; };

    // Mobile sidebar toggle
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    document.getElementById('menuToggle').addEventListener('click', () => {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
    });
    overlay.addEventListener('click', () => {
        sidebar.classList.remove('open');
        overlay.classList.remove('show');
    });
    document.querySelectorAll('.sidebar nav a').forEach(link => {
        link.addEventListener('click', () => {
            if (window.innerWidth <= 768) {
                sidebar.classList.remove('open');
                overlay.classList.remove('show');
            }
        });
    });

    init();
</script>
</body>
</html>
