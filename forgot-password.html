<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة كلمة المرور | مستر عبدالله خليل</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <style>
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #0f0f28;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.07);
            --text-primary: #f0f0f5;
            --text-secondary: #b0b0c8;
            --text-muted: #70708a;
            --accent-gradient: linear-gradient(135deg, #4da8da 0%, #7c5ce7 50%, #22d3bb 100%);
            --shadow-glow: 0 0 40px rgba(124, 92, 231, 0.3), 0 0 80px rgba(77, 168, 218, 0.15);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --font-ar: 'Cairo', 'Tajawal', sans-serif;
            --transition-smooth: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }
        body {
            font-family: var(--font-ar);
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }
        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .aurora-bg .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.25;
            animation: auroraFloat 20s infinite ease-in-out;
        }
        .aurora-bg .orb:nth-child(1) {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #4da8da 0%, transparent 70%);
            top: -200px;
            left: -150px;
        }
        .aurora-bg .orb:nth-child(2) {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #7c5ce7 0%, transparent 70%);
            bottom: -150px;
            right: -150px;
            animation-delay: -7s;
        }
        @keyframes auroraFloat {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(60px, -40px) scale(1.1);
            }
            50% {
                transform: translate(-30px, 50px) scale(0.9);
            }
            75% {
                transform: translate(-50px, -30px) scale(1.05);
            }
        }
        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .floating-shapes .shape {
            position: absolute;
            opacity: 0.06;
            animation: floatShape 15s infinite ease-in-out;
        }
        .floating-shapes .hex {
            width: 80px;
            height: 46px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
        }
        @keyframes floatShape {
            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }
            33% {
                transform: translateY(-40px) rotate(5deg);
            }
            66% {
                transform: translateY(20px) rotate(-3deg);
            }
        }
        .mouse-glow {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(124, 92, 231, 0.12) 0%, transparent 60%);
            transform: translate(-50%, -50%);
            transition: opacity 0.3s;
            opacity: 0;
        }
        body:hover .mouse-glow {
            opacity: 1;
        }
        .forgot-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 440px;
            margin: 20px;
        }
        .forgot-card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), var(--shadow-glow);
            animation: cardEnter 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes cardEnter {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .forgot-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .forgot-header .logo-icon {
            width: 56px;
            height: 56px;
            border-radius: var(--radius-md);
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.6rem;
            color: #fff;
            margin: 0 auto 16px;
            box-shadow: 0 0 30px rgba(124, 92, 231, 0.5);
        }
        .forgot-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .forgot-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }
        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 30px;
            border: 1.5px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-family: var(--font-ar);
            font-size: 0.95rem;
            transition: 0.25s;
            outline: none;
        }
        .form-group input:focus {
            border-color: #7c5ce7;
            box-shadow: 0 0 0 4px rgba(124, 92, 231, 0.15);
            background: rgba(255, 255, 255, 0.06);
        }
        .btn-reset {
            width: 100%;
            padding: 14px;
            border-radius: 30px;
            font-family: var(--font-ar);
            font-weight: 700;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            background: var(--accent-gradient);
            color: #fff;
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 28px rgba(124, 92, 231, 0.4);
        }
        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 40px rgba(124, 92, 231, 0.6);
        }
        .btn-reset:active {
            transform: scale(0.97);
        }
        .error-message,
        .success-message {
            padding: 12px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 16px;
            display: none;
        }
        .error-message {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #f87171;
        }
        .success-message {
            background: rgba(34, 211, 187, 0.15);
            border: 1px solid rgba(34, 211, 187, 0.4);
            color: #22d3bb;
        }
        .links {
            text-align: center;
            margin-top: 18px;
            font-size: 0.85rem;
        }
        .links a {
            color: var(--accent-1);
            text-decoration: none;
            font-weight: 500;
        }
        .links a:hover {
            text-decoration: underline;
        }
        .btn-ripple {
            position: relative;
            overflow: hidden;
        }
        .ripple-effect {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0);
            animation: ripple 0.6s ease-out;
            pointer-events: none;
        }
        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
        @media (max-width: 480px) {
            .forgot-card {
                padding: 30px 20px;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="aurora-bg">
        <div class="orb"></div>
        <div class="orb"></div>
    </div>
    <div class="floating-shapes">
        <div class="shape hex" style="top:10%;left:8%;"></div>
        <div class="shape hex" style="bottom:20%;right:10%;width:60px;height:34px;"></div>
    </div>
    <div class="mouse-glow" id="mouseGlow"></div>

    <div class="forgot-container">
        <div class="forgot-card">
            <div class="forgot-header">
                <div class="logo-icon">ع</div>
                <h1>استعادة كلمة المرور</h1>
                <p>أدخل بريدك الإلكتروني وسنرسل لك رابطاً لإعادة تعيين كلمة المرور</p>
            </div>
            <div class="error-message" id="errorMsg"></div>
            <div class="success-message" id="successMsg"></div>
            <form id="forgotForm">
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="email" placeholder="example@email.com" required>
                </div>
                <button type="submit" class="btn-reset btn-ripple" id="resetBtn">إرسال رابط الاستعادة</button>
            </form>
            <div class="links">
                تذكرت كلمة المرور؟ <a href="login.html">تسجيل الدخول</a>
            </div>
            <div class="links">
                <a href="index.html">← العودة للرئيسية</a>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const firebaseConfig = {
                apiKey: "AIzaSyDT0xGqGHzyyeB4qcz5AGMKxESCGZNNEWE",
                authDomain: "abdullah-khalil.firebaseapp.com",
                projectId: "abdullah-khalil",
                storageBucket: "abdullah-khalil.firebasestorage.app",
                messagingSenderId: "530661483867",
                appId: "1:530661483867:web:e2f165e9f808bcfcb8267e"
            };
            firebase.initializeApp(firebaseConfig);
            const auth = firebase.auth();

            // Mouse Glow
            const mouseGlow = document.getElementById('mouseGlow');
            document.addEventListener('mousemove', (e) => {
                mouseGlow.style.left = e.clientX + 'px';
                mouseGlow.style.top = e.clientY + 'px';
            });
            document.addEventListener('mouseleave', () => mouseGlow.style.opacity = '0');
            document.addEventListener('mouseenter', () => mouseGlow.style.opacity = '1');

            // Ripple
            document.querySelectorAll('.btn-ripple').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const ripple = document.createElement('span');
                    ripple.className = 'ripple-effect';
                    const rect = this.getBoundingClientRect();
                    const size = Math.max(rect.width, rect.height);
                    ripple.style.width = ripple.style.height = size + 'px';
                    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
                    ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
                    this.appendChild(ripple);
                    ripple.addEventListener('animationend', () => ripple.remove());
                });
            });

            // Forgot Password Form
            const forgotForm = document.getElementById('forgotForm');
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            const resetBtn = document.getElementById('resetBtn');

            forgotForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorMsg.style.display = 'none';
                successMsg.style.display = 'none';

                const email = document.getElementById('email').value.trim();
                if (!email) {
                    errorMsg.textContent = 'يرجى إدخال البريد الإلكتروني';
                    errorMsg.style.display = 'block';
                    return;
                }

                resetBtn.disabled = true;
                resetBtn.innerHTML = '<span style="display:inline-block;width:20px;height:20px;border:3px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s infinite linear;"></span> جاري الإرسال...';

                try {
                    await auth.sendPasswordResetEmail(email);
                    successMsg.textContent = 'تم إرسال رابط استعادة كلمة المرور إلى بريدك الإلكتروني. يرجى التحقق من صندوق الوارد.';
                    successMsg.style.display = 'block';
                    resetBtn.disabled = true;
                    resetBtn.textContent = 'تم الإرسال';
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 3000);
                } catch (error) {
                    console.error(error);
                    let message = 'حدث خطأ أثناء إرسال رابط الاستعادة';
                    if (error.code === 'auth/user-not-found') message = 'البريد الإلكتروني غير مسجل';
                    else if (error.code === 'auth/invalid-email') message = 'صيغة البريد غير صحيحة';
                    errorMsg.textContent = message;
                    errorMsg.style.display = 'block';
                    resetBtn.disabled = false;
                    resetBtn.textContent = 'إرسال رابط الاستعادة';
                }
            });
        })();
    </script>
</body>
</html>
