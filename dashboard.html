<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | مستر عبدالله خليل</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-deep: #020012;
            --bg-primary: #06061a;
            --glass: rgba(255, 255, 255, 0.025);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-hover: rgba(255, 255, 255, 0.05);
            --text-primary: #f0f0f8;
            --text-secondary: #b8b8d0;
            --text-muted: #6e6e8a;
            --accent-gradient: linear-gradient(135deg, #4da8da 0%, #7c5ce7 50%, #22d3bb 100%);
            --glow: 0 0 60px rgba(124, 92, 231, 0.25);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --font: 'Cairo', sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { font-size:16px; }
        body {
            font-family:var(--font);
            background:var(--bg-deep);
            color:var(--text-primary);
            display:flex;
            min-height:100vh;
            overflow-x:hidden;
        }
        .aurora { position:fixed; inset:0; pointer-events:none; z-index:0; }
        .aurora .orb { position:absolute; border-radius:50%; filter:blur(140px); opacity:0.13; animation:float 22s infinite ease-in-out; }
        .aurora .orb:nth-child(1){ width:700px; height:700px; background:#4da8da; top:-250px; left:-200px; }
        .aurora .orb:nth-child(2){ width:550px; height:550px; background:#7c5ce7; bottom:-200px; right:-180px; animation-delay:-10s; }
        @keyframes float { 0%,100%{transform:translate(0,0) scale(1);} 33%{transform:translate(50px,-40px) scale(1.1);} 66%{transform:translate(-40px,50px) scale(0.9);} }
        .sidebar {
            width:260px; background:rgba(8,8,28,0.75); backdrop-filter:blur(35px);
            border-left:1px solid var(--glass-border); padding:24px 14px; display:flex; flex-direction:column; gap:4px;
            flex-shrink:0; z-index:50; transition:transform 0.4s; overflow-y:auto;
        }
        .sidebar .logo { display:flex; align-items:center; gap:10px; padding:8px 12px; margin-bottom:20px; text-decoration:none; }
        .sidebar .logo-icon { width:42px; height:42px; border-radius:var(--radius-md); background:var(--accent-gradient); display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; box-shadow:var(--glow); }
        .sidebar .logo-text { font-weight:700; color:#fff; font-size:0.95rem; }
        .sidebar .logo-text small { display:block; font-size:0.65rem; color:var(--text-muted); font-weight:400; }
        .sidebar nav { display:flex; flex-direction:column; gap:2px; flex:1; }
        .sidebar nav a {
            display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:24px; color:var(--text-secondary);
            text-decoration:none; font-weight:500; font-size:0.88rem; transition:0.3s; cursor:pointer;
        }
        .sidebar nav a:hover, .sidebar nav a.active { background:rgba(255,255,255,0.05); color:#fff; }
        .sidebar nav a.active { background:rgba(124,92,231,0.12); }
        .main { flex:1; display:flex; flex-direction:column; overflow-y:auto; max-height:100vh; position:relative; z-index:5; }
        .topbar {
            padding:14px 24px; display:flex; justify-content:space-between; align-items:center;
            background:rgba(6,6,26,0.7); backdrop-filter:blur(25px); border-bottom:1px solid var(--glass-border);
            position:sticky; top:0; z-index:20;
        }
        .topbar h2 { font-size:1.2rem; font-weight:700; background:var(--accent-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .btn { padding:8px 16px; border-radius:24px; font-family:var(--font); font-weight:600; font-size:0.8rem; border:none; cursor:pointer; transition:0.3s; display:inline-flex; align-items:center; gap:6px; background:transparent; color:var(--text-primary); border:1.5px solid var(--glass-border); text-decoration:none; }
        .btn-primary { background:var(--accent-gradient); border:none; color:#fff; box-shadow:0 6px 20px rgba(124,92,231,0.3); }
        .btn-sm { padding:5px 10px; font-size:0.7rem; }
        .content { padding:24px; flex:1; }
        .welcome-card {
            background:var(--glass); border:1px solid var(--glass-border); border-radius:var(--radius-lg);
            padding:24px 28px; backdrop-filter:blur(20px); display:flex; align-items:center; gap:20px;
            margin-bottom:24px; flex-wrap:wrap;
        }
        .avatar-ring { width:70px; height:70px; border-radius:50%; padding:3px; background:var(--accent-gradient); flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:2rem; }
        .avatar-ring img { width:100%; height:100%; border-radius:50%; object-fit:cover; }
        .welcome-info h3 { font-size:1.3rem; font-weight:700; }
        .welcome-info p { color:var(--text-muted); font-size:0.85rem; }
        .status-active { background:rgba(34,211,187,0.15); color:#22d3bb; padding:3px 10px; border-radius:14px; font-size:0.68rem; }
        .stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px; }
        .stat-card {
            background:var(--glass); border:1px solid var(--glass-border); border-radius:var(--radius-lg);
            padding:18px 16px; backdrop-filter:blur(15px); text-align:center;
        }
        .stat-card .icon { font-size:1.6rem; margin-bottom:6px; }
        .stat-card .value { font-size:1.8rem; font-weight:800; background:var(--accent-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .stat-card .label { font-size:0.72rem; color:var(--text-muted); }
        .section-title { font-size:1.15rem; font-weight:700; margin-bottom:14px; }
        .courses-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:14px; margin-bottom:24px; }
        .course-card {
            background:var(--glass); border:1px solid var(--glass-border); border-radius:var(--radius-lg);
            overflow:hidden; backdrop-filter:blur(15px); transition:0.3s; text-decoration:none; color:inherit; display:block;
        }
        .course-card:hover { background:var(--glass-hover); transform:translateY(-4px); box-shadow:0 12px 30px rgba(0,0,0,0.4); }
        .course-card .banner { height:110px; background:var(--accent-gradient); display:flex; align-items:center; justify-content:center; font-size:2.5rem; }
        .course-card .banner img { width:100%; height:100%; object-fit:cover; }
        .course-card .info { padding:16px; }
        .course-card .info h4 { font-size:0.95rem; font-weight:700; }
        .course-card .info .meta { font-size:0.75rem; color:var(--text-muted); }
        .progress-bar { height:5px; background:rgba(255,255,255,0.08); border-radius:8px; margin-top:6px; }
        .progress-fill { height:100%; border-radius:8px; background:var(--accent-gradient); width:0%; }
        .empty-state { text-align:center; padding:40px; color:var(--text-muted); }
        .menu-toggle { display:none; background:none; border:none; color:#fff; font-size:1.6rem; cursor:pointer; }
        .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:40; }
        @media (max-width:768px) {
            .sidebar { position:fixed; right:-280px; top:0; bottom:0; z-index:55; }
            .sidebar.open { right:0; }
            .overlay.show { display:block; }
            .menu-toggle { display:block; }
            .stats-row { grid-template-columns:repeat(2,1fr); }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="aurora"><div class="orb"></div><div class="orb"></div></div>
<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">
    <a href="index.html" class="logo">
        <div class="logo-icon" id="sideLogo">ع</div>
        <span class="logo-text">لوحة التحكم<small>مستر عبدالله خليل</small></span>
    </a>
    <nav>
        <a class="active" href="dashboard.html">🏠 الرئيسية</a>
        <a href="courses.html">📚 كورساتي</a>
        <a href="books.html">📖 الكتب</a>
        <a href="exams.html">📝 الامتحانات</a>
        <a href="results.html">📊 نتائجي</a>
        <a href="notifications.html">🔔 الإشعارات</a>
        <a href="subscriptions.html">💎 الاشتراكات</a>
        <a href="payment.html">💳 الدفع</a>
        <a href="profile.html">👤 حسابي</a>
        <a href="settings.html">⚙️ الإعدادات</a>
    </nav>
</aside>

<div class="main">
    <div class="topbar">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <h2>📊 لوحة التحكم</h2>
        <div style="display:flex; gap:8px;">
            <a href="index.html" class="btn btn-sm">الموقع</a>
            <button class="btn btn-sm" onclick="logout()">تسجيل الخروج</button>
        </div>
    </div>
    <div class="content" id="dashboardContent">
        <div class="empty-state">⏳ جاري تحميل بياناتك...</div>
    </div>
</div>

<script>
(function() {
    const firebaseConfig = {
        apiKey: "AIzaSyDT0xGqGHzyyeB4qcz5AGMKxESCGZNNEWE",
        authDomain: "abdullah-khalil.firebaseapp.com",
        projectId: "abdullah-khalil",
        storageBucket: "abdullah-khalil.firebasestorage.app",
        messagingSenderId: "530661483867",
        appId: "1:530661483867:web:e2f165e9f808bcfcb8267e"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // بدلاً من auth، نقرأ معرف الطالب من localStorage
    const currentUserId = localStorage.getItem('studentId');
    if (!currentUserId) {
        window.location.href = 'login.html';
        return;
    }

    loadDashboard(currentUserId);

    async function loadDashboard(userId) {
        const container = document.getElementById('dashboardContent');
        try {
            const userDoc = await db.collection('students').doc(userId).get();
            if (!userDoc.exists || userDoc.data().status !== 'مفعل') {
                localStorage.removeItem('studentId');
                localStorage.removeItem('studentName');
                window.location.href = 'login.html';
                return;
            }
            const userData = userDoc.data();
            const grade = userData.grade || '';

            let courses = [];
            let coursesCount = 0;
            try {
                const coursesSnap = await db.collection('courses').where('grade', '==', grade).get();
                coursesSnap.forEach(d => courses.push({ id: d.id, ...d.data() }));
                coursesCount = coursesSnap.size;
            } catch (e) { console.warn('تعذر جلب الكورسات:', e); }

            let lessonsCount = 0;
            try {
                const lessonsSnap = await db.collection('lessons').get();
                lessonsCount = lessonsSnap.size;
            } catch (e) { console.warn('تعذر جلب المحاضرات:', e); }

            let examResultsCount = 0;
            try {
                const examSnap = await db.collection('examResults').where('studentId', '==', userId).get();
                examResultsCount = examSnap.size;
            } catch (e) { console.warn('تعذر جلب نتائج الامتحانات:', e); }

            let assignmentCount = 0;
            try {
                const assignSnap = await db.collection('assignmentSubmissions').where('studentId', '==', userId).get();
                assignmentCount = assignSnap.size;
            } catch (e) { console.warn('تعذر جلب الواجبات:', e); }

            let activityItems = '';
            try {
                const activitySnap = await db.collection('activity').where('userId', '==', userId).orderBy('createdAt','desc').limit(5).get();
                activityItems = activitySnap.docs.map(doc => {
                    const data = doc.data();
                    return `<div class="activity-item"><span>${data.event || 'نشاط'}</span><span style="color:var(--text-muted);">${data.createdAt ? new Date(data.createdAt.seconds*1000).toLocaleString('ar-EG') : '—'}</span></div>`;
                }).join('');
            } catch (e) {
                activityItems = `<div class="activity-item"><span>🔍 أنت الآن في لوحة التحكم</span><span>الآن</span></div>`;
            }

            const avatarHtml = userData.avatar ? `<img src="${userData.avatar}" alt="avatar">` : '👤';

            container.innerHTML = `
                <div class="welcome-card">
                    <div class="avatar-ring">${avatarHtml}</div>
                    <div class="welcome-info">
                        <h3>مرحباً، ${userData.name || 'طالب'} 👋</h3>
                        <p>الصف: ${grade || 'غير محدد'} | <span class="status-active">مفعل</span></p>
                    </div>
                </div>
                <div class="stats-row">
                    <div class="stat-card"><div class="icon">📚</div><div class="value">${coursesCount}</div><div class="label">كورس مسجل</div></div>
                    <div class="stat-card"><div class="icon">🎬</div><div class="value">${lessonsCount}</div><div class="label">محاضرة متاحة</div></div>
                    <div class="stat-card"><div class="icon">📝</div><div class="value">${examResultsCount}</div><div class="label">امتحان محلول</div></div>
                    <div class="stat-card"><div class="icon">📋</div><div class="value">${assignmentCount}</div><div class="label">واجب مسلّم</div></div>
                </div>
                <div class="section-title">📖 كورساتي</div>
                <div class="courses-grid">
                    ${courses.length === 0 ? '<div class="empty-state">لا توجد كورسات لصفك حالياً</div>' : courses.map(c => `
                        <a href="course.html?id=${c.id}" class="course-card">
                            <div class="banner">${c.banner ? `<img src="${c.banner}" alt="${c.name}">` : '📚'}</div>
                            <div class="info">
                                <h4>${c.name}</h4>
                                <div class="meta">${c.grade || ''} | ${c.type || 'مجاني'}</div>
                                <div class="progress-bar"><div class="progress-fill" style="width:${Math.floor(Math.random()*60)+20}%"></div></div>
                            </div>
                        </a>
                    `).join('')}
                </div>
                <div class="section-title">📋 آخر النشاطات</div>
                <div class="activity-list" style="background:var(--glass); border:1px solid var(--glass-border); border-radius:var(--radius-lg); padding:14px 18px;">
                    ${activityItems}
                </div>
            `;
        } catch (e) {
            console.error(e);
            container.innerHTML = '<div class="empty-state">❌ حدث خطأ أثناء تحميل البيانات</div>';
        }
    }

    // Mobile sidebar
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    document.getElementById('menuToggle').addEventListener('click', () => {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
    });
    overlay.addEventListener('click', () => {
        sidebar.classList.remove('open');
        overlay.classList.remove('show');
    });
    document.querySelectorAll('.sidebar nav a').forEach(link => {
        link.addEventListener('click', () => {
            sidebar.classList.remove('open');
            overlay.classList.remove('show');
        });
    });

    window.logout = function() {
        localStorage.removeItem('studentId');
        localStorage.removeItem('studentName');
        window.location.href = 'login.html';
    };
})();
</script>
</body>
</html>
