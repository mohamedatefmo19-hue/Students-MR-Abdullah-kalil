<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الكورس | مستر عبدالله خليل</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #0f0f28;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.07);
            --text-primary: #f0f0f5;
            --text-secondary: #b0b0c8;
            --text-muted: #70708a;
            --accent-gradient: linear-gradient(135deg, #4da8da 0%, #7c5ce7 50%, #22d3bb 100%);
            --shadow-glow: 0 0 40px rgba(124, 92, 231, 0.3);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --font-ar: 'Cairo', 'Tajawal', sans-serif;
            --transition-smooth: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; font-size: 16px; }
        body {
            font-family: var(--font-ar);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 70px;
        }
        .aurora-bg {
            position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:hidden;
        }
        .aurora-bg .orb {
            position: absolute; border-radius:50%; filter:blur(120px); opacity:0.22; animation:auroraFloat 20s infinite ease-in-out;
        }
        .aurora-bg .orb:nth-child(1) { width:600px; height:600px; background:radial-gradient(circle, #4da8da 0%, transparent 70%); top:-200px; left:-150px; }
        .aurora-bg .orb:nth-child(2) { width:500px; height:500px; background:radial-gradient(circle, #7c5ce7 0%, transparent 70%); bottom:-150px; right:-150px; animation-delay:-7s; }
        @keyframes auroraFloat {
            0%,100% { transform:translate(0,0) scale(1); }
            25% { transform:translate(60px,-40px) scale(1.1); }
            50% { transform:translate(-30px,50px) scale(0.9); }
            75% { transform:translate(-50px,-30px) scale(1.05); }
        }
        .floating-shapes { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
        .floating-shapes .shape { position:absolute; opacity:0.05; animation:floatShape 15s infinite ease-in-out; }
        .floating-shapes .hex { width:80px; height:46px; border:2px solid rgba(255,255,255,0.3); clip-path:polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); }
        @keyframes floatShape { 0%,100%{transform:translateY(0) rotate(0deg);} 33%{transform:translateY(-40px) rotate(5deg);} 66%{transform:translateY(20px) rotate(-3deg);} }
        .main-content { position:relative; z-index:1; }
        .navbar {
            position:sticky; top:0; z-index:1000; background:rgba(10,10,26,0.8); backdrop-filter:blur(30px);
            border-bottom:1px solid var(--glass-border); padding:0 24px;
        }
        .navbar-inner { max-width:1200px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; height:64px; gap:16px; }
        .navbar-logo { display:flex; align-items:center; gap:10px; text-decoration:none; }
        .navbar-logo .logo-icon { width:40px; height:40px; border-radius:var(--radius-sm); background:var(--accent-gradient); display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; }
        .btn { padding:8px 18px; border-radius:30px; font-family:var(--font-ar); font-weight:600; font-size:0.85rem; border:none; cursor:pointer; transition:var(--transition-smooth); background:transparent; color:var(--text-primary); border:1.5px solid var(--glass-border); text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
        .btn-primary { background:var(--accent-gradient); border:none; color:#fff; }
        .course-content { padding:24px; max-width:1000px; margin:0 auto; }
        .course-banner { width:100%; height:250px; border-radius:var(--radius-lg); background:var(--accent-gradient); display:flex; align-items:center; justify-content:center; font-size:4rem; margin-bottom:24px; object-fit:cover; }
        .course-header { margin-bottom:24px; }
        .course-header h2 { font-size:2rem; font-weight:700; }
        .course-meta { display:flex; gap:16px; flex-wrap:wrap; margin:8px 0; color:var(--text-secondary); }
        .badge { padding:4px 12px; border-radius:20px; font-size:0.75rem; font-weight:600; }
        .badge-success { background:rgba(34,211,187,0.2); color:#22d3bb; }
        .badge-warning { background:rgba(251,191,36,0.2); color:#fbbf24; }
        .progress-section { margin-bottom:24px; }
        .progress-bar { height:8px; background:rgba(255,255,255,0.1); border-radius:10px; overflow:hidden; }
        .progress-fill { height:100%; background:var(--accent-gradient); border-radius:10px; width:0%; transition: width 0.5s; }
        .lessons-list { display:flex; flex-direction:column; gap:12px; }
        .lesson-item { background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--radius-md); padding:16px; backdrop-filter:blur(10px); display:flex; justify-content:space-between; align-items:center; transition:var(--transition-smooth); }
        .lesson-item:hover { background:var(--glass-hover); }
        .lesson-info { display:flex; align-items:center; gap:12px; }
        .lesson-info .lesson-icon { font-size:1.5rem; }
        .empty-state { text-align:center; padding:60px 20px; color:var(--text-muted); }
        .bottom-nav { display:none; position:fixed; bottom:0; left:0; width:100%; background:rgba(15,15,40,0.9); backdrop-filter:blur(25px); border-top:1px solid var(--glass-border); z-index:1000; padding:8px 16px 12px; justify-content:space-around; align-items:center; }
        .bottom-nav a { display:flex; flex-direction:column; align-items:center; gap:4px; text-decoration:none; color:var(--text-muted); font-size:0.7rem; }
        .bottom-nav a.active, .bottom-nav a:hover { color:var(--accent-1); }
        @media (max-width:768px) { .bottom-nav { display:flex; } .course-banner { height:180px; } }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="aurora-bg"><div class="orb"></div><div class="orb"></div></div>
<div class="floating-shapes"><div class="shape hex" style="top:10%;left:8%;"></div></div>
<div class="main-content">
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="index.html" class="navbar-logo"><div class="logo-icon">ع</div><span>مستر عبدالله خليل</span></a>
            <div style="display:flex; gap:12px;">
                <a href="courses.html" class="btn btn-sm">كل الكورسات</a>
                <a href="dashboard.html" class="btn btn-sm">لوحة التحكم</a>
            </div>
        </div>
    </nav>
    <div class="course-content" id="courseContent">
        <!-- سيتم ملؤها ديناميكياً -->
        <div style="text-align:center; padding:60px;">⏳ جاري تحميل الكورس...</div>
    </div>
</div>
<nav class="bottom-nav">
    <a href="dashboard.html"><span>🏠</span><span>الرئيسية</span></a>
    <a href="courses.html" class="active"><span>📚</span><span>كورساتي</span></a>
    <a href="exams.html"><span>📝</span><span>الامتحانات</span></a>
    <a href="profile.html"><span>👤</span><span>حسابي</span></a>
</nav>

<script>
    (function() {
        const firebaseConfig = {
            apiKey: "AIzaSyDT0xGqGHzyyeB4qcz5AGMKxESCGZNNEWE",
            authDomain: "abdullah-khalil.firebaseapp.com",
            projectId: "abdullah-khalil",
            storageBucket: "abdullah-khalil.firebasestorage.app",
            messagingSenderId: "530661483867",
            appId: "1:530661483867:web:e2f165e9f808bcfcb8267e"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const courseId = urlParams.get('id');

        if (!courseId) {
            document.getElementById('courseContent').innerHTML = '<div class="empty-state">⚠️ لم يتم تحديد كورس</div>';
        } else {
            loadCourse(courseId);
        }

        async function loadCourse(id) {
            try {
                const courseDoc = await db.collection('courses').doc(id).get();
                if (!courseDoc.exists) {
                    document.getElementById('courseContent').innerHTML = '<div class="empty-state">❌ الكورس غير موجود</div>';
                    return;
                }
                const course = courseDoc.data();
                const lessonsSnap = await db.collection('lessons').where('courseId', '==', id).orderBy('order').get();
                const lessons = [];
                lessonsSnap.forEach(doc => lessons.push({ id: doc.id, ...doc.data() }));

                renderCourse(course, lessons);
            } catch (e) {
                console.error(e);
                document.getElementById('courseContent').innerHTML = '<div class="empty-state">❌ حدث خطأ</div>';
            }
        }

        function renderCourse(course, lessons) {
            const progress = lessons.length > 0 ? Math.floor(Math.random() * 60) + 10 : 0; // محاكاة للتقدم
            const isLocked = course.locked === true;
            const isPaid = course.type === 'مدفوع';

            const html = `
                <img class="course-banner" src="${course.banner || ''}" alt="${course.name}" onerror="this.style.display='none';">
                <div class="course-header">
                    <h2>${course.name}</h2>
                    <div class="course-meta">
                        <span>📚 ${course.grade || ''}</span>
                        <span>🎬 ${lessons.length} محاضرة</span>
                        <span class="badge ${isPaid ? 'badge-warning' : 'badge-success'}">${course.type || 'مجاني'}</span>
                        ${isLocked ? '<span class="badge badge-warning">🔒 مقفل</span>' : ''}
                    </div>
                    <p style="color:var(--text-secondary); margin-top:8px;">${course.description || 'لا يوجد وصف'}</p>
                </div>
                <div class="progress-section">
                    <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
                        <span>نسبة التقدم</span><span>${progress}%</span>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
                </div>
                <h3 style="margin-bottom:16px;">📖 المحاضرات</h3>
                <div class="lessons-list">
                    ${lessons.length === 0 ? '<div class="empty-state">لا توجد محاضرات بعد</div>' : lessons.map((l, i) => `
                        <div class="lesson-item">
                            <div class="lesson-info">
                                <span class="lesson-icon">${l.video ? '🎬' : '📄'}</span>
                                <div>
                                    <strong>${i+1}. ${l.title}</strong>
                                    <div style="font-size:0.8rem; color:var(--text-muted);">
                                        ${l.video ? '🎥 فيديو' : ''} ${l.pdf ? '📎 PDF' : ''} ${l.live ? '🔴 بث مباشر' : ''}
                                    </div>
                                </div>
                            </div>
                            <a href="lesson.html?id=${l.id}" class="btn btn-sm">مشاهدة</a>
                        </div>
                    `).join('')}
                </div>
                ${isLocked ? '<div style="text-align:center; margin-top:24px;"><button class="btn btn-primary" onclick="alert(\'الكورس مقفل حالياً\')">🔒 الكورس مقفل</button></div>' : ''}
                ${isPaid && !isLocked ? '<div style="text-align:center; margin-top:24px;"><button class="btn btn-primary" onclick="alert(\'يرجى الاشتراك للوصول\')">💰 اشترك الآن</button></div>' : ''}
            `;
            document.getElementById('courseContent').innerHTML = html;
        }
    })();
</script>
</body>
</html>
