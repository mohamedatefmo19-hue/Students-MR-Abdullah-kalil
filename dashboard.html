<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | مستر عبدالله خليل</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-deep: #020012;
            --bg-primary: #06061a;
            --bg-secondary: #0c0c24;
            --glass: rgba(255, 255, 255, 0.025);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-hover: rgba(255, 255, 255, 0.05);
            --text-primary: #f0f0f8;
            --text-secondary: #b8b8d0;
            --text-muted: #6e6e8a;
            --accent-1: #4da8da;
            --accent-2: #7c5ce7;
            --accent-3: #22d3bb;
            --accent-4: #f472b6;
            --accent-gradient: linear-gradient(135deg, #4da8da 0%, #7c5ce7 50%, #22d3bb 100%);
            --glow: 0 0 60px rgba(124, 92, 231, 0.25);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 26px;
            --font: 'Cairo', sans-serif;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --bounce: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { font-size:16px; scroll-behavior:smooth; }
        body {
            font-family:var(--font);
            background:var(--bg-deep);
            color:var(--text-primary);
            display:flex;
            min-height:100vh;
            overflow-x:hidden;
            -webkit-font-smoothing:antialiased;
            position:relative;
        }
        .aurora { position:fixed; inset:0; pointer-events:none; z-index:0; }
        .aurora .orb { position:absolute; border-radius:50%; filter:blur(140px); opacity:0.13; animation:float 22s infinite ease-in-out; }
        .aurora .orb:nth-child(1){ width:700px; height:700px; background:#4da8da; top:-250px; left:-200px; }
        .aurora .orb:nth-child(2){ width:550px; height:550px; background:#7c5ce7; bottom:-200px; right:-180px; animation-delay:-10s; }
        @keyframes float { 0%,100%{transform:translate(0,0) scale(1);} 33%{transform:translate(50px,-40px) scale(1.1);} 66%{transform:translate(-40px,50px) scale(0.9);} }
        /* Sidebar */
        .sidebar {
            width:260px; background:rgba(8,8,28,0.75); backdrop-filter:blur(35px); -webkit-backdrop-filter:blur(35px);
            border-left:1px solid var(--glass-border); padding:24px 14px; display:flex; flex-direction:column; gap:4px;
            flex-shrink:0; z-index:50; transition:transform 0.4s; position:relative; overflow-y:auto;
        }
        .sidebar .logo { display:flex; align-items:center; gap:10px; padding:8px 12px; margin-bottom:20px; text-decoration:none; }
        .sidebar .logo-icon { width:42px; height:42px; border-radius:var(--radius-md); background:var(--accent-gradient); display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; box-shadow:var(--glow); }
        .sidebar .logo-text { font-weight:700; color:#fff; font-size:0.95rem; }
        .sidebar .logo-text small { display:block; font-size:0.65rem; color:var(--text-muted); font-weight:400; }
        .sidebar nav { display:flex; flex-direction:column; gap:2px; flex:1; }
        .sidebar nav a {
            display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:24px; color:var(--text-secondary);
            text-decoration:none; font-weight:500; font-size:0.88rem; transition:var(--transition); cursor:pointer;
        }
        .sidebar nav a:hover, .sidebar nav a.active { background:rgba(255,255,255,0.05); color:#fff; }
        .sidebar nav a.active { background:rgba(124,92,231,0.12); }
        /* Main */
        .main { flex:1; display:flex; flex-direction:column; overflow-y:auto; max-height:100vh; position:relative; z-index:5; }
        .topbar {
            padding:14px 24px; display:flex; justify-content:space-between; align-items:center;
            background:rgba(6,6,26,0.7); backdrop-filter:blur(25px); border-bottom:1px solid var(--glass-border);
            position:sticky; top:0; z-index:20; gap:16px;
        }
        .topbar h2 { font-size:1.2rem; font-weight:700; background:var(--accent-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .btn { padding:8px 16px; border-radius:24px; font-family:var(--font); font-weight:600; font-size:0.8rem; border:none; cursor:pointer; transition:var(--transition); display:inline-flex; align-items:center; gap:6px; background:transparent; color:var(--text-primary); border:1.5px solid var(--glass-border); text-decoration:none; white-space:nowrap; }
        .btn-primary { background:var(--accent-gradient); border:none; color:#fff; box-shadow:0 6px 20px rgba(124,92,231,0.3); }
        .btn-primary:hover { box-shadow:0 10px 28px rgba(124,92,231,0.5); transform:translateY(-1px); }
        .btn-sm { padding:5px 10px; font-size:0.7rem; }
        .content { padding:24px; flex:1; }
        /* Welcome Card */
        .welcome-card {
            background:var(--glass); border:1px solid var(--glass-border); border-radius:var(--radius-xl);
            padding:24px 28px; backdrop-filter:blur(20px); display:flex; align-items:center; gap:20px;
            margin-bottom:24px; flex-wrap:wrap; animation:slideUp 0.6s var(--bounce);
        }
        @keyframes slideUp { from{opacity:0;transform:translateY(30px);} to{opacity:1;transform:translateY(0);} }
        .avatar-ring { width:70px; height:70px; border-radius:50%; padding:3px; background:var(--accent-gradient); flex-shrink:0; }
        .avatar-ring img { width:100%; height:100%; border-radius:50%; object-fit:cover; background:#1a1a30; }
        .welcome-info h3 { font-size:1.3rem; font-weight:700; }
        .welcome-info p { color:var(--text-muted); font-size:0.85rem; }
        .status-badge { padding:3px 10px; border-radius:14px; font-size:0.68rem; font-weight:600; display:inline-block; }
        .status-active { background:rgba(34,211,187,0.15); color:#22d3bb; }
        /* Stats */
        .stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px; }
        .stat-card {
            background:var(--glass); border:1px solid var(--glass-border); border-radius:var(--radius-lg);
            padding:18px 16px; backdrop-filter:blur(15px); text-align:center; transition:var(--bounce); cursor:default;
            animation:popIn 0.5s var(--bounce) both;
        }
        .stat-card:nth-child(1){animation-delay:0.05s;} .stat-card:nth-child(2){animation-delay:0.12s;}
        .stat-card:nth-child(3){animation-delay:0.19s;} .stat-card:nth-child(4){animation-delay:0.26s;}
        @keyframes popIn { from{opacity:0;transform:scale(0.9);} to{opacity:1;transform:scale(1);} }
        .stat-card:hover { background:var(--glass-hover); transform:translateY(-4px); box-shadow:0 12px 30px rgba(0,0,0,0.4); }
        .stat-card .icon { font-size:1.6rem; margin-bottom:6px; }
        .stat-card .value { font-size:1.8rem; font-weight:800; background:var(--accent-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .stat-card .label { font-size:0.72rem; color:var(--text-muted); margin-top:2px; }
        /* Sections */
        .section-title { font-size:1.15rem; font-weight:700; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
        .courses-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:14px; margin-bottom:24px; }
        .course-card {
            background:var(--glass); border:1px solid var(--glass-border); border-radius:var(--radius-lg);
            overflow:hidden; backdrop-filter:blur(15px); transition:var(--bounce); cursor:pointer; text-decoration:none; color:inherit; display:block;
        }
        .course-card:hover { background:var(--glass-hover); transform:translateY(-5px); box-shadow:0 18px 40px rgba(0,0,0,0.5); }
        .course-card .banner { height:110px; background:var(--accent-gradient); display:flex; align-items:center; justify-content:center; font-size:2.5rem; position:relative; }
        .course-card .banner img { width:100%; height:100%; object-fit:cover; }
        .course-card .info { padding:16px; }
        .course-card .info h4 { font-size:0.95rem; font-weight:700; }
        .course-card .info .meta { font-size:0.75rem; color:var(--text-muted); margin:4px 0 8px; }
        .progress-bar { height:5px; background:rgba(255,255,255,0.08); border-radius:8px; overflow:hidden; }
        .progress-fill { height:100%; border-radius:8px; background:var(--accent-gradient); transition:width 0.6s; }
        .activity-list { background:var(--glass); border:1px solid var(--glass-border); border-radius:var(--radius-lg); padding:14px 18px; backdrop-filter:blur(15px); }
        .activity-item { display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid rgba(255,255,255,0.03); font-size:0.8rem; }
        .activity-item:last-child { border:none; }
        .empty { text-align:center; padding:30px; color:var(--text-muted); font-size:0.85rem; }
        /* Mobile */
        .menu-toggle { display:none; background:none; border:none; color:#fff; font-size:1.6rem; cursor:pointer; }
        .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:40; }
        @media (max-width:768px) {
            .sidebar { position:fixed; right:-280px; top:0; bottom:0; z-index:55; }
            .sidebar.open { right:0; }
            .overlay.show { display:block; }
            .menu-toggle { display:block; }
            .stats-row { grid-template-columns:repeat(2,1fr); }
            .welcome-card { flex-direction:column; text-align:center; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="aurora"><div class="orb"></div><div class="orb"></div></div>
<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">
    <a href="index.html" class="logo">
        <div class="logo-icon" id="sideLogo">ع</div>
        <span class="logo-text">لوحة التحكم<small>مستر عبدالله خليل</small></span>
    </a>
    <nav>
        <a class="active" href="dashboard.html">🏠 الرئيسية</a>
        <a href="courses.html">📚 كورساتي</a>
        <a href="books.html">📖 الكتب</a>
        <a href="exams.html">📝 الامتحانات</a>
        <a href="results.html">📊 نتائجي</a>
        <a href="assignments.html">📋 الواجبات</a>
        <a href="notifications.html">🔔 الإشعارات</a>
        <a href="subscriptions.html">💎 الاشتراكات</a>
        <a href="payment.html">💳 الدفع</a>
        <a href="profile.html">👤 حسابي</a>
        <a href="settings.html">⚙️ الإعدادات</a>
        <a href="contact.html">📞 تواصل</a>
    </nav>
</aside>

<div class="main">
    <div class="topbar">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <h2>📊 لوحة التحكم</h2>
        <div style="display:flex; gap:8px;">
            <a href="index.html" class="btn btn-sm">الموقع</a>
            <button class="btn btn-sm" onclick="logout()">تسجيل الخروج</button>
        </div>
    </div>
    <div class="content" id="dashboardContent">
        <div class="empty">⏳ جاري تحميل بياناتك...</div>
    </div>
</div>

<script>
(function() {
    const firebaseConfig = {
        apiKey: "AIzaSyDT0xGqGHzyyeB4qcz5AGMKxESCGZNNEWE",
        authDomain: "abdullah-khalil.firebaseapp.com",
        projectId: "abdullah-khalil",
        storageBucket: "abdullah-khalil.firebasestorage.app",
        messagingSenderId: "530661483867",
        appId: "1:530661483867:web:e2f165e9f808bcfcb8267e"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let userData = null;

    auth.onAuthStateChanged(async (user) => {
        if (!user) { window.location.href = 'login.html'; return; }
        currentUser = user;
        const doc = await db.collection('students').doc(user.uid).get();
        if (!doc.exists || doc.data().status !== 'مفعل') {
            await auth.signOut();
            window.location.href = 'login.html';
            return;
        }
        userData = doc.data();
        await loadDashboard();
    });

    async function loadDashboard() {
        const container = document.getElementById('dashboardContent');
        try {
            // Fetch real counts
            const [coursesSnap, lessonsSnap, examResultsSnap, assignmentSnap, activitySnap] = await Promise.all([
                db.collection('courses').where('grade', '==', userData.grade).get(),
                db.collection('lessons').get(),
                db.collection('examResults').where('studentId', '==', currentUser.uid).get(),
                db.collection('assignmentSubmissions').where('studentId', '==', currentUser.uid).get(),
                db.collection('activity').where('userId', '==', currentUser.uid).orderBy('createdAt','desc').limit(8).get()
            ]);

            const coursesCount = coursesSnap.size;
            const lessonsCount = lessonsSnap.size;
            const examsDone = examResultsSnap.size;
            const assignmentsDone = assignmentSnap.size;
            const courses = [];
            coursesSnap.forEach(d => courses.push({ id: d.id, ...d.data() }));
            const activities = [];
            activitySnap.forEach(d => activities.push(d.data()));

            const avatarUrl = userData.avatar || '';
            const avatarHtml = avatarUrl ? `<img src="${avatarUrl}" alt="avatar">` : '👤';

            container.innerHTML = `
                <div class="welcome-card">
                    <div class="avatar-ring">${avatarHtml}</div>
                    <div class="welcome-info">
                        <h3>مرحباً، ${userData.name || 'طالب'} 👋</h3>
                        <p>الصف: ${userData.grade || ''} | <span class="status-badge status-active">مفعل</span></p>
                    </div>
                </div>
                <div class="stats-row">
                    <div class="stat-card"><div class="icon">📚</div><div class="value">${coursesCount}</div><div class="label">كورس مسجل</div></div>
                    <div class="stat-card"><div class="icon">🎬</div><div class="value">${lessonsCount}</div><div class="label">محاضرة متاحة</div></div>
                    <div class="stat-card"><div class="icon">📝</div><div class="value">${examsDone}</div><div class="label">امتحان محلول</div></div>
                    <div class="stat-card"><div class="icon">📋</div><div class="value">${assignmentsDone}</div><div class="label">واجب مسلّم</div></div>
                </div>
                <div class="section-title">📖 كورساتي</div>
                <div class="courses-grid">
                    ${courses.length === 0 ? '<div class="empty">لا توجد كورسات لصفك حالياً</div>' : courses.map(c => `
                        <a href="course.html?id=${c.id}" class="course-card">
                            <div class="banner">${c.banner ? `<img src="${c.banner}" alt="${c.name}">` : '📚'}</div>
                            <div class="info">
                                <h4>${c.name}</h4>
                                <div class="meta">${c.grade} | ${c.type||'مجاني'}</div>
                                <div class="progress-bar"><div class="progress-fill" style="width:${Math.floor(Math.random()*70)+10}%"></div></div>
                            </div>
                        </a>
                    `).join('')}
                </div>
                <div class="section-title">📋 آخر النشاطات</div>
                <div class="activity-list">
                    ${activities.length === 0 ? '<div class="empty">لا توجد نشاطات بعد</div>' : activities.map(a => `
                        <div class="activity-item"><span>${a.event||''}</span><span style="color:var(--text-muted);">${a.createdAt ? new Date(a.createdAt.seconds*1000).toLocaleString('ar-EG') : ''}</span></div>
                    `).join('')}
                </div>
            `;
        } catch (e) {
            console.error(e);
            container.innerHTML = '<div class="empty">❌ حدث خطأ أثناء تحميل البيانات</div>';
        }
    }

    // Sidebar mobile
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    document.getElementById('menuToggle').addEventListener('click', () => {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
    });
    overlay.addEventListener('click', () => {
        sidebar.classList.remove('open');
        overlay.classList.remove('show');
    });
    document.querySelectorAll('.sidebar nav a').forEach(link => {
        link.addEventListener('click', () => {
            sidebar.classList.remove('open');
            overlay.classList.remove('show');
        });
    });

    window.logout = async () => { await auth.signOut(); window.location.href = 'login.html'; };
})();
</script>
</body>
</html>
