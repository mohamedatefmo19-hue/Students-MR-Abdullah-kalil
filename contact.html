<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معنا | مستر عبدالله خليل</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <!-- OneSignal -->
    <script src="https://cdn.onesignal.com/sdks/OneSignalSDK.js" async></script>
    <style>
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #0f0f28;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.07);
            --text-primary: #f0f0f5;
            --text-secondary: #b0b0c8;
            --text-muted: #70708a;
            --accent-gradient: linear-gradient(135deg, #4da8da 0%, #7c5ce7 50%, #22d3bb 100%);
            --shadow-glow: 0 0 40px rgba(124, 92, 231, 0.3);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --font-ar: 'Cairo', 'Tajawal', sans-serif;
            --transition-smooth: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; font-size: 16px; }
        body {
            font-family: var(--font-ar);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 70px;
        }
        .aurora-bg { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:hidden; }
        .aurora-bg .orb { position: absolute; border-radius:50%; filter:blur(120px); opacity:0.22; animation:auroraFloat 20s infinite ease-in-out; }
        .aurora-bg .orb:nth-child(1) { width:600px; height:600px; background:radial-gradient(circle, #4da8da 0%, transparent 70%); top:-200px; left:-150px; }
        .aurora-bg .orb:nth-child(2) { width:500px; height:500px; background:radial-gradient(circle, #7c5ce7 0%, transparent 70%); bottom:-150px; right:-150px; animation-delay:-7s; }
        @keyframes auroraFloat { 0%,100%{transform:translate(0,0) scale(1);} 25%{transform:translate(60px,-40px) scale(1.1);} 50%{transform:translate(-30px,50px) scale(0.9);} 75%{transform:translate(-50px,-30px) scale(1.05);} }
        .floating-shapes { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
        .floating-shapes .shape { position:absolute; opacity:0.05; animation:floatShape 15s infinite ease-in-out; }
        .floating-shapes .hex { width:80px; height:46px; border:2px solid rgba(255,255,255,0.3); clip-path:polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); }
        @keyframes floatShape { 0%,100%{transform:translateY(0) rotate(0deg);} 33%{transform:translateY(-40px) rotate(5deg);} 66%{transform:translateY(20px) rotate(-3deg);} }
        .main-content { position:relative; z-index:1; }
        .navbar { position:sticky; top:0; z-index:1000; background:rgba(10,10,26,0.8); backdrop-filter:blur(30px); border-bottom:1px solid var(--glass-border); padding:0 24px; }
        .navbar-inner { max-width:1200px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; height:64px; gap:16px; }
        .navbar-logo { display:flex; align-items:center; gap:10px; text-decoration:none; }
        .navbar-logo .logo-icon { width:40px; height:40px; border-radius:var(--radius-sm); background:var(--accent-gradient); display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; }
        .btn { padding:8px 18px; border-radius:30px; font-family:var(--font-ar); font-weight:600; font-size:0.85rem; border:none; cursor:pointer; transition:var(--transition-smooth); background:transparent; color:var(--text-primary); border:1.5px solid var(--glass-border); text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
        .btn-primary { background:var(--accent-gradient); border:none; color:#fff; }
        .contact-content { padding:24px; max-width:800px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:24px; }
        .page-header { grid-column:1/-1; margin-bottom:8px; }
        .page-header h2 { font-size:2rem; font-weight:700; }
        .page-header p { color:var(--text-muted); }
        .info-card { background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--radius-lg); padding:28px; backdrop-filter:blur(10px); display:flex; align-items:flex-start; gap:16px; }
        .info-icon { font-size:1.8rem; flex-shrink:0; width:50px; height:50px; border-radius:50%; background:rgba(124,92,231,0.15); display:flex; align-items:center; justify-content:center; }
        .info-text h4 { font-weight:700; margin-bottom:4px; }
        .info-text p { color:var(--text-secondary); font-size:0.9rem; }
        .contact-form { grid-column:1/-1; background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--radius-lg); padding:28px; backdrop-filter:blur(10px); }
        .form-group { margin-bottom:16px; }
        .form-group label { display:block; font-size:0.85rem; margin-bottom:6px; color:var(--text-secondary); }
        .form-group input, .form-group textarea { width:100%; padding:12px 16px; border-radius:30px; border:1.5px solid var(--glass-border); background:rgba(255,255,255,0.04); color:#fff; font-family:var(--font-ar); font-size:0.9rem; outline:none; }
        .form-group textarea { border-radius:18px; min-height:120px; resize:vertical; }
        .form-group input:focus, .form-group textarea:focus { border-color:var(--accent-2); }
        .message-box { padding:12px 16px; border-radius:30px; font-size:0.85rem; text-align:center; margin-bottom:16px; display:none; }
        .error-message { background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.4); color:#f87171; }
        .success-message { background:rgba(34,211,187,0.15); border:1px solid rgba(34,211,187,0.4); color:#22d3bb; }
        .empty-state { text-align:center; padding:60px; color:var(--text-muted); }
        .bottom-nav { display:none; position:fixed; bottom:0; left:0; width:100%; background:rgba(15,15,40,0.9); backdrop-filter:blur(25px); border-top:1px solid var(--glass-border); z-index:1000; padding:8px 16px 12px; justify-content:space-around; align-items:center; }
        .bottom-nav a { display:flex; flex-direction:column; align-items:center; gap:4px; text-decoration:none; color:var(--text-muted); font-size:0.7rem; }
        .bottom-nav a.active, .bottom-nav a:hover { color:var(--accent-1); }
        @media (max-width:768px) { .contact-content { grid-template-columns:1fr; } .bottom-nav { display:flex; } .page-header h2 { font-size:1.6rem; } }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="aurora-bg"><div class="orb"></div><div class="orb"></div></div>
<div class="floating-shapes"><div class="shape hex" style="top:10%;left:8%;"></div></div>
<div class="main-content">
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="index.html" class="navbar-logo"><div class="logo-icon">ع</div><span>مستر عبدالله خليل</span></a>
            <div style="display:flex; gap:12px;">
                <a href="index.html" class="btn btn-sm">الرئيسية</a>
                <a href="courses.html" class="btn btn-sm">الكورسات</a>
            </div>
        </div>
    </nav>
    <div class="contact-content">
        <div class="page-header">
            <h2>📞 تواصل معنا</h2>
            <p>نحن هنا للإجابة على استفساراتكم</p>
        </div>
        <div class="info-card">
            <div class="info-icon">📧</div>
            <div class="info-text"><h4>البريد الإلكتروني</h4><p>info@abdullahkhalil.com</p></div>
        </div>
        <div class="info-card">
            <div class="info-icon">📱</div>
            <div class="info-text"><h4>الهاتف</h4><p>+20 100 000 0000</p></div>
        </div>
        <div class="info-card">
            <div class="info-icon">📍</div>
            <div class="info-text"><h4>العنوان</h4><p>القاهرة، مصر</p></div>
        </div>
        <div class="info-card">
            <div class="info-icon">⏰</div>
            <div class="info-text"><h4>ساعات العمل</h4><p>يومياً: 9 صباحاً - 10 مساءً</p></div>
        </div>
        <div class="contact-form">
            <h3 style="margin-bottom:16px;">✉️ أرسل رسالة</h3>
            <div class="message-box" id="formMessage"></div>
            <div class="form-group"><label>الاسم</label><input type="text" id="contactName" placeholder="أدخل اسمك الكامل"></div>
            <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="contactEmail" placeholder="example@email.com"></div>
            <div class="form-group"><label>الموضوع</label><input type="text" id="contactSubject" placeholder="موضوع الرسالة"></div>
            <div class="form-group"><label>الرسالة</label><textarea id="contactMessage" placeholder="اكتب رسالتك هنا..."></textarea></div>
            <button class="btn btn-primary" onclick="submitContactForm()" style="width:100%; padding:14px;">إرسال الرسالة</button>
        </div>
    </div>
</div>
<nav class="bottom-nav">
    <a href="index.html"><span>🏠</span><span>الرئيسية</span></a>
    <a href="courses.html"><span>📚</span><span>كورساتي</span></a>
    <a href="exams.html"><span>📝</span><span>الامتحانات</span></a>
    <a href="profile.html"><span>👤</span><span>حسابي</span></a>
</nav>

<script>
    (function() {
        const firebaseConfig = {
            apiKey: "AIzaSyDT0xGqGHzyyeB4qcz5AGMKxESCGZNNEWE",
            authDomain: "abdullah-khalil.firebaseapp.com",
            projectId: "abdullah-khalil",
            storageBucket: "abdullah-khalil.firebasestorage.app",
            messagingSenderId: "530661483867",
            appId: "1:530661483867:web:e2f165e9f808bcfcb8267e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const ONESIGNAL_APP_ID = "os_v2_app_mk6n33aj55ditcmb3n5fpo66rsihml7iabcekj5ofx5anzjsjoli2ulxvakacn4srunaazbtwcvmdzed45erspjkmljiagwpfhyyl5a";
        if (ONESIGNAL_APP_ID) {
            window.OneSignal = window.OneSignal || [];
            OneSignal.push(function() { OneSignal.init({ appId: ONESIGNAL_APP_ID }); });
        }

        window.submitContactForm = async function() {
            const name = document.getElementById('contactName').value.trim();
            const email = document.getElementById('contactEmail').value.trim();
            const subject = document.getElementById('contactSubject').value.trim();
            const message = document.getElementById('contactMessage').value.trim();
            const msgBox = document.getElementById('formMessage');
            msgBox.style.display = 'none';

            if (!name || !email || !subject || !message) {
                msgBox.className = 'message-box error-message';
                msgBox.textContent = 'يرجى ملء جميع الحقول';
                msgBox.style.display = 'block';
                return;
            }

            try {
                // حفظ الرسالة في Firestore
                await db.collection('contactMessages').add({
                    name,
                    email,
                    subject,
                    message,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    read: false
                });

                // محاولة إرسال إشعار للإدارة عبر OneSignal
                if (window.OneSignal) {
                    OneSignal.push(function() {
                        OneSignal.sendSelfNotification(
                            "📩 رسالة جديدة من " + name,
                            subject + ": " + message.substring(0, 100),
                            "https://abdullahkhalil.com/admin.html",
                            "",
                            { action: 'open' }
                        );
                    });
                }

                msgBox.className = 'message-box success-message';
                msgBox.textContent = '✅ تم إرسال رسالتك بنجاح. سنتواصل معك قريباً.';
                msgBox.style.display = 'block';
                document.getElementById('contactName').value = '';
                document.getElementById('contactEmail').value = '';
                document.getElementById('contactSubject').value = '';
                document.getElementById('contactMessage').value = '';
            } catch (e) {
                console.error(e);
                msgBox.className = 'message-box error-message';
                msgBox.textContent = '❌ حدث خطأ أثناء إرسال الرسالة. حاول مرة أخرى.';
                msgBox.style.display = 'block';
            }
        };
    })();
</script>
</body>
</html>
