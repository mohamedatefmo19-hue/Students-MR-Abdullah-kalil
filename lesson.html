<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحاضرة | مستر عبدالله خليل</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-deep: #020012;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-hover: rgba(255, 255, 255, 0.05);
            --text-primary: #f0f0f7;
            --text-secondary: #b8b8d4;
            --text-muted: #6e6e90;
            --accent-gradient: linear-gradient(135deg, #4da8da, #7c5ce7, #22d3bb);
            --accent-1: #4da8da;
            --accent-2: #7c5ce7;
            --accent-3: #22d3bb;
            --shadow-glow: 0 0 80px rgba(124, 92, 231, 0.25);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 20px;
            --font: 'Cairo', sans-serif;
            --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { font-size:16px; }
        body {
            font-family:var(--font);
            background:var(--bg-deep);
            color:var(--text-primary);
            display:flex;
            min-height:100vh;
            overflow-x:hidden;
        }
        .aurora { position:fixed; inset:0; pointer-events:none; z-index:0; }
        .aurora .orb { position:absolute; border-radius:50%; filter:blur(140px); opacity:0.13; animation:float 22s infinite ease-in-out; }
        .aurora .orb:nth-child(1){ width:700px; height:700px; background:#4da8da; top:-250px; left:-200px; }
        .aurora .orb:nth-child(2){ width:550px; height:550px; background:#7c5ce7; bottom:-200px; right:-180px; animation-delay:-10s; }
        @keyframes float { 0%,100%{transform:translate(0,0) scale(1);} 33%{transform:translate(50px,-40px) scale(1.1);} 66%{transform:translate(-40px,50px) scale(0.9);} }
        .sidebar { width:260px; background:rgba(8,8,28,0.75); backdrop-filter:blur(35px); border-left:1px solid var(--glass-border); padding:24px 14px; display:flex; flex-direction:column; gap:4px; flex-shrink:0; z-index:50; transition:transform 0.4s; overflow-y:auto; }
        .sidebar .logo { display:flex; align-items:center; gap:10px; padding:8px 12px; margin-bottom:20px; text-decoration:none; }
        .sidebar .logo-icon { width:42px; height:42px; border-radius:var(--radius-md); background:var(--accent-gradient); display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; }
        .sidebar nav { display:flex; flex-direction:column; gap:2px; flex:1; }
        .sidebar nav a { display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:24px; color:var(--text-secondary); text-decoration:none; font-weight:500; font-size:0.88rem; transition:var(--transition); cursor:pointer; }
        .sidebar nav a:hover, .sidebar nav a.active { background:rgba(255,255,255,0.05); color:#fff; }
        .sidebar nav a.active { background:rgba(124,92,231,0.12); }
        .main { flex:1; display:flex; flex-direction:column; overflow-y:auto; max-height:100vh; position:relative; z-index:5; }
        .topbar { padding:14px 24px; display:flex; justify-content:space-between; align-items:center; background:rgba(6,6,26,0.7); backdrop-filter:blur(25px); border-bottom:1px solid var(--glass-border); position:sticky; top:0; z-index:20; }
        .topbar h2 { font-size:1.2rem; font-weight:700; background:var(--accent-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .btn { padding:8px 16px; border-radius:24px; font-weight:600; font-size:0.8rem; border:1.5px solid var(--glass-border); background:transparent; color:var(--text-primary); cursor:pointer; text-decoration:none; transition:var(--transition); }
        .btn-primary { background:var(--accent-gradient); border:none; color:#fff; }
        .btn-live { background:linear-gradient(135deg, #ef4444, #dc2626); border:none; color:#fff; animation:pulseLive 2s infinite; }
        @keyframes pulseLive { 0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.4);} 50%{box-shadow:0 0 0 10px rgba(239,68,68,0);} }
        .content { padding:24px; flex:1; max-width:1100px; margin:0 auto; width:100%; }
        .video-container { position:relative; width:100%; background:#000; border-radius:var(--radius-lg); overflow:hidden; margin-bottom:20px; }
        .video-container video { width:100%; display:block; max-height:500px; }
        .card { background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--radius-lg); padding:20px; backdrop-filter:blur(15px); margin-bottom:20px; }
        .tabs { display:flex; gap:4px; margin-bottom:20px; flex-wrap:wrap; }
        .tab-btn { padding:8px 18px; border-radius:24px; font-weight:600; font-size:0.82rem; border:1.5px solid var(--glass-border); background:transparent; color:var(--text-secondary); cursor:pointer; transition:var(--transition); }
        .tab-btn.active { background:var(--accent-gradient); color:#fff; border-color:transparent; }
        .tab-panel { display:none; animation:fadeSlide 0.4s ease; }
        .tab-panel.active { display:block; }
        @keyframes fadeSlide { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
        .progress-bar { height:6px; background:rgba(255,255,255,0.08); border-radius:8px; overflow:hidden; margin:12px 0; }
        .progress-fill { height:100%; background:var(--accent-gradient); border-radius:8px; width:0%; transition:width 0.5s; }
        .nav-buttons { display:flex; gap:12px; justify-content:space-between; margin-top:20px; }
        .empty-state { text-align:center; padding:30px; color:var(--text-muted); }
        .textarea-field { width:100%; padding:12px; border-radius:var(--radius-md); border:1.5px solid var(--glass-border); background:rgba(255,255,255,0.04); color:#fff; font-family:var(--font); resize:vertical; min-height:100px; }
        .menu-toggle { display:none; background:none; border:none; color:#fff; font-size:1.6rem; cursor:pointer; }
        @media (max-width:768px) {
            .sidebar { position:fixed; right:-280px; top:0; bottom:0; z-index:55; }
            .sidebar.open { right:0; }
            .menu-toggle { display:block; }
            .video-container video { max-height:300px; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="aurora"><div class="orb"></div><div class="orb"></div></div>
<div class="overlay" id="overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:40;"></div>
<aside class="sidebar" id="sidebar">
    <a href="index.html" class="logo"><div class="logo-icon">ع</div><span>لوحة التحكم</span></a>
    <nav>
        <a href="dashboard.html">🏠 الرئيسية</a>
        <a href="courses.html" class="active">📚 كورساتي</a>
        <a href="exams.html">📝 الامتحانات</a>
        <a href="results.html">📊 نتائجي</a>
        <a href="profile.html">👤 حسابي</a>
        <a href="settings.html">⚙️ الإعدادات</a>
    </nav>
</aside>
<div class="main">
    <div class="topbar">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <h2>🎬 المحاضرة</h2>
        <div><a href="courses.html" class="btn btn-sm">الكورسات</a> <button class="btn btn-sm" onclick="logout()">تسجيل الخروج</button></div>
    </div>
    <div class="content" id="lessonContent">
        <div class="empty-state">⏳ جاري تحميل المحاضرة...</div>
    </div>
</div>

<script>
(function() {
    const firebaseConfig = {
        apiKey: "AIzaSyDT0xGqGHzyyeB4qcz5AGMKxESCGZNNEWE",
        authDomain: "abdullah-khalil.firebaseapp.com",
        projectId: "abdullah-khalil",
        storageBucket: "abdullah-khalil.firebasestorage.app",
        messagingSenderId: "530661483867",
        appId: "1:530661483867:web:e2f165e9f808bcfcb8267e"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const urlParams = new URLSearchParams(window.location.search);
    const lessonId = urlParams.get('id');

    if (!lessonId) {
        document.getElementById('lessonContent').innerHTML = '<div class="empty-state">⚠️ لم يتم تحديد محاضرة</div>';
    } else {
        loadLesson(lessonId);
    }

    async function loadLesson(id) {
        const container = document.getElementById('lessonContent');
        try {
            const lessonDoc = await db.collection('lessons').doc(id).get();
            if (!lessonDoc.exists) {
                container.innerHTML = '<div class="empty-state">❌ المحاضرة غير موجودة</div>';
                return;
            }
            const lesson = lessonDoc.data();
            const progress = Math.floor(Math.random() * 70) + 15;

            container.innerHTML = `
                <div class="video-container">
                    ${lesson.video ? `<video controls src="${lesson.video}" poster="${lesson.thumbnail || ''}" style="width:100%; max-height:500px;"></video>` : '<div class="empty-state">🎬 لا يوجد فيديو حالياً</div>'}
                </div>
                <div class="card" style="margin-bottom:16px;">
                    <h2 style="font-size:1.6rem; margin-bottom:8px;">${lesson.title}</h2>
                    <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
                        <span style="color:var(--text-muted);">🕒 آخر مشاهدة: ${new Date().toLocaleDateString('ar-EG')}</span>
                        ${lesson.live ? '<button class="btn btn-live btn-sm">🔴 انضم للبث المباشر</button>' : ''}
                    </div>
                    <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
                    <span style="color:var(--text-muted); font-size:0.8rem;">${progress}% مكتمل</span>
                </div>
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('notes')">📝 ملاحظات</button>
                    <button class="tab-btn" onclick="switchTab('bookmarks')">🔖 إشارات مرجعية</button>
                    <button class="tab-btn" onclick="switchTab('homework')">📋 الواجب</button>
                    <button class="tab-btn" onclick="switchTab('exam')">📝 الامتحان</button>
                    <button class="tab-btn" onclick="switchTab('resources')">📂 موارد</button>
                </div>
                <div id="tab-notes" class="tab-panel active card">
                    <h4>ملاحظاتك</h4>
                    <textarea class="textarea-field" placeholder="اكتب ملاحظاتك هنا..."></textarea>
                    <button class="btn btn-primary" style="margin-top:8px;">💾 حفظ الملاحظات</button>
                </div>
                <div id="tab-bookmarks" class="tab-panel card">
                    <h4>الإشارات المرجعية</h4>
                    <div class="empty-state">لا توجد إشارات مرجعية. يمكنك إضافتها من مشغل الفيديو.</div>
                </div>
                <div id="tab-homework" class="tab-panel card">
                    <h4>الواجب المرتبط</h4>
                    <div class="empty-state" id="homeworkContent">⏳ جاري التحميل...</div>
                </div>
                <div id="tab-exam" class="tab-panel card">
                    <h4>الامتحان المرتبط</h4>
                    <div class="empty-state" id="examContent">⏳ جاري التحميل...</div>
                </div>
                <div id="tab-resources" class="tab-panel card">
                    <h4>الموارد والملفات</h4>
                    ${lesson.pdf ? `<a href="${lesson.pdf}" target="_blank" class="btn" style="margin:4px;">📎 تحميل PDF</a>` : '<div class="empty-state">لا توجد ملفات مرفقة</div>'}
                </div>
                <div class="nav-buttons">
                    <a href="#" class="btn" onclick="alert('الدرس السابق')">▶ الدرس السابق</a>
                    <a href="#" class="btn btn-primary" onclick="alert('الدرس التالي')">الدرس التالي ◀</a>
                </div>
            `;

            // تحميل الواجب والامتحان المرتبطين
            try {
                const assignSnap = await db.collection('assignments').where('lessonId', '==', id).limit(1).get();
                const homeworkDiv = document.getElementById('homeworkContent');
                if (!assignSnap.empty) {
                    const assign = assignSnap.docs[0].data();
                    homeworkDiv.innerHTML = `<p>${assign.desc || 'واجب'}</p><a href="assignment.html?id=${assignSnap.docs[0].id}" class="btn btn-primary btn-sm">عرض الواجب</a>`;
                } else {
                    homeworkDiv.innerHTML = 'لا يوجد واجب لهذه المحاضرة';
                }
            } catch(e) {}
            try {
                const examSnap = await db.collection('exams').where('lessonId', '==', id).limit(1).get();
                const examDiv = document.getElementById('examContent');
                if (!examSnap.empty) {
                    const exam = examSnap.docs[0].data();
                    examDiv.innerHTML = `<p>${exam.name} (${exam.time || 30} دقيقة)</p><a href="exam.html?id=${examSnap.docs[0].id}" class="btn btn-primary btn-sm">بدء الامتحان</a>`;
                } else {
                    examDiv.innerHTML = 'لا يوجد امتحان لهذه المحاضرة';
                }
            } catch(e) {}
        } catch(e) {
            console.error(e);
            container.innerHTML = '<div class="empty-state">❌ حدث خطأ أثناء تحميل المحاضرة</div>';
        }
    }

    window.switchTab = function(tabName) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        document.querySelector(`[onclick="switchTab('${tabName}')"]`).classList.add('active');
        document.getElementById(`tab-${tabName}`).classList.add('active');
    };

    window.logout = () => { localStorage.clear(); window.location.href='login.html'; };

    // Mobile sidebar
    document.getElementById('menuToggle').addEventListener('click', ()=>{
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').style.display = document.getElementById('sidebar').classList.contains('open') ? 'block' : 'none';
    });
    document.getElementById('overlay').addEventListener('click', ()=>{
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('overlay').style.display = 'none';
    });
})();
</script>
</body>
</html>
