<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="إنشاء حساب جديد في منصة مستر عبدالله خليل - كيمياء ببساطة">
    <meta name="theme-color" content="#050510">
    <title>إنشاء حساب | مستر عبدالله خليل</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <!-- Cloudinary Widget -->
    <script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>
    <style>
        :root {
            --bg-deep: #03030f;
            --glass-bg: rgba(255, 255, 255, 0.035);
            --glass-border: rgba(255, 255, 255, 0.07);
            --glass-hover: rgba(255, 255, 255, 0.06);
            --text-primary: #f0f0f7;
            --text-secondary: #b8b8d4;
            --text-muted: #6e6e90;
            --accent-1: #4da8da;
            --accent-2: #7c5ce7;
            --accent-3: #22d3bb;
            --gradient-1: linear-gradient(135deg, #4da8da 0%, #7c5ce7 50%, #22d3bb 100%);
            --gradient-2: linear-gradient(135deg, #7c5ce7 0%, #f472b6 50%, #fbbf24 100%);
            --shadow-glow: 0 0 80px rgba(124, 92, 231, 0.25);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --font-ar: 'Cairo', sans-serif;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; font-size: 16px; }
        body {
            font-family: var(--font-ar);
            background: var(--bg-deep);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
            padding: 20px;
        }
        .aurora-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .aurora-bg .orb { position: absolute; border-radius: 50%; filter: blur(140px); opacity: 0.2; animation: auroraFloat 22s infinite ease-in-out; }
        .aurora-bg .orb:nth-child(1) { width: 700px; height: 700px; background: radial-gradient(circle, #4da8da 0%, transparent 70%); top: -250px; left: -200px; }
        .aurora-bg .orb:nth-child(2) { width: 550px; height: 550px; background: radial-gradient(circle, #7c5ce7 0%, transparent 70%); bottom: -200px; right: -200px; animation-delay: -10s; }
        .aurora-bg .orb:nth-child(3) { width: 400px; height: 400px; background: radial-gradient(circle, #22d3bb 0%, transparent 70%); top: 50%; left: 40%; animation-delay: -16s; }
        @keyframes auroraFloat { 0%,100% { transform: translate(0,0) scale(1); } 25% { transform: translate(70px,-50px) scale(1.12); } 50% { transform: translate(-40px,60px) scale(0.88); } 75% { transform: translate(-60px,-35px) scale(1.06); } }
        .floating-shapes { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
        .floating-shapes .shape { position: absolute; opacity: 0.05; animation: floatShape 18s infinite ease-in-out; }
        .floating-shapes .hex { width: 70px; height: 40px; border: 2px solid rgba(255,255,255,0.4); clip-path: polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%); }
        .floating-shapes .electron { width: 10px; height: 10px; border-radius: 50%; background: var(--accent-1); box-shadow: 0 0 18px var(--accent-1); animation: electronOrbit 7s infinite linear; }
        @keyframes floatShape { 0%,100% { transform: translateY(0) rotate(0deg); } 33% { transform: translateY(-45px) rotate(8deg); } 66% { transform: translateY(25px) rotate(-5deg); } }
        @keyframes electronOrbit { 0% { transform: translate(0,0); } 25% { transform: translate(35px,-25px); } 50% { transform: translate(0,-45px); } 75% { transform: translate(-35px,-25px); } 100% { transform: translate(0,0); } }
        .mouse-glow { position: fixed; pointer-events: none; z-index: 9999; width: 450px; height: 450px; border-radius: 50%; background: radial-gradient(circle, rgba(124,92,231,0.1) 0%, transparent 60%); transform: translate(-50%,-50%); opacity: 0; transition: opacity 0.35s; }
        body:hover .mouse-glow { opacity: 1; }
        .register-container { position: relative; z-index: 10; width: 100%; max-width: 540px; animation: cardEnter 0.7s cubic-bezier(0.34,1.56,0.64,1); }
        @keyframes cardEnter { from { opacity: 0; transform: translateY(40px) scale(0.92); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .register-card {
            background: var(--glass-bg); backdrop-filter: blur(35px); -webkit-backdrop-filter: blur(35px);
            border: 1px solid var(--glass-border); border-radius: var(--radius-xl);
            padding: 40px 30px; box-shadow: 0 25px 70px rgba(0,0,0,0.6), var(--shadow-glow);
        }
        .register-header { text-align: center; margin-bottom: 28px; }
        .register-header .logo-icon {
            width: 60px; height: 60px; border-radius: var(--radius-md); background: var(--gradient-1);
            display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.6rem;
            color: #fff; margin: 0 auto 16px; box-shadow: 0 0 35px rgba(124,92,231,0.5);
            animation: logoPulse 3s infinite ease-in-out;
        }
        @keyframes logoPulse { 0%,100% { box-shadow: 0 0 35px rgba(124,92,231,0.5); } 50% { box-shadow: 0 0 55px rgba(124,92,231,0.8),0 0 80px rgba(77,168,218,0.3); } }
        .register-header h1 { font-size: 1.6rem; font-weight: 700; background: var(--gradient-2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .register-header p { color: var(--text-muted); font-size: 0.88rem; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 6px; color: var(--text-secondary); }
        .form-group input, .form-group select {
            width: 100%; padding: 13px 16px; border-radius: 30px; border: 1.5px solid var(--glass-border);
            background: rgba(255,255,255,0.04); color: #fff; font-family: var(--font-ar); font-size: 0.9rem;
            outline: none; transition: 0.25s;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--accent-2); box-shadow: 0 0 0 4px rgba(124,92,231,0.15); background: rgba(255,255,255,0.06); }
        .upload-btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: 30px; font-weight: 600; font-size: 0.85rem; background: transparent; border: 1.5px solid var(--glass-border); color: var(--text-primary); cursor: pointer; transition: var(--transition); }
        .upload-btn:hover { background: var(--glass-hover); border-color: rgba(255,255,255,0.2); }
        .btn-submit {
            width: 100%; padding: 15px; border-radius: 30px; font-weight: 700; font-size: 1rem; border: none;
            cursor: pointer; background: var(--gradient-1); color: #fff; transition: var(--transition);
            box-shadow: 0 8px 28px rgba(124,92,231,0.4); margin-top: 8px;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 14px 40px rgba(124,92,231,0.6); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .ripple-effect { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.3); transform: scale(0); animation: ripple 0.6s ease-out; pointer-events: none; }
        @keyframes ripple { to { transform: scale(4); opacity: 0; } }
        .message { padding: 12px 16px; border-radius: 30px; font-size: 0.85rem; text-align: center; margin-bottom: 16px; display: none; }
        .error-message { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.35); color: #fca5a5; animation: shake 0.5s ease; }
        @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }
        .success-message { background: rgba(34,211,187,0.12); border: 1px solid rgba(34,211,187,0.35); color: #5eeadb; }
        .links { text-align: center; margin-top: 18px; font-size: 0.85rem; }
        .links a { color: var(--accent-1); text-decoration: none; font-weight: 500; }
        .links a:hover { color: #fff; text-decoration: underline; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.25); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s infinite linear; vertical-align: middle; margin-left: 6px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 480px) { .register-card { padding: 30px 20px; border-radius: var(--radius-lg); } .register-header h1 { font-size: 1.4rem; } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="aurora-bg"><div class="orb"></div><div class="orb"></div><div class="orb"></div></div>
    <div class="floating-shapes">
        <div class="shape hex" style="top:8%;left:6%;"></div>
        <div class="shape hex" style="bottom:25%;right:10%;width:55px;height:32px;animation-delay:-6s;"></div>
        <div class="shape electron" style="top:35%;left:18%;animation-delay:-2s;"></div>
        <div class="shape electron" style="bottom:30%;right:14%;animation-delay:-7s;"></div>
    </div>
    <div class="mouse-glow" id="mouseGlow"></div>

    <div class="register-container">
        <div class="register-card">
            <div class="register-header">
                <div class="logo-icon">ع</div>
                <h1>إنشاء حساب جديد</h1>
                <p>انضم إلى منصة مستر عبدالله خليل</p>
            </div>
            <div class="error-message message" id="errorMsg"></div>
            <div class="success-message message" id="successMsg"></div>
            <form id="registerForm" autocomplete="off">
                <div class="form-group">
                    <label>الاسم بالكامل</label>
                    <input type="text" id="fullName" placeholder="أدخل اسمك الكامل" required>
                </div>
                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <input type="tel" id="phone" placeholder="01000000000" required>
                </div>
                <div class="form-group">
                    <label>رقم ولي الأمر</label>
                    <input type="tel" id="parentPhone" placeholder="01000000000" required>
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="email" placeholder="example@email.com" required>
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="password" placeholder="••••••••" required minlength="6">
                </div>
                <div class="form-group">
                    <label>الصف الدراسي</label>
                    <select id="grade" required>
                        <option value="">اختر الصف</option>
                        <option>الأول الثانوي</option>
                        <option>الثاني الثانوي</option>
                        <option>الثالث الثانوي</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>صورة البطاقة / شهادة الميلاد</label>
                    <button type="button" class="upload-btn" onclick="uploadIDCard()">📷 رفع الصورة</button>
                    <input type="hidden" id="idCardUrl">
                    <div id="idCardPreview" style="margin-top:6px; font-size:0.8rem; color:var(--text-muted);"></div>
                </div>
                <button type="submit" class="btn-submit" id="registerBtn">إنشاء الحساب</button>
            </form>
            <div class="links">
                لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
            </div>
            <div class="links" style="margin-top:4px;">
                <a href="index.html">← العودة للرئيسية</a>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const firebaseConfig = {
                apiKey: "AIzaSyDT0xGqGHzyyeB4qcz5AGMKxESCGZNNEWE",
                authDomain: "abdullah-khalil.firebaseapp.com",
                projectId: "abdullah-khalil",
                storageBucket: "abdullah-khalil.firebasestorage.app",
                messagingSenderId: "530661483867",
                appId: "1:530661483867:web:e2f165e9f808bcfcb8267e"
            };
            firebase.initializeApp(firebaseConfig);
            const auth = firebase.auth();
            const db = firebase.firestore();
            const CLOUDINARY_CLOUD = "deaevfmvm";
            const CLOUDINARY_PRESET = "ml_default";
            const CLOUDINARY_KEY = "864215656447737";

            // Mouse glow
            const mouseGlow = document.getElementById('mouseGlow');
            document.addEventListener('mousemove', e => { mouseGlow.style.left = e.clientX + 'px'; mouseGlow.style.top = e.clientY + 'px'; });
            document.addEventListener('mouseleave', () => mouseGlow.style.opacity = '0');
            document.addEventListener('mouseenter', () => mouseGlow.style.opacity = '1');

            // Ripple effect
            document.querySelectorAll('.btn-submit, .upload-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const ripple = document.createElement('span');
                    ripple.className = 'ripple-effect';
                    const rect = this.getBoundingClientRect();
                    const size = Math.max(rect.width, rect.height);
                    ripple.style.width = ripple.style.height = size + 'px';
                    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
                    ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
                    this.appendChild(ripple);
                    ripple.addEventListener('animationend', () => ripple.remove());
                });
            });

            // Cloudinary upload
            window.uploadIDCard = function() {
                window.cloudinary.openUploadWidget({
                    cloudName: CLOUDINARY_CLOUD,
                    uploadPreset: CLOUDINARY_PRESET,
                    apiKey: CLOUDINARY_KEY,
                    sources: ['local', 'camera'],
                    multiple: false,
                    resourceType: 'image',
                    clientAllowedFormats: ['png', 'jpg', 'jpeg'],
                    maxFileSize: 10000000,
                    language: 'ar'
                }, (error, result) => {
                    if (!error && result?.event === 'success') {
                        const url = result.info.secure_url;
                        document.getElementById('idCardUrl').value = url;
                        document.getElementById('idCardPreview').innerHTML = '✅ تم رفع الصورة بنجاح';
                    } else if (error) {
                        document.getElementById('idCardPreview').innerHTML = '❌ فشل الرفع، حاول مرة أخرى';
                        console.error('Cloudinary error:', error);
                    }
                });
            };

            // Form submission
            const form = document.getElementById('registerForm');
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            const registerBtn = document.getElementById('registerBtn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorMsg.style.display = 'none';
                successMsg.style.display = 'none';

                const fullName = document.getElementById('fullName').value.trim();
                const phone = document.getElementById('phone').value.trim();
                const parentPhone = document.getElementById('parentPhone').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const grade = document.getElementById('grade').value;
                const idCardUrl = document.getElementById('idCardUrl').value;

                if (!fullName || !phone || !parentPhone || !email || !password || !grade) {
                    errorMsg.textContent = 'يرجى ملء جميع الحقول المطلوبة';
                    errorMsg.style.display = 'block';
                    return;
                }
                if (!idCardUrl) {
                    errorMsg.textContent = 'يرجى رفع صورة البطاقة أو شهادة الميلاد';
                    errorMsg.style.display = 'block';
                    return;
                }
                if (password.length < 6) {
                    errorMsg.textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل';
                    errorMsg.style.display = 'block';
                    return;
                }

                registerBtn.disabled = true;
                registerBtn.innerHTML = '<span class="spinner"></span> جاري إنشاء الحساب...';

                try {
                    const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                    const user = userCredential.user;

                    // تخزين بيانات الطالب في students/{uid}
                    await db.collection('students').doc(user.uid).set({
                        name: fullName,
                        phone: phone,
                        parentPhone: parentPhone,
                        email: email,
                        grade: grade,
                        idCardUrl: idCardUrl,
                        status: 'قيد المراجعة',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    // تسجيل خروج المستخدم بعد إنشاء الحساب
                    await auth.signOut();
                    successMsg.textContent = 'تم إنشاء الحساب بنجاح! حسابك قيد المراجعة وسيتم تفعيله قريباً.';
                    successMsg.style.display = 'block';
                    registerBtn.disabled = true;
                    registerBtn.textContent = 'تم التسجيل';
                    setTimeout(() => window.location.href = 'login.html', 3000);
                } catch (error) {
                    console.error(error);
                    let message = 'حدث خطأ أثناء إنشاء الحساب';
                    if (error.code === 'auth/email-already-in-use') message = 'البريد الإلكتروني مستخدم بالفعل';
                    else if (error.code === 'auth/invalid-email') message = 'صيغة البريد الإلكتروني غير صحيحة';
                    else if (error.code === 'auth/weak-password') message = 'كلمة المرور ضعيفة جداً';
                    errorMsg.textContent = message;
                    errorMsg.style.display = 'block';
                    registerBtn.disabled = false;
                    registerBtn.textContent = 'إنشاء الحساب';
                }
            });
        })();
    </script>
</body>
</html>
